<title>Git・GitHub学習クイズ</title>
<style>
  @font-face { font-family: "system-mono"; src: local("SF Mono"); }

  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #edeae2;
    --ink: #1e2430;
    --ink-dim: #656d7a;
    --ink-faint: #9198a3;
    --border: #ded9cd;
    --accent: #2b56d6;
    --accent-ink: #ffffff;
    --accent-soft: #e8edfc;
    --good: #1c9457;
    --good-bg: #e3f5ea;
    --good-ink: #14603a;
    --bad: #c8433f;
    --bad-bg: #fbeaea;
    --bad-ink: #8f2e2b;
    --shadow: 0 1px 2px rgba(30, 36, 48, 0.04), 0 8px 24px -12px rgba(30, 36, 48, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d;
      --surface: #1b1f27;
      --surface-2: #242a34;
      --ink: #e8eaef;
      --ink-dim: #9aa3b2;
      --ink-faint: #6b7280;
      --border: #2c323d;
      --accent: #6f8dff;
      --accent-ink: #0c1220;
      --accent-soft: rgba(111, 141, 255, 0.14);
      --good: #3ed687;
      --good-bg: rgba(62, 214, 135, 0.12);
      --good-ink: #7fe8ae;
      --bad: #ff6f6a;
      --bad-bg: rgba(255, 111, 106, 0.12);
      --bad-ink: #ff9c98;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171d;
    --surface: #1b1f27;
    --surface-2: #242a34;
    --ink: #e8eaef;
    --ink-dim: #9aa3b2;
    --ink-faint: #6b7280;
    --border: #2c323d;
    --accent: #6f8dff;
    --accent-ink: #0c1220;
    --accent-soft: rgba(111, 141, 255, 0.14);
    --good: #3ed687;
    --good-bg: rgba(62, 214, 135, 0.12);
    --good-ink: #7fe8ae;
    --bad: #ff6f6a;
    --bad-bg: rgba(255, 111, 106, 0.12);
    --bad-ink: #ff9c98;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  a, button { font: inherit; color: inherit; }

  button {
    cursor: pointer;
    border: none;
    background: none;
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- top bar ---------- */

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
  }

  .brand .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--ink-dim);
    padding: 6px 4px;
    border-radius: 6px;
  }
  .back-link:hover { color: var(--ink); }

  /* ---------- home ---------- */

  h1.page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .page-sub {
    color: var(--ink-dim);
    font-size: 14.5px;
    margin: 0 0 24px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .stat-tile .label {
    font-size: 11.5px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .stat-tile .value {
    font-size: 20px;
    font-weight: 700;
  }
  .stat-tile .value.good { color: var(--good-ink); }
  .stat-tile .value.bad { color: var(--bad-ink); }

  .random-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }
  .random-btn:hover { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { .random-btn { transition: none; } }

  .random-btn .rb-text { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .random-btn .rb-title { font-weight: 700; font-size: 15px; }
  .random-btn .rb-sub { font-size: 12.5px; opacity: 0.85; }
  .random-btn .rb-arrow { font-size: 18px; opacity: 0.9; }

  .cat-rail {
    position: relative;
    padding-left: 22px;
  }

  .cat-rail::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 14px;
    bottom: 14px;
    width: 1.5px;
    background: var(--border);
  }

  .cat-item {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px 13px 16px;
    margin-bottom: 10px;
  }

  .cat-item:hover { border-color: var(--accent); }

  .cat-item::before {
    content: "";
    position: absolute;
    left: -22px;
    top: 22px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--ink-faint);
  }

  .cat-item[data-state="progress"]::before { border-color: var(--accent); background: var(--accent-soft); }
  .cat-item[data-state="done"]::before { border-color: var(--good); background: var(--good); }

  .cat-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 6px;
  }

  .cat-num {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .cat-title {
    font-size: 15.5px;
    font-weight: 600;
  }

  .cat-stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .cat-stats b.good { color: var(--good-ink); font-weight: 700; }
  .cat-stats b.bad { color: var(--bad-ink); font-weight: 700; }

  .bar-track {
    height: 4px;
    border-radius: 3px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  /* ---------- quiz ---------- */

  .quiz-head {
    margin-bottom: 18px;
  }

  .quiz-cat-label {
    font-size: 12.5px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }

  .progress-dots {
    display: flex;
    gap: 5px;
  }

  .progress-dots span {
    flex: 1;
    height: 4px;
    border-radius: 3px;
    background: var(--surface-2);
  }
  .progress-dots span[data-s="current"] { background: var(--ink-faint); }
  .progress-dots span[data-s="good"] { background: var(--good); }
  .progress-dots span[data-s="bad"] { background: var(--bad); }

  .q-eyebrow {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: 16px 0 8px;
  }

  .q-text {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.6;
    text-wrap: balance;
    margin: 0 0 18px;
  }

  .choice-list { display: flex; flex-direction: column; gap: 8px; }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .choice:not([disabled]):hover { border-color: var(--accent); }

  .choice .mark {
    flex: none;
    width: 14px;
    font-size: 13px;
    font-weight: 700;
    color: transparent;
    padding-top: 1px;
  }

  .choice .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 700;
  }

  .choice .ctext { padding-top: 2px; font-size: 14.5px; }

  .choice[data-result="correct"] {
    background: var(--good-bg);
    border-color: var(--good);
  }
  .choice[data-result="correct"] .badge { background: var(--good); color: #fff; }
  .choice[data-result="correct"] .mark { color: var(--good-ink); }

  .choice[data-result="wrong"] {
    background: var(--bad-bg);
    border-color: var(--bad);
  }
  .choice[data-result="wrong"] .badge { background: var(--bad); color: #fff; }
  .choice[data-result="wrong"] .mark { color: var(--bad-ink); }

  .choice[data-result="muted"] { opacity: 0.55; }

  .explain-panel {
    margin-top: 14px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--ink-dim);
    animation: rise 0.22s ease both;
  }
  @media (prefers-reduced-motion: reduce) { .explain-panel { animation: none; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explain-panel .tag {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .next-row { margin-top: 20px; display: flex; justify-content: flex-end; min-height: 44px; }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    padding: 11px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
  }
  :root:not([data-theme="light"]) .btn-primary,
  :root[data-theme="dark"] .btn-primary { background: var(--accent); color: var(--accent-ink); }

  .btn-ghost {
    border: 1px solid var(--border);
    padding: 11px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ---------- result ---------- */

  .result-wrap { text-align: center; padding: 30px 0 10px; }
  .result-score {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .result-score span { font-size: 20px; font-weight: 600; color: var(--ink-faint); }
  .result-rate { color: var(--ink-dim); font-size: 14px; margin: 6px 0 26px; }
  .result-actions { display: flex; gap: 10px; justify-content: center; }

  .hidden { display: none !important; }
</style>

<div id="app"></div>

<script>
  const DATA = [{"num":"1","title":"GitとGitHubの違い","questions":[{"q":"Gitの説明として最も適切なものはどれか。","choices":["ファイルをインターネット上で共有するSNS","変更履歴を記録・管理する分散型バージョン管理システム","プログラムを実行するためのエディタ","ウイルス対策のためのセキュリティソフト"],"correct":1,"explain":"Gitは、ファイルの変更履歴を記録・追跡できる「分散型バージョン管理システム」です。ネットワークがなくてもローカルのPC単体で履歴管理ができるのが大きな特徴です。"},{"q":"GitHubの説明として最も適切なものはどれか。","choices":["ローカル環境で動作するファイル共有ツール","プログラムを圧縮するための圧縮ソフト","Gitリポジトリをインターネット上で共有・管理するサービス","ウイルス対策のためのセキュリティソフト"],"correct":2,"explain":"GitHubはGitで管理されているリポジトリをインターネット上でホスティングするサービスです。共同開発やコードレビューにも活用されます。"},{"q":"GitとGitHubの関係として正しいものはどれか。","choices":["GitHubがなければGitは使えない","GitはGitHubの一機能である","GitHubを使わずGit単体でもバージョン管理はできる","GitとGitHubはまったく同じものである"],"correct":2,"explain":"Gitはツール、GitHubはそのGitリポジトリを保存・共有するためのWebサービスです。GitHubを使わなくても、Git単体でローカルのバージョン管理は可能です。"},{"q":"GitHub以外でGitリポジトリをホスティングできるサービスはどれか。","choices":["GitLab","Photoshop","Slack","Zoom"],"correct":0,"explain":"GitLabやBitbucketなど、GitHub以外にもGitリポジトリをホスティングできるサービスは複数存在します。"},{"q":"「リポジトリ（repository）」とは何か。","choices":["プログラムのエラーメッセージ一覧","プロジェクトのファイルと変更履歴を保存する場所","GitHubアカウントのパスワード","コミットを取り消すコマンド"],"correct":1,"explain":"リポジトリは、プロジェクトに関するファイルとその変更履歴（バージョン情報）をまとめて保存しておく場所のことです。"},{"q":"「ローカルリポジトリ」の説明として正しいものはどれか。","choices":["GitHub上にのみ存在するリポジトリ","自分のPC上に存在するリポジトリ","他人しかアクセスできないリポジトリ","削除済みのリポジトリ"],"correct":1,"explain":"ローカルリポジトリとは、自分のPC内に作成されたリポジトリのことです。これに対し、GitHubなどネットワーク上に置かれたリポジトリを「リモートリポジトリ」と呼びます。"},{"q":"GitHubが主にどのような用途で使われるか、最も適切なものはどれか。","choices":["動画編集","コードの共有・共同開発・コードレビュー","表計算","画像加工"],"correct":1,"explain":"GitHubはコードをオンラインで共有し、複数人での共同開発やPull Requestを使ったコードレビューを行うために広く使われています。"},{"q":"Gitがファイルの変更を記録する仕組みに近い考え方はどれか。","choices":["ファイルを上書きし、過去の状態は残さない","変更のたびにスナップショット（記録）を保存していく","毎回すべてのファイルを削除して作り直す","変更内容を暗号化して読めなくする"],"correct":1,"explain":"Gitはコミットのたびにプロジェクト全体の状態をスナップショットとして記録します。これにより、いつでも過去の状態に戻ることができます。"},{"q":"GitHubで「フォーク（fork）」を行う目的として正しいものはどれか。","choices":["他人のリポジトリを削除するため","リポジトリの履歴をリセットするため","GitHubアカウントを複数作成するため","他人のリポジトリを自分のアカウントにコピーして独自に変更するため"],"correct":3,"explain":"フォークは、他人のリポジトリを自分のアカウントにコピーすることで、自分用に変更を加えたり、Pull Requestを送ったりするための機能です。オープンソース開発で頻繁に利用されます。"},{"q":"Gitを使う主なメリットとして誤っているものはどれか。","choices":["誰がいつどこを変更したか記録できる","過去の状態に戻せる","複数人での同時編集がしやすくなる","インターネットに接続していないと一切利用できない"],"correct":3,"explain":"Gitはローカル環境だけでも変更履歴の記録やコミットが可能な分散型システムです。インターネット接続が必須なのはGitHubなどへのプッシュ・プル時のみです。"}]},{"num":"2","title":"リポジトリの基本操作","questions":[{"q":"「git init」コマンドの役割として正しいものはどれか。","choices":["リモートリポジトリを削除する","現在のフォルダを新しいGitリポジトリとして初期化する","変更内容をコミットする","ファイルをGitHubへアップロードする"],"correct":1,"explain":"git initは、現在のディレクトリをGitで管理するための新しいリポジトリとして初期化するコマンドです。実行すると隠しフォルダ「.git」が作成されます。"},{"q":"「git clone」コマンドの役割として正しいものはどれか。","choices":["リモートリポジトリを自分のPCに複製する","ファイルを完全に削除する","コミット履歴をすべて消去する","ブランチを作成する"],"correct":0,"explain":"git cloneは、GitHubなどにあるリモートリポジトリを丸ごと自分のPC（ローカル環境）にコピーするコマンドです。"},{"q":"「.git」フォルダの役割として正しいものはどれか。","choices":["画像ファイルを保存する場所","そのリポジトリの変更履歴や設定情報を管理する場所","一時的なゴミ箱","GitHubのログイン情報を保存する場所"],"correct":1,"explain":".gitフォルダには、コミット履歴やブランチ情報など、そのリポジトリをGitで管理するために必要なデータがすべて格納されています。通常のファイル操作では触らないのが基本です。"},{"q":"ローカルリポジトリにリモートリポジトリの場所を登録するコマンドはどれか。","choices":["git remote add origin","git delete origin","git push origin","git status"],"correct":0,"explain":"git remote add origin <URL>は、ローカルリポジトリに対して「origin」という名前でリモートリポジトリの接続先を登録するコマンドです。"},{"q":"GitHub上のリポジトリを「Public」に設定した場合の特徴として正しいものはどれか。","choices":["自分だけが閲覧できる","誰でもインターネット経由でリポジトリの中身を閲覧できる","自動的に削除される","コミットができなくなる"],"correct":1,"explain":"Publicリポジトリは、URLを知っている・検索した第三者を含め、誰でも中身を閲覧できる設定です。逆にPrivateは招待されたメンバーのみ閲覧可能です。"},{"q":"「git status」コマンドで確認できることはどれか。","choices":["変更されたファイルやステージング状況などの現在の状態","GitHubのアカウント残高","インターネットの通信速度","PCのバッテリー残量"],"correct":0,"explain":"git statusは、どのファイルが変更されているか、ステージング（git add）されているかなど、現在のリポジトリの状態を確認するコマンドです。"},{"q":"「.gitignore」ファイルの役割として正しいものはどれか。","choices":["Gitの管理対象から除外したいファイル・フォルダを指定する","コミットメッセージのテンプレートを作る","リポジトリを暗号化する","GitHubのユーザー名を保存する"],"correct":0,"explain":".gitignoreファイルに記載したファイルやフォルダは、Gitの追跡（バージョン管理）対象から除外されます。パスワードや一時ファイルなどを除外する際によく使われます。ただし、すでにGitで追跡されているファイルは、あとから.gitignoreに追加しても自動的には追跡対象から外れない点に注意が必要です。"},{"q":"GitHub上でリポジトリを削除できる操作として正しいものはどれか。","choices":["Insightsタブから削除する","Settingsタブの最下部にある「Delete this repository」から削除する","READMEを空にすると自動で削除される","コミットを0件にすると削除される"],"correct":1,"explain":"リポジトリの削除はSettingsタブの一番下にある「Danger Zone」から行います。取り消せない操作のため、リポジトリ名の入力など確認手順が設けられています。"},{"q":"新しいリポジトリを作る際に選べる「テンプレートリポジトリ」機能の説明として正しいものはどれか。","choices":["既存のリポジトリの構成をひな形として新規リポジトリを作成できる","他人のリポジトリを勝手に書き換えられる","リポジトリのバックアップを自動で取る機能","コミット履歴を検索する機能"],"correct":0,"explain":"テンプレートリポジトリとして登録されたリポジトリは、「Use this template」ボタンから、そのファイル構成を引き継いだ新しいリポジトリをすぐに作成できます。"},{"q":"既存のGitHubリポジトリの名前を変更するにはどうすればよいか。","choices":["リポジトリを一度削除してから作り直すしかない","Settingsタブでリポジトリ名を変更できる","READMEのタイトルを変えると自動で反映される","名前の変更はできない仕様になっている"],"correct":1,"explain":"GitHubではSettingsタブの「Repository name」欄から名前を変更できます。旧URLから新URLへは自動的にリダイレクトされますが、GitHub PagesやActionsで参照されるURLなど、一部リダイレクトされない例外もあります。"}]},{"num":"3","title":"コミットとプッシュ","questions":[{"q":"「git add」コマンドの役割として正しいものはどれか。","choices":["変更をコミット履歴として確定する","変更したファイルをステージングエリアに追加する","リモートリポジトリへ変更を送信する","ファイルを完全に削除する"],"correct":1,"explain":"git addは、変更したファイルを「次にコミットする対象」としてステージングエリアに追加するコマンドです。この時点ではまだ履歴には記録されません。"},{"q":"「git commit」コマンドの役割として正しいものはどれか。","choices":["ステージングした変更を履歴として記録する","リモートリポジトリを作成する","ファイルをダウンロードする","ブランチを削除する"],"correct":0,"explain":"git commitは、git addでステージングされた変更内容を、メッセージ付きで正式な変更履歴（コミット）として記録するコマンドです。"},{"q":"コミットメッセージを書く際に望ましい内容はどれか。","choices":["何も書かなくてよい","その変更の内容や目的が分かる簡潔な説明","絵文字だけを並べる","自分の日記を書く"],"correct":1,"explain":"コミットメッセージは、後から履歴を見返した際に「何を・なぜ変更したか」がすぐ分かるよう、簡潔で分かりやすい内容にすることが推奨されます。"},{"q":"「git push」コマンドの役割として正しいものはどれか。","choices":["ローカルのコミットをリモートリポジトリへ反映する","リモートの変更をローカルへ取り込む","コミットをすべて削除する","ファイルをステージングする"],"correct":0,"explain":"git pushは、ローカルリポジトリで作成したコミットを、GitHubなどのリモートリポジトリへアップロード（反映）するコマンドです。"},{"q":"「ステージングエリア」の説明として正しいものはどれか。","choices":["コミット済みの変更を保管する場所","次のコミットに含める変更を一時的に置いておく場所","GitHub上の公開ページ","削除されたファイルの復元場所"],"correct":1,"explain":"ステージングエリア（インデックス）は、git addされたファイルが「次にコミットする対象」として一時的に置かれる場所です。コミットするまで実際の履歴には記録されません。"},{"q":"「git log」コマンドで確認できることはどれか。","choices":["これまでのコミット履歴","PCの起動ログ","GitHubの通知一覧","インターネットの接続状況"],"correct":0,"explain":"git logは、そのリポジトリに記録されているコミットの履歴（誰が・いつ・何をコミットしたか）を一覧表示するコマンドです。"},{"q":"各コミットに割り振られる一意な識別子（英数字の文字列）を何と呼ぶか。","choices":["コミットハッシュ","パスワード","ブランチ名","IPアドレス"],"correct":0,"explain":"コミットには「コミットハッシュ」と呼ばれる一意な英数字の識別子が自動で付与されます。これを使って特定のコミットを指定したり参照したりできます。"},{"q":"「git commit -m \"メッセージ\"」の「-m」オプションの意味として正しいものはどれか。","choices":["コミットを取り消す","コミットメッセージをその場でコマンドに含めて指定する","マージを実行する","リポジトリを削除する"],"correct":1,"explain":"-mオプションを使うことで、エディタを別途開かずに、コマンドの中でそのままコミットメッセージを指定できます。"},{"q":"「git pull」と「git push」の違いとして正しいものはどれか。","choices":["pullはリモートの変更を取得、pushはローカルの変更をリモートへ送信する","pullとpushはまったく同じ動作をする","pullはファイルを削除し、pushはファイルを復元する","pullはコミットを作成し、pushはブランチを作成する"],"correct":0,"explain":"git pullはリモートリポジトリの最新の変更を自分のローカルに取り込む操作、git pushはその逆でローカルの変更をリモートへ送る操作です。"},{"q":"直前に行ったコミットのメッセージだけを修正したい場合に使うコマンドはどれか。","choices":["git commit --amend","git clone","git init","git remote"],"correct":0,"explain":"git commit --amendを使うと、直前のコミットの内容やメッセージを修正できます。誤字の修正など、公開前のコミットを整える際によく使われます。"}]},{"num":"4","title":"GitHubのUIの使い方","questions":[{"q":"GitHubの「Star」機能の役割として正しいものはどれか。","choices":["リポジトリを削除する","気に入ったリポジトリにブックマークのような印を付ける","コードを自動修正する","リポジトリを非公開にする"],"correct":1,"explain":"Starは、気になったリポジトリに印を付けて、後から自分のページからすぐ見つけられるようにする機能です。人気度の目安としても使われます。"},{"q":"GitHubの「Watch」機能の役割として正しいものはどれか。","choices":["リポジトリの動画を再生する","そのリポジトリの更新通知を受け取る","リポジトリを削除する","他人のパスワードを閲覧する"],"correct":1,"explain":"Watchを設定すると、そのリポジトリのIssueやPRなどの更新があった際に通知を受け取れるようになります。"},{"q":"リポジトリの「Insights」タブで確認できる内容はどれか。","choices":["コミット数の推移や貢献者などの統計情報","パスワードの一覧","ファイルの中身そのもの","他人のメールアドレス"],"correct":0,"explain":"Insightsタブでは、コミットの推移、貢献者（コントリビューター）、コードの変更量など、リポジトリに関する統計情報を確認できます。"},{"q":"リポジトリの「Code」タブで主にできることはどれか。","choices":["ファイル一覧の閲覧やREADMEの表示","課金設定の変更","ユーザーの退会手続き","メールの送受信"],"correct":0,"explain":"Codeタブは、そのリポジトリのデフォルト画面で、ファイル一覧、README、ブランチの切り替えなどが行える中心的なタブです。"},{"q":"リポジトリの「Settings」タブでできることはどれか。","choices":["リポジトリ名の変更や公開設定の変更など各種設定","コミット履歴の閲覧のみ","READMEの内容表示のみ","他人のリポジトリの直接編集"],"correct":0,"explain":"Settingsタブでは、リポジトリ名の変更、公開/非公開の切り替え、コラボレーターの管理、削除など、リポジトリ全体に関わる設定を行えます。"},{"q":"GitHubのプロフィールページに表示される、日々の活動量を緑の濃淡で示すマス目のグラフを何と呼ぶか。","choices":["コントリビューショングラフ（草）","コミットチャート","アクティビティバッジ","スターマップ"],"correct":0,"explain":"このグラフは通称「草」とも呼ばれ、日々のコミットなどの活動量が多いほど色が濃く表示され、継続的な活動の可視化に使われます。"},{"q":"GitHub上で特定のキーワードやユーザーのリポジトリを探す際に使う機能はどれか。","choices":["検索バー","Settingsタブ","Insightsタブ","Wiki"],"correct":0,"explain":"画面上部の検索バーから、リポジトリ名やコード内容、ユーザー名などさまざまな条件でGitHub全体を検索できます。"},{"q":"GitHubで新着のメンションやコメントなどをまとめて確認できる機能はどれか。","choices":["Notifications（通知）","Billing（請求）","Marketplace","Explore"],"correct":0,"explain":"Notifications（通知）画面では、自分が関わるIssueやPull Requestへのコメント、メンションなどの更新情報をまとめて確認できます。"},{"q":"GitHub上のブラウザ画面から、ローカルにクローンせずに直接ファイルを編集する方法はどれか。","choices":["ファイル表示画面の鉛筆アイコン（Edit）から編集する","READMEを削除する","リポジトリをフォークするしかない","Issueを作成するしかない"],"correct":0,"explain":"GitHub上でファイルを開くと表示される鉛筆アイコンをクリックすると、ブラウザ上で直接内容を編集できます。書き込み権限がある自分のリポジトリではそのままコミットできますが、権限がない他人のリポジトリでは、GitHubが自動でフォークを作成し、そこへの変更としてPull Requestを開く流れになります。"},{"q":"リポジトリに「machine-learning」「python」のようなキーワードを付けて分類しやすくする機能はどれか。","choices":["Topics（トピック）","Milestone","Assignee","Webhook"],"correct":0,"explain":"Topicsはリポジトリに関連するキーワードタグを付けられる機能で、同じテーマのリポジトリを見つけやすくするために使われます。"}]},{"num":"5","title":"READMEとライセンス","questions":[{"q":"「README.md」ファイルの主な役割として正しいものはどれか。","choices":["リポジトリの内容や使い方を説明する文書","プログラムを実行するファイル","コミット履歴を保存するファイル","パスワードを保存するファイル"],"correct":0,"explain":"README.mdは、そのプロジェクトが何であるか、使い方やセットアップ方法などを説明するための文書で、リポジトリのCodeタブの下部に自動で表示されます。"},{"q":"README.mdの拡張子「.md」が意味する形式はどれか。","choices":["Markdown形式","動画形式","画像形式","実行ファイル形式"],"correct":0,"explain":"「.md」はMarkdown形式のファイルを表す拡張子です。見出しや箇条書き、リンクなどを簡単な記法で装飾できます。"},{"q":"「LICENSE」ファイルの役割として正しいものはどれか。","choices":["そのコードをどのような条件で利用・改変・再配布してよいかを示す","コミット履歴を管理する","利用者のパスワードを保存する","エラーログを保存する"],"correct":0,"explain":"LICENSEファイルには、そのコードを他人がどのような条件で利用・改変・再配布できるかというルール（利用許諾条件）が記載されます。"},{"q":"「MITライセンス」の特徴として正しいものはどれか。","choices":["著作権表示を残せば商用利用や改変が広く認められる、比較的自由なライセンス","一切の利用・閲覧を禁止するライセンス","有料での利用のみ許可するライセンス","GitHub社の許可がなければ使えないライセンス"],"correct":0,"explain":"MITライセンスは、著作権表示とライセンス文の表示を条件に、商用利用・改変・再配布などを広く認める、比較的制限の緩いオープンソースライセンスの一つです。"},{"q":"GitHub上でリポジトリにライセンスファイルが一切設定されていない場合の扱いとして正しいものはどれか。","choices":["自動的に自由利用できるとみなされる","デフォルトでは著作権が保護され、他人が自由に使ってよいとは限らない","誰でも無条件に改変・販売できる","ライセンスがないと公開自体ができない"],"correct":1,"explain":"ライセンスが明記されていないコードは、たとえ公開されていても著作権法上は保護されており、他人が自由に利用してよいとは限りません。利用条件を明確にするためにライセンスの設定が推奨されます。"},{"q":"GitHubで新規ファイル作成時にライセンス文をテンプレートから選んで追加できる機能はどれか。","choices":["「Add file」→「Create new file」でファイル名にLICENSEと入力すると選べる「Choose a license template」","Insightsタブの機能","Star機能","Fork機能"],"correct":0,"explain":"「Add file」から「Create new file」を選び、ファイル名として「LICENSE」と入力すると、「Choose a license template」というボタンが表示されます。ここから主要なライセンス（MIT、Apache 2.0など）のテンプレートを選ぶだけで内容を自動入力できます。"},{"q":"READMEに書く内容として一般的に適切でないものはどれか。","choices":["プロジェクトの概要や目的","使い方・セットアップ手順","自分の個人的なパスワードや秘密鍵","ライセンスの種類"],"correct":2,"explain":"READMEは公開情報として誰でも閲覧できるため、パスワードや秘密鍵などの機密情報を書くべきではありません。"},{"q":"「CODE_OF_CONDUCT.md」ファイルの役割として正しいものはどれか。","choices":["プロジェクトに参加する際の行動規範やマナーを定める文書","ソースコードの一覧","課金プランの説明","エラーコードの一覧表"],"correct":0,"explain":"CODE_OF_CONDUCT.mdは、コミュニティ内で参加者が守るべき行動規範（ハラスメント禁止など）を定めた文書で、オープンソースプロジェクトでよく用意されます。"},{"q":"「CONTRIBUTING.md」ファイルの役割として正しいものはどれか。","choices":["外部の人がそのプロジェクトに貢献（コントリビュート）する際のルールや手順を説明する","リポジトリの課金情報を管理する","ユーザーのログイン履歴を記録する","画像ファイルを保存する"],"correct":0,"explain":"CONTRIBUTING.mdには、Issueの立て方やPull Requestの送り方など、外部の開発者がプロジェクトに参加・貢献する際のガイドラインが記載されます。"},{"q":"READMEの上部によく表示される、ビルド状況やテスト結果などを一目で示す小さな画像を何と呼ぶか。","choices":["バッジ（Badge）","ラベル（Label）","マイルストーン（Milestone）","ウェブフック（Webhook）"],"correct":0,"explain":"バッジは、CIのビルド状況やバージョン番号、ライセンスの種類などを一目で確認できるようにする小さなアイコン画像で、READMEの見栄えと情報量を高める目的で使われます。"}]},{"num":"6","title":"ブランチ操作とマージ","questions":[{"q":"「ブランチ（branch）」の役割として正しいものはどれか。","choices":["メインの履歴とは別に、独立して作業を進められる分岐を作る","ファイルを完全に削除する","リポジトリを非公開にする","コミットメッセージを暗号化する"],"correct":0,"explain":"ブランチを使うと、メインの開発ラインに影響を与えずに、機能追加やバグ修正などの作業を独立して進めることができます。"},{"q":"リポジトリ作成時に自動的に用意される、基準となるブランチを何と呼ぶことが多いか。","choices":["main（またはmaster）ブランチ","sub ブランチ","test ブランチ","temp ブランチ"],"correct":0,"explain":"多くのリポジトリでは「main」（旧称master）が最初から存在するデフォルトブランチとして扱われ、他のブランチはこれを基準に作成されます。"},{"q":"現在のリポジトリに存在するブランチの一覧を確認するコマンドはどれか。","choices":["git branch","git commit","git clone","git add"],"correct":0,"explain":"git branchコマンドを実行すると、原則としてローカルブランチの一覧が表示されます。リモート追跡ブランチも含めて確認したい場合はgit branch -a、リモートのブランチだけを見たい場合はgit branch -rを使います。"},{"q":"新しいブランチを作成し、同時にそのブランチへ移動するコマンドはどれか。","choices":["git switch -c 新ブランチ名","git status","git log","git remote"],"correct":0,"explain":"git switch -c（旧来はgit checkout -b）を使うと、新しいブランチを作成すると同時にそのブランチへ切り替えることができます。"},{"q":"「マージ（merge）」とは何か。","choices":["あるブランチの変更内容を別のブランチに取り込むこと","ブランチを削除すること","コミット履歴をすべて消すこと","ファイルを暗号化すること"],"correct":0,"explain":"マージは、あるブランチで行われた変更を、別のブランチ（多くの場合main）に統合して取り込む操作です。"},{"q":"同じ箇所を複数人が別々に変更したことでマージがうまくいかなくなる状態を何と呼ぶか。","choices":["コンフリクト（競合）","リセット","フォーク","クローン"],"correct":0,"explain":"コンフリクト（競合）は、複数のブランチで同じ箇所に異なる変更が加えられ、Gitが自動で統合できなくなった状態です。手動でどちらの内容を残すか判断・修正する必要があります。"},{"q":"分岐後に一方のブランチに変更がなく、履歴を一本の直線として単純に繋げられるマージを何と呼ぶか。","choices":["Fast-forward（早送り）マージ","スロー（低速）マージ","リバースマージ","デッドマージ"],"correct":0,"explain":"Fast-forwardマージは、マージ先のブランチに新しいコミットがない場合に、履歴を分岐させずそのまま指し先を進めるだけで完了するシンプルなマージ方法です。"},{"q":"不要になったブランチを削除するコマンドとして正しいものはどれか。","choices":["git branch -d ブランチ名","git init","git clone","git status"],"correct":0,"explain":"git branch -d ブランチ名を実行すると、指定したブランチを削除できます（マージ済みでない場合は-Dで強制削除が必要になることがあります）。"},{"q":"作業前に自分が今どのブランチにいるかを確認することが重要な理由として最も適切なものはどれか。","choices":["意図しないブランチへの変更・コミットを防ぐため","見た目をきれいにするため","通信速度を上げるため","パスワードを変更する必要があるため"],"correct":0,"explain":"作業しているブランチを勘違いしたまま変更・コミットすると、想定外のブランチに変更が混ざってしまうため、作業前に現在のブランチを確認する習慣が重要です。"},{"q":"「git merge」と「git rebase」の違いについて、最も適切な説明はどれか。","choices":["mergeは既存のコミットを保ったまま統合し、rebaseはコミットを別の土台に積み直して新しいコミットとして履歴を書き換える","mergeはファイルを削除し、rebaseはファイルを復元する","mergeとrebaseはまったく同じ動作をする","mergeはリモート専用、rebaseはローカル専用の機能である"],"correct":0,"explain":"mergeは既存のコミットをそのまま残して統合する操作です（分岐先に新しいコミットがないFast-forwardマージの場合は、履歴は直線のままになります）。一方rebaseはコミットの土台（ベース）を変更し、別のコミットとして履歴を積み直すことで、一本の直線の履歴に整理する操作です。"}]},{"num":"7","title":"Pull Request（PR）の流れ","questions":[{"q":"「Pull Request（PR）」とは何か。","choices":["あるブランチの変更を別のブランチに取り込んでほしいと提案・依頼する仕組み","リポジトリを完全に削除する機能","パスワードを再発行する機能","ファイルを圧縮する機能"],"correct":0,"explain":"Pull Requestは、あるブランチで行った変更を、別のブランチ（多くはmain）に取り込んでほしいと提案し、レビューを経てマージするためのGitHubの仕組みです。"},{"q":"Pull Requestを作成する主な目的として最も適切なものはどれか。","choices":["変更内容を他のメンバーに確認・レビューしてもらってから安全にマージするため","リポジトリを非公開にするため","コミット履歴を完全に消すため","自分のパスワードを変更するため"],"correct":0,"explain":"PRを経由することで、変更内容を他のメンバーがレビューし、問題がないか確認したうえでマージできるため、品質の担保やチーム内の情報共有につながります。"},{"q":"PRに対するレビュー（Review）の役割として正しいものはどれか。","choices":["変更内容を確認し、コメントや承認・修正依頼を行う","リポジトリを削除する","ブランチ名を自動生成する","コミットメッセージを暗号化する"],"correct":0,"explain":"レビューでは、他のメンバーがPRの差分（diff）を確認し、コメントを付けたり、問題がなければ承認（Approve）したりします。"},{"q":"PRのレビューにおける「Approve」と「Request changes」の違いとして正しいものはどれか。","choices":["Approveは承認、Request changesは修正が必要という意思表示","Approveは削除依頼、Request changesは承認","両者はまったく同じ意味である","Approveはコメント不可、Request changesはコメント必須"],"correct":0,"explain":"Approveは「この変更内容に問題ない」という承認の意思表示、Request changesは「マージ前に修正してほしい点がある」という差し戻しの意思表示です。"},{"q":"GitHubのPRマージ方法のうち、複数のコミットを1つにまとめてからマージする方式を何と呼ぶか。","choices":["Squash and merge","Merge commit","Rebase and merge","Fork and merge"],"correct":0,"explain":"Squash and mergeは、そのPR内の複数のコミットを1つのコミットにまとめてからマージ先のブランチに統合する方式で、履歴をすっきり保ちたい場合によく使われます。"},{"q":"まだ作業が完了しておらず、レビューの準備ができていないことを示すために使うPRの状態はどれか。","choices":["Draft（下書き）PR","Closed PR","Merged PR","Deleted PR"],"correct":0,"explain":"Draft PRは、作業途中であることを示しつつ早めに変更内容を共有したい場合に使う状態で、準備ができてから通常のPRに切り替えてレビューを依頼します。"},{"q":"PRの特定のコード行にコメントを付ける目的として最も適切なものはどれか。","choices":["その箇所についての質問・指摘・提案を具体的に伝えるため","そのコードを自動的に削除するため","コミット履歴を書き換えるため","リポジトリを非公開にするため"],"correct":0,"explain":"コード行単位でコメントを付けることで、どの部分について指摘・質問しているのかが明確になり、レビューのやり取りがしやすくなります。"},{"q":"PRをマージした後、そのために使った作業用ブランチをどうするのが一般的か。","choices":["役目を終えたら削除することが多い","絶対に削除してはいけない","自動的にmainブランチに名前が変わる","削除するとリポジトリごと消える"],"correct":0,"explain":"マージが完了した作業用ブランチは基本的に不要になるため、リポジトリを整理するために削除することが一般的です。GitHub上ではマージ後に削除ボタンが表示されます。"},{"q":"PRでコンフリクト（競合）が発生した場合、一般的な対処方法として正しいものはどれか。","choices":["競合箇所を確認し、どちらの内容を残すか手動で編集して解決する","PR自体を無条件で削除する","リポジトリごと作り直す","何もせず自動的に解決されるのを待つしかない"],"correct":0,"explain":"コンフリクトはGitが自動で判断できない変更の衝突のため、該当箇所を人が確認し、どちらの内容を残すか（あるいは両方を組み合わせるか）を手動で編集して解決します。"},{"q":"PR作成時に、記載すべき項目のフォーマットをあらかじめ用意しておく機能を何と呼ぶか。","choices":["PRテンプレート","Issueラベル","Webhook","コミットハッシュ"],"correct":0,"explain":"PRテンプレートを設定しておくと、変更内容や確認事項など記載してほしい項目のひな形が自動で入力欄に表示され、PRの説明が漏れなく統一された形式で書きやすくなります。"}]},{"num":"8","title":"GitHub Actionsの概要","questions":[{"q":"「GitHub Actions」の説明として最も適切なものはどれか。","choices":["リポジトリ内の処理を自動化できるCI/CDの仕組み","ファイルを圧縮するツール","パスワードを管理するツール","画像を編集するツール"],"correct":0,"explain":"GitHub Actionsは、テストの実行やビルド、デプロイなどの処理を、特定のイベント（プッシュなど）をきっかけに自動で実行できるCI/CD（継続的インテグレーション/デリバリー）の仕組みです。"},{"q":"GitHub Actionsのワークフローファイルが置かれるフォルダはどこか。","choices":[".github/workflows","src/actions","workflows/","assets/github"],"correct":0,"explain":"ワークフローの設定ファイル（YAML形式）は、リポジトリ内の「.github/workflows」フォルダに配置することで、GitHub Actionsに認識されます。"},{"q":"GitHub Actionsの設定ファイルによく使われる、階層構造をシンプルな書式で表現できるファイル形式はどれか。","choices":["YAML","JPEG","MP3","EXE"],"correct":0,"explain":"GitHub Actionsのワークフローは、インデント（字下げ）を使って構造を表す「YAML」形式のファイルで記述します。"},{"q":"ワークフローファイル内の「on:」の役割として正しいものはどれか。","choices":["ワークフローがどのイベントをきっかけに実行されるかを指定する","ファイルを削除するタイミングを指定する","リポジトリの色を指定する","課金プランを指定する"],"correct":0,"explain":"「on:」は、プッシュ時・PR作成時・定期実行時など、そのワークフローがどんなイベントをきっかけに動くかを指定する設定項目です。"},{"q":"GitHub Actionsにおける「ジョブ（job）」と「ステップ（step）」の関係として正しいものはどれか。","choices":["1つのジョブの中に、複数のステップ（実行される処理の単位）が含まれる","ステップの中にジョブが含まれる","ジョブとステップはまったく同じ意味である","ジョブは常に1ステップしか持てない"],"correct":0,"explain":"ワークフローは1つ以上のジョブで構成され、各ジョブの中に、コマンド実行などの具体的な処理単位である「ステップ」が順番に並びます。"},{"q":"他の人が作った再利用可能な処理（Action）を、自分のワークフローに組み込める場所はどこか。","choices":["GitHub Marketplace","GitHubのBillingページ","Insightsタブ","READMEファイル内"],"correct":0,"explain":"GitHub Marketplaceには、テスト実行や通知送信など、さまざまな用途向けに作られた再利用可能なActionが公開されており、探して選ぶ場所として使えます。実際に自分のワークフローへ組み込む際は、YAMLファイルの中でuses:を使ってそのActionを指定します。"},{"q":"「CI（継続的インテグレーション）」の目的として最も適切なものはどれか。","choices":["コードの変更を頻繁に統合し、その都度自動でビルド・テストして問題を早期に発見する","コミットメッセージを自動生成する","リポジトリを非公開にする","ユーザーのパスワードを暗号化する"],"correct":0,"explain":"CI（継続的インテグレーション）は、コードの変更をこまめに統合し、その都度自動テストやビルドを行うことで、不具合を早期に発見・修正しやすくする開発手法です。"},{"q":"「CD（継続的デリバリー/デプロイ）」の目的として最も適切なものはどれか。","choices":["テストを通過したコードを自動的に本番環境などへ配布・反映しやすくする","コミットを禁止する","リポジトリを削除する","ユーザーのアカウントを凍結する"],"correct":0,"explain":"CD（継続的デリバリー／デプロイ）は、テストを通過したコードを自動的に検証環境や本番環境へ配布・反映する仕組みで、リリース作業の手間やミスを減らす目的があります。"},{"q":"実行されたGitHub Actionsのワークフローの成功・失敗結果を確認できる場所はどこか。","choices":["リポジトリの「Actions」タブ","Settingsタブのみ","READMEファイルのみ","Issueのコメント欄のみ"],"correct":0,"explain":"リポジトリの「Actions」タブから、これまで実行されたワークフローの一覧や、それぞれの成功・失敗の結果、詳細なログを確認できます。"},{"q":"APIキーなどの機密情報をワークフロー内で安全に扱うために使う仕組みはどれか。","choices":["Secrets","README","Topics","Insights"],"correct":0,"explain":"Secretsは、APIキーやパスワードなどの機密情報を暗号化してGitHub上に保存し、ワークフロー実行時にだけ安全に読み込んで利用できる仕組みです。コード上に直接書き込むことを避けられます。"}]},{"num":"9","title":"IssuesとProjects","questions":[{"q":"GitHubの「Issue」の主な用途として正しいものはどれか。","choices":["バグ報告や機能要望、タスクなどを記録・管理する","リポジトリを削除する","パスワードを変更する","コミット履歴を暗号化する"],"correct":0,"explain":"Issueは、バグの報告や新機能の提案、やるべきタスクなどを1件ずつ記録し、議論や進捗管理を行うための機能です。"},{"q":"Issueに付けて内容を分類・整理するために使う機能はどれか。","choices":["Label（ラベル）","Fork","Clone","Merge"],"correct":0,"explain":"Labelを使うと、「bug」「enhancement」「question」などの分類をIssueに付けることができ、種類ごとに絞り込んで確認しやすくなります。"},{"q":"Issueにおける「Assignee（担当者）」の役割として正しいものはどれか。","choices":["そのIssueの対応を担当する人を割り当てる","そのIssueを自動で削除する","そのIssueのコメントを禁止する","そのIssueを非公開にする"],"correct":0,"explain":"Assigneeを設定すると、そのIssue（課題）の対応責任者が誰であるかが明確になり、チーム内での役割分担がしやすくなります。"},{"q":"複数のIssueやPRを、特定のリリースや期日に向けてグループ化する機能はどれか。","choices":["Milestone","Watch","Star","Topics"],"correct":0,"explain":"Milestoneは、「v1.0リリース」のような目標に向けて、関連するIssueやPRをまとめて進捗を管理するための機能です。"},{"q":"Pull Requestの説明文に「closes #12」のように記載する目的として正しいものはどれか。","choices":["そのPRがマージされたときに、番号12番のIssueを自動でクローズ（解決済みに）する","12番目のブランチを削除する","12個のファイルを一括削除する","12人のコラボレーターを追加する"],"correct":0,"explain":"「closes #番号」といったキーワードをPRの説明に書いておくと、そのPRがマージされた際に対応するIssueが自動的にクローズされ、対応関係が分かりやすくなります。ただしこの自動クローズは、PRがデフォルトブランチ（多くはmain）を対象としている場合に働く仕組みで、それ以外のブランチを対象とするPRではキーワードが自動クローズとして機能しません。"},{"q":"GitHub Projectsの「カンバンボード」のような機能で管理できることはどれか。","choices":["ToDo・進行中・完了などの状態ごとにタスク（IssueやPR）を並べて進捗管理する","コミットメッセージを暗号化する","リポジトリの容量を圧縮する","パスワードを再発行する"],"correct":0,"explain":"GitHub Projectsでは、item（アイテム）として表示されるIssueやPRを「ToDo」「進行中」「完了」などの列に並べ替えることで、プロジェクト全体の進捗を視覚的に管理できます。"},{"q":"新規Issue作成時に、記載してほしい項目をあらかじめ用意しておく機能を何と呼ぶか。","choices":["Issueテンプレート","PRテンプレート","READMEテンプレート","Actionsテンプレート"],"correct":0,"explain":"Issueテンプレートを設定しておくと、「再現手順」「期待する動作」など報告に必要な項目のひな形が自動表示され、内容の抜け漏れを防ぎやすくなります。"},{"q":"対応が完了したIssueを終了状態にする操作を何と呼ぶか。","choices":["Close（クローズ）する","Delete（完全削除）する","Merge（マージ）する","Fork（フォーク）する"],"correct":0,"explain":"対応が完了したIssueは「Close」することで終了状態になります。削除とは異なり、履歴として内容は残ったまま「解決済み」として扱われます。"},{"q":"Issueやコメントの中で、特定のユーザーに通知を送りつつ言及するために使う記法はどれか。","choices":["@ユーザー名","#ユーザー名","$ユーザー名","&ユーザー名"],"correct":0,"explain":"「@ユーザー名」と記述すると、そのユーザーに通知が届き、コメント内で特定の相手に呼びかける（メンションする）ことができます。"},{"q":"GitHub ProjectsとIssueの関係として正しいものはどれか。","choices":["Projectsのボード上にIssueやPRをitem（アイテム）として紐づけて管理できる","Projectsを作るとすべてのIssueが自動で削除される","ProjectsとIssueはまったく別のサービスで連携できない","Projectsを使うとIssueが作成できなくなる"],"correct":0,"explain":"GitHub Projectsは、既存のIssueやPRをitem（アイテム）としてボード上に配置し、進捗状況に応じて整理・管理するための機能で、Issueと密接に連携しています。"}]},{"num":"10","title":"タグとリリース","questions":[{"q":"Gitにおける「タグ（tag）」の役割として正しいものはどれか。","choices":["特定のコミットに、バージョン番号などの目印となる名前を付ける","ブランチを削除する","ファイルをステージングする","コミットメッセージを暗号化する"],"correct":0,"explain":"タグは、特定の時点のコミットに「v1.0.0」のような分かりやすい名前を付けて、そのバージョンをすぐに参照できるようにする機能です。"},{"q":"現在のコミットに新しいタグを作成するコマンドとして正しいものはどれか。","choices":["git tag v1.0.0","git branch v1.0.0","git clone v1.0.0","git status v1.0.0"],"correct":0,"explain":"git tag タグ名（例：git tag v1.0.0）を実行すると、現在のコミットにそのタグ名を付けることができます。"},{"q":"「v1.2.3」のようなバージョン表記の付け方を何と呼ぶか。","choices":["セマンティックバージョニング","コミットハッシュ","ブランチ命名規則","コンフリクト表記"],"correct":0,"explain":"セマンティックバージョニングは「メジャー.マイナー.パッチ」の形式でバージョンを表し、変更の大きさや互換性の有無を数字のルールに沿って表現する広く使われる命名規則です。"},{"q":"GitHubの「Release（リリース）」機能の説明として正しいものはどれか。","choices":["特定のタグを基に、変更内容やダウンロード用ファイルなどをまとめて公開する機能","リポジトリを完全に削除する機能","コミットメッセージを一括変換する機能","他人のパスワードを表示する機能"],"correct":0,"explain":"Release機能を使うと、タグを基準に「バージョン1.0を公開しました」といった形で、変更内容の説明やダウンロード用のファイル（Assets）をまとめて公開できます。"},{"q":"リリースの際に記載する、変更点や新機能などをまとめた文書を何と呼ぶか。","choices":["リリースノート","コミットハッシュ","プルリクエスト","Issueテンプレート"],"correct":0,"explain":"リリースノートは、そのバージョンで追加・修正・変更された内容を利用者に分かりやすく伝えるための文書で、Release作成時に記入します。"},{"q":"「タグ」と「ブランチ」の違いとして正しいものはどれか。","choices":["ブランチは新しいコミットが追加されると先端が進むが、タグは特定のコミットを指したまま基本的に動かない","タグは変更を続けられるが、ブランチは動かせない","タグとブランチはまったく同じ機能である","タグはリモートにのみ存在し、ブランチはローカルにのみ存在する"],"correct":0,"explain":"ブランチは新しいコミットを追加すると先端の位置が進んでいきますが、タグはある時点のコミットに固定された目印であり、通常はその後動くことはありません。"},{"q":"ローカルで作成したタグをリモートリポジトリへ反映させるコマンドとして正しいものはどれか。","choices":["git push --tags","git pull --tags","git clone --tags","git status --tags"],"correct":0,"explain":"通常のgit pushだけではタグは送信されないため、タグをリモートへ反映させるにはgit push --tags（または個別指定でのpush）を使う必要があります。"},{"q":"GitHubのReleaseページで、実行ファイルやビルド済みファイルなどを添付できる項目を何と呼ぶか。","choices":["Assets（アセット）","Labels（ラベル）","Milestones（マイルストーン）","Topics（トピック）"],"correct":0,"explain":"AssetsはReleaseに添付できるファイルの領域で、ソースコードのzipに加えて、ビルド済みの実行ファイルなどを利用者向けに配布する際によく使われます。"},{"q":"正式版として公開する前の、テスト段階のバージョンとしてリリースするときに使う設定はどれか。","choices":["Pre-release（プレリリース）","Draft PR","Fork","Watch"],"correct":0,"explain":"Pre-releaseとして公開すると、正式版とは区別して「試験的なバージョン」であることを利用者に明示できます。"},{"q":"そのリポジトリの最新の正式リリースバージョンを確認できる場所はどこか。","choices":["リポジトリの「Releases」ページ","Settingsタブのみ","コミットメッセージの本文のみ",".gitignoreファイルの中"],"correct":0,"explain":"リポジトリの右側やReleasesページから、これまで公開されたリリースの一覧や、現在の最新バージョンを確認できます。"}]},{"num":"11","title":"チーム開発におけるGitフロー","questions":[{"q":"「Gitフロー（ブランチ運用ルール）」を決める目的として最も適切なものはどれか。","choices":["チームで一貫したブランチの使い方を共有し、開発を混乱なく進めるため","リポジトリを非公開にするため","コミットメッセージを暗号化するため","GitHubの利用料金を下げるため"],"correct":0,"explain":"チーム開発では、ブランチの作り方やマージのタイミングなどのルール（ブランチ戦略）を決めておくことで、複数人が同時に作業しても混乱や事故を防ぎやすくなります。"},{"q":"新機能の開発用に切られる、一時的な作業ブランチを一般的に何と呼ぶか。","choices":["feature（フィーチャー）ブランチ","delete ブランチ","readonly ブランチ","public ブランチ"],"correct":0,"explain":"featureブランチは、特定の機能追加や修正のために作成される作業用ブランチで、完成後にmainなどへマージし、役目を終えたら削除するのが一般的な運用です。"},{"q":"「GitHub Flow」と呼ばれる比較的シンプルなブランチ運用の基本的な流れとして正しいものはどれか。","choices":["mainブランチから作業用ブランチを切り、変更後にPRを作成してレビューを経てmainにマージする","常にmainブランチに直接コミットし続ける","ブランチは一切作成せず全員で1つの履歴を共有する","リポジトリごとに毎回作り直す"],"correct":0,"explain":"GitHub Flowは、mainブランチから作業用ブランチを作成し、変更をPull Requestとして提出、レビューを経てmainにマージするというシンプルな運用方法です。"},{"q":"mainブランチへのマージ時にレビューの承認を必須にするなど、ルールを強制できるGitHubの設定はどれか。","choices":["ブランチ保護ルール（Branch protection rules）","READMEファイル","Topics","Watch設定"],"correct":0,"explain":"ブランチ保護ルールを設定すると、レビュー承認なしのマージや、直接プッシュを禁止するなど、特定のブランチに対するルールを強制できます。"},{"q":"mainブランチへの直接プッシュを禁止し、必ずPR経由でのマージを求める理由として最も適切なものはどれか。","choices":["レビューを経ることで不具合の混入を防ぎ、変更内容をチームで把握しやすくするため","ファイル容量を減らすため","GitHubの利用料金を下げるため","コミットメッセージを自動生成するため"],"correct":0,"explain":"直接プッシュを許可すると、未確認のままコードがmainに入ってしまうリスクがあります。PR経由に統一することで、レビューというチェックポイントを必ず通すことができます。"},{"q":"「Squash and merge」を使う利点として最も適切なものはどれか。","choices":["PR内の細かい試行錯誤のコミットを1つにまとめ、mainの履歴を見やすく保てる","ファイルを自動で暗号化できる","リポジトリの容量を無制限にできる","レビューを不要にできる"],"correct":0,"explain":"作業中は細かい修正コミットが積み重なりがちですが、Squash and mergeでそれらを1つのコミットにまとめることで、mainブランチの履歴をすっきりと分かりやすく保てます。"},{"q":"長期間ブランチを分けたまま作業を続けた場合に起こりやすい問題を防ぐための工夫として適切なものはどれか。","choices":["こまめにmainの変更を自分のブランチに取り込む（pullやmergeする）","一切pullをせず最後にまとめて取り込む","ブランチを作らずすべて直接mainで作業する","コミットメッセージを空にする"],"correct":0,"explain":"作業ブランチを長期間放置すると、mainとの差分が大きくなりコンフリクトが起きやすくなります。こまめに最新のmainを取り込むことで、コンフリクトを小さく抑えやすくなります。具体的にはgit fetch originでリモートの情報を取得したうえで、git merge origin/main（履歴を直線にしたい場合はgit rebase origin/main）を行います。なお、git pullは「現在のブランチに設定された上流ブランチを取得・統合する」操作のため、設定によっては必ずしもmainを取り込むとは限らない点に注意が必要です。"},{"q":"特定のファイルやディレクトリの変更時に、必ずレビューしてほしい人を自動的に指定できるファイルはどれか。","choices":["CODEOWNERS","README.md",".gitignore","LICENSE"],"correct":0,"explain":"CODEOWNERSファイルを設定すると、指定したファイルやフォルダに変更があったPRに対して、担当者が自動的にレビュアーとして割り当てられます。"},{"q":"本番リリースに向けた最終調整を行うために、mainとは別に用意されるブランチを何と呼ぶことが多いか。","choices":["リリースブランチ","ゴミ箱ブランチ","隠しブランチ","パスワードブランチ"],"correct":0,"explain":"リリースブランチは、特定バージョンのリリース準備（最終調整やバグ修正）のために一時的に作成されるブランチで、チームによってはこうした運用ルールを採用しています。"},{"q":"「feat:」「fix:」のように種類を先頭に付けてコミットメッセージを統一するような規約を設ける目的として正しいものはどれか。","choices":["変更の種類が一目で分かるようにし、履歴の把握や自動化をしやすくするため","コミットメッセージを見えなくするため","ファイルサイズを圧縮するため","リポジトリを非公開にするため"],"correct":0,"explain":"Conventional Commitsのようなコミットメッセージの規約を設けると、変更が機能追加なのか修正なのかが一目で分かり、履歴の把握やリリースノートの自動生成などがしやすくなります。"}]},{"num":"12","title":"GitHub Actionsのカスタマイズ","questions":[{"q":"ワークフロー内でAPIのURLなど繰り返し使う値を変数として設定できる項目はどれか。","choices":["env（環境変数）","on","jobs","runs-on"],"correct":0,"explain":"envを使うと、ワークフロー・ジョブ・ステップ単位で環境変数を設定でき、繰り返し使う値をまとめて管理できます。"},{"q":"複数のバージョンやOSの組み合わせで同時にテストを実行できる仕組みを何と呼ぶか。","choices":["マトリックスビルド（matrix）","シングルビルド","ドラフトビルド","サイレントビルド"],"correct":0,"explain":"マトリックスビルドを使うと、たとえば「Node.jsのバージョン違い×OS違い」のような複数の組み合わせを自動生成し、同時並行でテストを実行できます。"},{"q":"Windows・macOS・Linuxなど複数のOS環境でジョブを実行したい場合に指定する項目はどれか。","choices":["runs-on","on","env","secrets"],"correct":0,"explain":"runs-onは、そのジョブをどのOS環境（ubuntu-latest、windows-latestなど）で実行するかを指定する設定項目です。複数指定してマトリックスビルドと組み合わせることもできます。"},{"q":"共通処理を別ファイルに切り出し、複数のワークフローから呼び出して使い回せる仕組みを何と呼ぶか。","choices":["再利用可能なワークフロー（reusable workflow）","使い捨てワークフロー","隠しワークフロー","手動ワークフロー"],"correct":0,"explain":"再利用可能なワークフローとして共通処理を切り出しておくと、複数のリポジトリやワークフローから呼び出して同じ処理を使い回すことができ、重複した記述を減らせます。"},{"q":"コードのプッシュなど自動トリガーではなく、ボタン操作で手動でワークフローを実行できるようにする設定はどれか。","choices":["workflow_dispatch","push","pull_request","schedule"],"correct":0,"explain":"workflow_dispatchを設定すると、GitHubのActionsタブから「Run workflow」ボタンを押すことで、任意のタイミングで手動実行できるようになります。"},{"q":"特定のブランチ（例：mainのみ）へのプッシュ時だけワークフローを実行するにはどうすればよいか。","choices":["on: push: branches: の設定で対象ブランチを指定する","全ブランチで無条件に実行する以外の方法はない","ブランチごとに別リポジトリを作るしかない","手動でその都度コピー＆ペーストする"],"correct":0,"explain":"onのpush設定内にbranchesを指定することで、特定のブランチへのプッシュ時のみワークフローを実行するよう絞り込むことができます。"},{"q":"依存パッケージのインストール結果などを一時保存し、次回以降の実行を高速化する仕組みを何と呼ぶか。","choices":["キャッシュ（cache）","シークレット（secrets）","ラベル（label）","マイルストーン（milestone）"],"correct":0,"explain":"キャッシュを利用すると、依存関係のインストール結果などを保存しておき、次回以降の実行時に再利用することで、ワークフローの実行時間を短縮できます。"},{"q":"GitHubが用意する標準の実行環境ではなく、自分たちで用意したマシンでActionsを実行する仕組みを何と呼ぶか。","choices":["セルフホストランナー","パブリックランナー","ゲストランナー","ドラフトランナー"],"correct":0,"explain":"セルフホストランナーは、GitHubが提供する共有環境ではなく、自社サーバーなど独自に用意したマシンでワークフローを実行できる仕組みで、特殊な環境やスペックが必要な場合に使われます。"},{"q":"特定の条件を満たした場合のみステップを実行したいときに使う設定項目はどれか。","choices":["if:","on:","env:","name:"],"correct":0,"explain":"if:を使うと、直前のステップの結果やブランチ名などの条件に応じて、そのステップを実行するかどうかを制御できます。"},{"q":"毎日決まった時刻など、定期的にワークフローを自動実行したいときに使う設定はどれか。","choices":["schedule（cron形式）","push","workflow_dispatch","pull_request"],"correct":0,"explain":"scheduleトリガーではcron形式で時刻や曜日を指定でき、「毎朝9時に実行」のような定期実行のワークフローを組むことができます。ただし「指定した時刻に必ず実行される」わけではなく、GitHub全体が混雑している時間帯には実行が遅延することがあります。また対象になるのはデフォルトブランチ上のワークフローで、時刻はIANAタイムゾーンを指定できますが、指定しない場合はUTC基準で動作します。"}]},{"num":"13","title":"セキュリティ関連","questions":[{"q":"GitHubアカウントの安全性を高めるために設定が推奨されている、パスワードに加えてもう一つの認証要素を求める仕組みはどれか。","choices":["2段階認証（2FA）","フォーク","ウォッチ","スター"],"correct":0,"explain":"2段階認証（2FA）を設定すると、パスワードに加えてスマートフォンアプリなどでの追加認証が必要になり、万一パスワードが漏れても不正ログインされにくくなります。"},{"q":"コマンドラインやAPIからGitHubへアクセスする際に、パスワードの代わりに使う文字列を何と呼ぶか。","choices":["Personal Access Token（個人アクセストークン）","README","Milestone","Topics"],"correct":0,"explain":"Personal Access Token（PAT）は、パスワードの代わりにコマンドラインやAPI経由でGitHubにアクセスするための認証用文字列で、権限の範囲を細かく設定できます。"},{"q":"パスワードを毎回入力せずに安全にGitHubへ接続する方法として、鍵ペアを使う認証方式はどれか。","choices":["SSHキー認証","READMEファイルへの記載","Issueへのコメント","Insightsタブの閲覧"],"correct":0,"explain":"SSHキー認証は、公開鍵と秘密鍵のペアを使ってGitHubに安全に接続する方式で、一度設定すればパスワードなしでプッシュやプルが行えるようになります。"},{"q":"リポジトリが使用しているライブラリに脆弱性が見つかった際、自動的に検知・通知してくれるGitHubの機能はどれか。","choices":["Dependabot","Watch","Star","Topics"],"correct":0,"explain":"Dependabotは、リポジトリが依存しているライブラリの脆弱性を自動でチェックし、問題が見つかった場合に通知したり、修正のPRを自動で作成してくれる機能です。"},{"q":"APIキーやパスワードなどの機密情報が誤ってコード内にコミットされていないかを検知するGitHubの機能はどれか。","choices":["Secret scanning","Fork","Milestone","Topics"],"correct":0,"explain":"Secret scanningは、コード内にAPIキーなどの機密情報がうっかり含まれていないかを自動で検出し、検知した場合にアラートを出す機能です。"},{"q":"APIキーやパスワードなどを含む「.env」ファイルをリポジトリにコミットしないほうがよい理由として正しいものはどれか。","choices":["Publicリポジトリでは誰でも閲覧でき、機密情報が漏えいするおそれがあるため","ファイルサイズが大きくなりすぎるため",".envファイルはGitで扱えない形式のため","コミット回数の上限を超えてしまうため"],"correct":0,"explain":"Publicリポジトリはもちろん、Privateでも共有範囲によっては情報が漏れるリスクがあるため、機密情報を含む.envファイルは.gitignoreに追加してコミット対象から除外するのが基本です。"},{"q":"Privateリポジトリであっても注意すべきこととして最も適切なものはどれか。","choices":["コラボレーター（共同編集者）の招待範囲や権限を適切に管理する必要がある","Privateなら何をコミットしても絶対に安全である","Privateリポジトリはバックアップが不要である","Privateリポジトリはウイルスに感染しない"],"correct":0,"explain":"Privateリポジトリでも、招待されたコラボレーターは中身を閲覧できるため、誰にどの権限を与えるかの管理は引き続き重要です。「非公開だから絶対安全」とは言えません。"},{"q":"誤ってAPIキーをリポジトリにコミット・公開してしまった場合、まず行うべき対応として最も適切なものはどれか。","choices":["該当のAPIキーを無効化（失効）し、新しいキーを発行し直す","何もせずそのまま放置する","リポジトリの名前だけを変更する","READMEの文字色を変える"],"correct":0,"explain":"一度公開された機密情報は履歴から完全に消すのが難しいため、まずはそのAPIキー自体を無効化・再発行することが最優先の対応となります。"},{"q":"ブランチ保護ルールで「強制プッシュ（force push）」を禁止する目的として正しいものはどれか。","choices":["他人が積み上げたコミット履歴を意図せず上書き・消失させてしまうのを防ぐため","リポジトリの容量を減らすため","コミットメッセージを自動生成するため","ファイルの拡張子を統一するため"],"correct":0,"explain":"強制プッシュは履歴を書き換えてしまう操作のため、共有ブランチで許可すると他のメンバーの変更が失われる危険があります。ブランチ保護ルールで禁止することでこれを防げます。"},{"q":"コード内の潜在的なセキュリティ上の問題を自動で解析・検出するGitHubの機能はどれか。","choices":["Code scanning（CodeQLなど）","Star","Watch","Topics"],"correct":0,"explain":"Code scanningは、CodeQLなどの解析エンジンを使ってソースコード内の脆弱性やセキュリティ上のリスクを自動で検出し、アラートとして知らせてくれる機能です。"}]},{"num":"14","title":"GitHub CLIとAPI","questions":[{"q":"「GitHub CLI（gh）」の説明として最も適切なものはどれか。","choices":["ターミナル（コマンドライン）上からGitHubの操作を行えるツール","GitHub専用の画像編集アプリ","GitHubのパスワード管理アプリ","GitHubの動画配信サービス"],"correct":0,"explain":"GitHub CLI（ghコマンド）は、ブラウザを開かなくてもターミナルからリポジトリの操作、PRやIssueの作成・確認などが行える公式のコマンドラインツールです。"},{"q":"GitHub CLIを使ってリポジトリをクローンするコマンドはどれか。","choices":["gh repo clone リポジトリ名","gh pr merge","gh issue close","gh auth logout"],"correct":0,"explain":"gh repo cloneコマンドを使うと、GitHub CLIから直接リポジトリをローカルにクローンできます。"},{"q":"GitHub CLIを使って、現在のブランチからPull Requestを作成するコマンドはどれか。","choices":["gh pr create","gh repo create","gh issue create","gh release create"],"correct":0,"explain":"gh pr createコマンドを使うと、ブラウザ画面を開かずにターミナル上でPull Requestを作成できます。"},{"q":"GitHubが提供する、プログラムから様々な操作（リポジトリ作成やIssue取得など）を行える仕組みを何と呼ぶか。","choices":["GitHub API","GitHub Pages","GitHub Copilot","GitHub Sponsors"],"correct":0,"explain":"GitHub APIを使うと、Webブラウザを介さずにプログラムからGitHub上のリポジトリ・Issue・PRなどの情報取得や操作を自動化できます。"},{"q":"GitHubのREST APIとGraphQL APIの違いとして最も適切なものはどれか。","choices":["GraphQL APIは必要なデータだけを1回のリクエストでまとめて取得しやすい設計になっている","REST APIとGraphQL APIはまったく同じ仕組みである","GraphQL APIは無料で使えず、REST APIのみ無料である","REST APIは画像専用、GraphQL APIはテキスト専用のAPIである"],"correct":0,"explain":"REST APIはエンドポイントごとに決まった形式でデータを返すのに対し、GraphQL APIは欲しいデータの構造を指定して1回のリクエストで効率よく取得できるのが特徴です。"},{"q":"GitHub APIを利用する際、多くの場合に必要となるものはどれか。","choices":["アクセストークンなどによる認証","紙のパスポート","郵送での申請書","電話での口頭確認"],"correct":0,"explain":"GitHub APIを利用する際は、Personal Access Tokenなどを使った認証が一般的に必要で、これによりアクセス権限の範囲を制御できます。"},{"q":"リポジトリ内で特定のイベント（プッシュなど）が起きた際に、外部のURLへ自動的に通知を送る仕組みを何と呼ぶか。","choices":["Webhook","README","Milestone","Topics"],"correct":0,"explain":"Webhookを設定すると、プッシュやIssue作成などのイベントが発生した際に、指定した外部サービスのURLへ自動でデータを送信し、通知や連携処理を行うことができます。"},{"q":"GitHub CLIを使って自分に割り当てられたIssueの一覧を確認するコマンドはどれか。","choices":["gh issue list --assignee \"@me\"","gh pr list","gh repo list","gh release list"],"correct":0,"explain":"gh issue listは、そのままだと現在のリポジトリの未完了Issueを一覧表示するだけです。自分に割り当てられたIssueだけに絞り込むには、--assignee \"@me\"のようにオプションを付けて実行します。"},{"q":"GitHub APIを短時間に大量に呼び出そうとすると発生する、一定時間あたりの利用回数の上限を何と呼ぶか。","choices":["レート制限（Rate limit）","ブランチ保護","コンフリクト","マイグレーション"],"correct":0,"explain":"GitHub APIには一定時間あたりに呼び出せる回数の上限（レート制限）が設けられており、これを超えるとエラーが返され、しばらく待つ必要があります。"},{"q":"GitHub CLIを初めて使う際に、自分のGitHubアカウントと連携（ログイン）するためのコマンドはどれか。","choices":["gh auth login","gh auth logout","gh repo delete","gh pr close"],"correct":0,"explain":"gh auth loginコマンドを実行すると、ブラウザまたはトークンを使った認証手順が案内され、GitHub CLIと自分のアカウントを連携できます。"}]},{"num":"15","title":"GitHub Copilotの活用","questions":[{"q":"「GitHub Copilot」の説明として最も適切なものはどれか。","choices":["AIがコードの入力を補完・提案してくれる開発支援ツール","リポジトリを自動で削除するツール","パスワードを自動生成するツール","動画を自動編集するツール"],"correct":0,"explain":"GitHub Copilotは、AIが文脈に応じてコードの続きや関数の実装案などを提案してくれる、エディタ上で使う開発支援ツールです。"},{"q":"GitHub Copilotが提案したコードを利用する際に注意すべきこととして最も適切なものはどれか。","choices":["提案内容が正しく安全かを自分で確認してから採用する","内容を確認せず必ずそのまま採用する","提案されたコードは絶対にバグを含まない","提案内容の確認は一切不要である"],"correct":0,"explain":"Copilotの提案はあくまでAIによる予測であり、誤りや意図と異なる実装が含まれることもあるため、内容を理解・確認したうえで採用するかどうかを判断する必要があります。"},{"q":"会話形式でコードの説明や修正案を尋ねられるGitHub Copilotの機能を何と呼ぶか。","choices":["Copilot Chat","Copilot Release","Copilot Milestone","Copilot Topics"],"correct":0,"explain":"Copilot Chatは、チャット形式で「このコードの意味を説明して」「このエラーを直して」のように質問・依頼ができる、対話型のAI支援機能です。"},{"q":"GitHub Copilotを利用するために一般的に必要なものはどれか。","choices":["GitHubアカウントと、用途に合ったCopilotプラン（Freeを含む）","紙の使用許諾書への署名","専用の追加PC","特別なインターネット回線契約"],"correct":0,"explain":"GitHub Copilotの利用にはGitHubアカウントと、Copilotのプランへの加入が必要です。以前は有料プランが前提でしたが、現在は利用回数などに制限のある個人向けCopilot Freeが用意されており、支払いなしで使い始めることもできます。より多く使いたい場合は有料プラン（Pro等）への加入が必要です。"},{"q":"GitHub Copilotのようなコード補完AIが提案を生成する際の一般的な特徴として正しいものはどれか。","choices":["大量のコードなどのデータをもとに学習したモデルから、文脈に合いそうな内容を予測して提示する","常に人間の担当者が手作業で一件ずつ回答している","インターネット接続なしでも一切動作原理が変わらない魔法である","提案内容は必ず100%正確であることが保証されている"],"correct":0,"explain":"Copilotのようなツールは、大量のコードなどを学習したAIモデルが、入力された文脈から「続きとして自然な内容」を予測して提案する仕組みで動いており、常に完璧な正解を保証するものではありません。"},{"q":"エディタ上でGitHub Copilotが表示した提案を採用する際の一般的な操作はどれか。","choices":["Tabキーなどで提案を確定し、不要ならEscなどで却下する","PCを再起動しないと採用できない","必ずマウスで1文字ずつクリックする必要がある","採用も却下もできない仕様である"],"correct":0,"explain":"多くのエディタでは、Copilotが薄い色で表示する提案をTabキーで確定（採用）し、不要であればEscキーなどでそのまま無視（却下）する操作が一般的です。"},{"q":"Pull Requestの変更内容を要約した説明文の下書きをAIが自動生成してくれる機能を何と呼ぶか。","choices":["Copilot pull request summaries（CopilotによるPR要約）","Copilot Release Notes","Copilot Branch Protection","Copilot Webhook"],"correct":0,"explain":"Copilot pull request summariesと呼ばれる機能により、PRの差分内容をもとに説明文の下書きを自動生成でき、PR作成時の記述の手間を減らすことができます。あくまで下書きのため、最終的な内容の確認は必要です。"},{"q":"GitHub Copilotを利用する際に意識しておくべき著作権上の注意点として最も適切なものはどれか。","choices":["提案されたコードが既存コードの一部と酷似する場合があるため、利用条件などを踏まえて確認する","AIが生成したものは著作権を一切考える必要がない","提案コードは必ず自分のオリジナルとして扱ってよい","著作権の問題はCopilotには一切関係しない"],"correct":0,"explain":"Copilotは大量の既存コードを学習しているため、まれに既存コードと似た提案が出ることがあります。利用にあたっては提供元が示す利用条件を踏まえ、必要に応じて内容を確認することが望ましいとされています。"},{"q":"GitHub Copilotが利用できる代表的な開発環境（エディタ）はどれか。","choices":["Visual Studio Codeなどの対応エディタ","紙のノートとペンのみ","電卓アプリのみ","動画再生アプリのみ"],"correct":0,"explain":"GitHub Copilotは、Visual Studio CodeやVisual Studioなど、対応した各種エディタ・IDEに拡張機能として組み込んで利用します。"},{"q":"GitHub Copilotの利用が向いていない、注意が必要な場面として最も適切なものはどれか。","choices":["パスワードやAPIキーなど機密情報そのものを扱わせるような使い方","変数名の候補を考えてもらう場面","定型的なコードの雛形を提案してもらう場面","コメントからコードの概要を書いてもらう場面"],"correct":0,"explain":"Copilotは入力された内容を処理に利用するため、パスワードやAPIキーなどの機密情報を直接入力・生成させるような使い方は避け、機密情報の取り扱いには別途注意する必要があります。"}]}];
  const STORAGE_KEY = "gitgithub-quiz-progress-v1";

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
  }

  let progress = loadProgress();

  function ensureCat(ci) {
    if (!progress[ci]) {
      progress[ci] = { seen: new Array(DATA[ci].questions.length).fill(false), hits: 0, misses: 0, combo: 0, best: 0 };
    }
    return progress[ci];
  }

  const app = document.getElementById("app");

  // ---- session state for an in-progress quiz ----
  let session = null; // { catIndex, order: [qIndexes], pos, answers: [null|bool], isRandom, pool: [{ci,qi}] }

  function letters() { return ["ア", "イ", "ウ", "エ"]; }

  function overallStats() {
    let answered = 0, hits = 0, misses = 0, best = 0;
    DATA.forEach((c, i) => {
      const p = progress[i];
      if (!p) return;
      answered += p.seen.filter(Boolean).length;
      hits += p.hits;
      misses += p.misses;
      best = Math.max(best, p.best || 0);
    });
    return { answered, hits, misses, best, total: DATA.reduce((s, c) => s + c.questions.length, 0) };
  }

  function renderHome() {
    session = null;
    const os = overallStats();
    const rate = os.hits + os.misses > 0 ? Math.round((os.hits / (os.hits + os.misses)) * 100) : 0;

    let html = '';
    html += '<div class="topbar"><div class="brand"><span class="dot"></span><span class="mono">git log --learn</span></div></div>';
    html += '<h1 class="page-title">Git・GitHub 学習クイズ</h1>';
    html += '<p class="page-sub">15カテゴリ × 各10問。選んで、確かめて、次へ進みます。</p>';

    html += '<div class="stat-row">';
    html += '<div class="stat-tile"><div class="label">回答済み</div><div class="value mono">' + os.answered + ' <span style="font-size:13px;color:var(--ink-faint);font-weight:500;">/ ' + os.total + '</span></div></div>';
    html += '<div class="stat-tile"><div class="label">正答率</div><div class="value mono ' + (rate >= 70 ? 'good' : '') + '">' + rate + '%</div></div>';
    html += '<div class="stat-tile"><div class="label">ベストコンボ</div><div class="value mono">' + os.best + '</div></div>';
    html += '</div>';

    html += '<button class="random-btn" id="randomBtn"><span class="rb-text"><span class="rb-title">ランダム10問に挑戦</span><span class="rb-sub">全カテゴリから出題</span></span><span class="rb-arrow">→</span></button>';

    html += '<div class="cat-rail">';
    DATA.forEach((c, i) => {
      const p = progress[i];
      const total = c.questions.length;
      const seenCount = p ? p.seen.filter(Boolean).length : 0;
      const hits = p ? p.hits : 0;
      const misses = p ? p.misses : 0;
      const unseen = total - seenCount;
      const state = seenCount === 0 ? "todo" : (seenCount === total ? "done" : "progress");
      const pct = Math.round((seenCount / total) * 100);
      html += '<button class="cat-item" data-state="' + state + '" data-cat="' + i + '">';
      html += '<div class="cat-head"><span class="cat-num mono">' + c.num.padStart(2, "0") + '</span><span class="cat-title">' + escapeHtml(c.title) + '</span></div>';
      html += '<div class="cat-stats mono"><span>未出題 ' + unseen + '</span><span class="good">正答 ' + hits + '</span><span class="bad">誤答 ' + misses + '</span></div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      html += '</button>';
    });
    html += '</div>';

    app.innerHTML = html;

    document.getElementById("randomBtn").addEventListener("click", startRandomQuiz);
    document.querySelectorAll(".cat-item").forEach((el) => {
      el.addEventListener("click", () => startCategoryQuiz(parseInt(el.dataset.cat, 10)));
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function startCategoryQuiz(ci) {
    ensureCat(ci);
    session = {
      mode: "cat",
      catIndex: ci,
      pool: DATA[ci].questions.map((q, qi) => ({ ci, qi })),
      pos: 0,
      results: [],
    };
    renderQuestion();
  }

  function startRandomQuiz() {
    const all = [];
    DATA.forEach((c, ci) => c.questions.forEach((q, qi) => all.push({ ci, qi })));
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }
    session = { mode: "random", pool: all.slice(0, 10), pos: 0, results: [] };
    renderQuestion();
  }

  function currentQuestion() {
    const { ci, qi } = session.pool[session.pos];
    return { cat: DATA[ci], q: DATA[ci].questions[qi], ci, qi };
  }

  function renderQuestion() {
    const { cat, q, ci } = currentQuestion();
    const total = session.pool.length;
    const pos = session.pos;

    let html = '';
    html += '<div class="topbar"><button class="back-link" id="backBtn">← カテゴリ一覧</button></div>';
    html += '<div class="quiz-head">';
    html += '<div class="quiz-cat-label mono">' + (session.mode === "random" ? "ランダム10問" : cat.num.padStart(2, "0") + " " + escapeHtml(cat.title)) + '</div>';
    html += '<div class="progress-dots" id="dots">';
    for (let i = 0; i < total; i++) {
      let state = i < pos ? (session.results[i] ? "good" : "bad") : (i === pos ? "current" : "todo");
      html += '<span data-s="' + state + '"></span>';
    }
    html += '</div></div>';

    html += '<div class="q-eyebrow mono">問 ' + (pos + 1) + ' / ' + total + '</div>';
    html += '<div class="q-text">' + escapeHtml(q.q) + '</div>';

    html += '<div class="choice-list" id="choiceList">';
    q.choices.forEach((c, idx) => {
      html += '<button class="choice" data-idx="' + idx + '"><span class="mark mono" data-mark></span><span class="badge mono">' + letters()[idx] + '</span><span class="ctext">' + escapeHtml(c) + '</span></button>';
    });
    html += '</div>';

    html += '<div id="explainWrap"></div>';
    html += '<div class="next-row" id="nextRow"></div>';

    app.innerHTML = html;

    document.getElementById("backBtn").addEventListener("click", renderHome);
    document.querySelectorAll("#choiceList .choice").forEach((el) => {
      el.addEventListener("click", () => selectChoice(parseInt(el.dataset.idx, 10)));
    });
  }

  function selectChoice(idx) {
    const { cat, q, ci, qi } = currentQuestion();
    const correct = idx === q.correct;

    if (session.mode === "cat") {
      const p = ensureCat(ci);
      if (!p.seen[qi]) p.seen[qi] = true;
      if (correct) { p.hits++; p.combo++; p.best = Math.max(p.best, p.combo); }
      else { p.misses++; p.combo = 0; }
      saveProgress(progress);
    }
    session.results[session.pos] = correct;

    document.querySelectorAll("#choiceList .choice").forEach((el) => {
      const i = parseInt(el.dataset.idx, 10);
      el.setAttribute("disabled", "true");
      const markEl = el.querySelector("[data-mark]");
      if (i === q.correct) { el.dataset.result = "correct"; markEl.textContent = "+"; }
      else if (i === idx) { el.dataset.result = "wrong"; markEl.textContent = "−"; }
      else { el.dataset.result = "muted"; }
    });

    document.getElementById("dots").children[session.pos].dataset.s = correct ? "good" : "bad";

    const explainWrap = document.getElementById("explainWrap");
    explainWrap.innerHTML = '<div class="explain-panel"><span class="tag">解説</span>' + escapeHtml(q.explain) + '</div>';

    const isLast = session.pos === session.pool.length - 1;
    const nextRow = document.getElementById("nextRow");
    nextRow.innerHTML = '<button class="btn-primary" id="nextBtn">' + (isLast ? "結果を見る" : "次の問題へ →") + '</button>';
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (isLast) { renderResult(); }
      else { session.pos++; renderQuestion(); }
    });
  }

  function renderResult() {
    const total = session.pool.length;
    const correctCount = session.results.filter(Boolean).length;
    const rate = Math.round((correctCount / total) * 100);

    let html = '';
    html += '<div class="topbar"><button class="back-link" id="backBtn">← カテゴリ一覧</button></div>';
    html += '<div class="result-wrap">';
    html += '<div class="q-eyebrow mono" style="text-align:center;">' + (session.mode === "random" ? "ランダム10問" : escapeHtml(DATA[session.catIndex].title)) + '</div>';
    html += '<div class="result-score mono">' + correctCount + '<span> / ' + total + ' 正解</span></div>';
    html += '<div class="result-rate mono">正答率 ' + rate + '%</div>';
    html += '<div class="result-actions">';
    html += '<button class="btn-ghost" id="retryBtn">もう一度解く</button>';
    html += '<button class="btn-primary" id="homeBtn">カテゴリ一覧に戻る</button>';
    html += '</div></div>';

    app.innerHTML = html;
    document.getElementById("backBtn").addEventListener("click", renderHome);
    document.getElementById("homeBtn").addEventListener("click", renderHome);
    document.getElementById("retryBtn").addEventListener("click", () => {
      if (session.mode === "random") startRandomQuiz();
      else startCategoryQuiz(session.catIndex);
    });
  }

  renderHome();
</script>
