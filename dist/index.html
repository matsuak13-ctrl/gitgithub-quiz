n":"GitHub APIを使うと、Webブラウザを介さずにプログラムからGitHub上のリポジトリ・Issue・PRなどの情報取得や操作を自動化できます。"},{"q":"GitHubのREST APIとGraphQL APIの違いとして最も適切なものはどれか。","choices":["GraphQL APIは必要なデータだけを1回のリクエストでまとめて取得しやすい設計になっている","REST APIとGraphQL APIはまったく同じ仕組みである","GraphQL APIは無料で使えず、REST APIのみ無料である","REST APIは画像専用、GraphQL APIはテキスト専用のAPIである"],"correct":0,"explain":"REST APIはエンドポイントごとに決まった形式でデータを返すのに対し、GraphQL APIは欲しいデータの構造を指定して1回のリクエストで効率よく取得できるのが特徴です。"},{"q":"GitHub APIを利用する際、多くの場合に必要となるものはどれか。","choices":["アクセストークンなどによる認証","紙のパスポート","郵送での申請書","電話での口頭確認"],"correct":0,"explain":"GitHub APIを利用する際は、Personal Access Tokenなどを使った認証が一般的に必要で、これによりアクセス権限の範囲を制御できます。"},{"q":"リポジトリ内で特定のイベント（プッシュなど）が起きた際に、外部のURLへ自動的に通知を送る仕組みを何と呼ぶか。","choices":["Webhook","README","Milestone","Topics"],"correct":0,"explain":"Webhookを設定すると、プッシュやIssue作成などのイベントが発生した際に、指定した外部サービスのURLへ自動でデータを送信し、通知や連携処理を行うことができます。"},{"q":"GitHub CLIを使って自分に割り当てられたIssueの一覧を確認するコマンドはどれか。","choices":["gh issue list --assignee \"@me\"","gh pr list","gh repo list","gh release list"],"correct":0,"explain":"gh issue listは、そのままだと現在のリポジトリの未完了Issueを一覧表示するだけです。自分に割り当てられたIssueだけに絞り込むには、--assignee \"@me\"のようにオプションを付けて実行します。"},{"q":"GitHub APIを短時間に大量に呼び出そうとすると発生する、一定時間あたりの利用回数の上限を何と呼ぶか。","choices":["レート制限（Rate limit）","ブランチ保護","コンフリクト","マイグレーション"],"correct":0,"explain":"GitHub APIには一定時間あたりに呼び出せる回数の上限（レート制限）が設けられており、これを超えるとエラーが返され、しばらく待つ必要があります。"},{"q":"GitHub CLIを初めて使う際に、自分のGitHubアカウントと連携（ログイン）するためのコマンドはどれか。","choices":["gh auth login","gh auth logout","gh repo delete","gh pr close"],"correct":0,"explain":"gh auth loginコマンドを実行すると、ブラウザまたはトークンを使った認証手順が案内され、GitHub CLIと自分のアカウントを連携できます。"},{"q":"「gh pr checkout 番号」コマンドでできることとして正しいものはどれか。","choices":["指定したPull Requestのブランチをローカル環境に取得し、切り替える","指定したPull Requestを強制的にマージする","指定したPull Requestを削除する","指定したPull Requestのレビュアーを変更する"],"correct":0,"explain":"gh pr checkout 番号を使うと、指定したPull Requestに対応するブランチをローカルに取得し、そのブランチへ切り替えて手元で動作確認などができます。"},{"q":"GitHub CLIを使って新しいIssueを作成するコマンドはどれか。","choices":["gh issue create","gh repo create","gh pr merge","gh auth logout"],"correct":0,"explain":"gh issue createコマンドを使うと、ターミナルから対話的に（またはオプション指定で）新しいIssueを作成できます。"},{"q":"GraphQL APIの特徴として、REST APIと比較したときに正しいものはどれか。","choices":["必要なフィールドだけを指定して、1回のリクエストでまとめて取得できる","常に全データを一度にすべて返す","認証が一切不要である","JSON形式でのレスポンスに対応していない"],"correct":0,"explain":"GraphQL APIでは、クライアント側が必要なフィールドだけをクエリで指定でき、複数の関連情報を1回のリクエストでまとめて取得できる点が特徴です。"},{"q":"GitHub CLIの機能を、コミュニティなどが作成した追加コマンドで拡張できる仕組みを何と呼ぶか。","choices":["gh extension（拡張機能）","gh workflow","gh secret","gh release"],"correct":0,"explain":"gh extensionを使うと、公式には用意されていない追加のコマンドをインストールし、GitHub CLIの機能を拡張できます。"},{"q":"GitHub REST APIから返却されるデータの一般的な形式はどれか。","choices":["JSON","CSV","PDF","実行可能バイナリ"],"correct":0,"explain":"GitHub REST APIのレスポンスは、一般的にJSON（JavaScript Object Notation）形式で返却され、プログラムから扱いやすい構造になっています。"},{"q":"Personal Access Token（Classic）を発行する際に設定する「Scope（スコープ）」の役割として正しいものはどれか。","choices":["そのトークンでどの範囲の操作（リポジトリ操作やIssue操作など）を許可するかを限定する","トークンの文字色を変更する","トークンの有効期限を無期限に固定する","トークンを他のユーザーと共有可能にする"],"correct":0,"explain":"Classicなpersonal access tokenでは、repoやread:orgなどの「Scope」を設定することで、そのトークンで許可する操作範囲を限定します。なお、Fine-grained personal access tokenでは同じ考え方を、Scopeではなく対象リポジトリの指定と個別のpermissions（権限）設定によって実現します。"},{"q":"「gh repo view --web」コマンドを実行するとどうなるか。","choices":["対象のリポジトリページが既定のWebブラウザで開かれる","リポジトリが削除される","リポジトリが自動的にForkされる","リポジトリの全ファイルがダウンロードされる"],"correct":0,"explain":"gh repo view --webを実行すると、コマンドラインを離れることなく、対象リポジトリのページを既定のWebブラウザで開くことができます。"},{"q":"GitHub APIで大量のデータ（例：数千件のIssue）を取得する際に、一度に全件を返さず複数回に分けて取得できるようにする仕組みを何と呼ぶか。","choices":["ページネーション（Pagination）","キャッシュ","Webhook","マイグレーション"],"correct":0,"explain":"ページネーションは、大量の結果を一度に返さず、ページ単位に分割して取得できるようにする仕組みで、APIの負荷やレスポンスサイズを抑えるために使われます。"},{"q":"GitHub CLIを使って、GitHub Actionsのワークフロー実行状況の一覧を確認するコマンドはどれか。","choices":["gh run list","gh secret list","gh pr list","gh label list"],"correct":0,"explain":"gh run listコマンドを使うと、GitHub Actionsのワークフロー実行履歴とその状態（成功/失敗など）を一覧で確認できます。"},{"q":"サードパーティのアプリがユーザーに代わってGitHubを操作できるようにする際、パスワードを直接渡す代わりに用いられる認可の仕組みはどれか。","choices":["OAuth","SFTP","DNS","SMTP"],"correct":0,"explain":"OAuthは、ユーザーがパスワードを直接渡すことなく、必要な範囲の権限だけをサードパーティのアプリに許可できる認可の仕組みで、GitHubへの外部アプリ連携などに使われます。"}]},{"num":"15","title":"GitHub Copilotの活用","questions":[{"q":"「GitHub Copilot」の説明として最も適切なものはどれか。","choices":["AIがコードの入力を補完・提案してくれる開発支援ツール","リポジトリを自動で削除するツール","パスワードを自動生成するツール","動画を自動編集するツール"],"correct":0,"explain":"GitHub Copilotは、AIが文脈に応じてコードの続きや関数の実装案などを提案してくれる、エディタ上で使う開発支援ツールです。"},{"q":"GitHub Copilotが提案したコードを利用する際に注意すべきこととして最も適切なものはどれか。","choices":["提案内容が正しく安全かを自分で確認してから採用する","内容を確認せず必ずそのまま採用する","提案されたコードは絶対にバグを含まない","提案内容の確認は一切不要である"],"correct":0,"explain":"Copilotの提案はあくまでAIによる予測であり、誤りや意図と異なる実装が含まれることもあるため、内容を理解・確認したうえで採用するかどうかを判断する必要があります。"},{"q":"会話形式でコードの説明や修正案を尋ねられるGitHub Copilotの機能を何と呼ぶか。","choices":["Copilot Chat","Copilot Release","Copilot Milestone","Copilot Topics"],"correct":0,"explain":"Copilot Chatは、チャット形式で「このコードの意味を説明して」「このエラーを直して」のように質問・依頼ができる、対話型のAI支援機能です。"},{"q":"GitHub Copilotを利用するために一般的に必要なものはどれか。","choices":["GitHubアカウントと、用途に合ったCopilotプラン（Freeを含む）","紙の使用許諾書への署名","専用の追加PC","特別なインターネット回線契約"],"correct":0,"explain":"GitHub Copilotの利用にはGitHubアカウントと、Copilotのプランへの加入が必要です。以前は有料プランが前提でしたが、現在は利用回数などに制限のある個人向けCopilot Freeが用意されており、支払いなしで使い始めることもできます。より多く使いたい場合は有料プラン（Pro等）への加入が必要です。"},{"q":"GitHub Copilotのようなコード補完AIが提案を生成する際の一般的な特徴として正しいものはどれか。","choices":["大量のコードなどのデータをもとに学習したモデルから、文脈に合いそうな内容を予測して提示する","常に人間の担当者が手作業で一件ずつ回答している","インターネット接続なしでも一切動作原理が変わらない魔法である","提案内容は必ず100%正確であることが保証されている"],"correct":0,"explain":"Copilotのようなツールは、大量のコードなどを学習したAIモデルが、入力された文脈から「続きとして自然な内容」を予測して提案する仕組みで動いており、常に完璧な正解を保証するものではありません。"},{"q":"エディタ上でGitHub Copilotが表示した提案を採用する際の一般的な操作はどれか。","choices":["Tabキーなどで提案を確定し、不要ならEscなどで却下する","PCを再起動しないと採用できない","必ずマウスで1文字ずつクリックする必要がある","採用も却下もできない仕様である"],"correct":0,"explain":"多くのエディタでは、Copilotが薄い色で表示する提案をTabキーで確定（採用）し、不要であればEscキーなどでそのまま無視（却下）する操作が一般的です。"},{"q":"Pull Requestの変更内容を要約した説明文の下書きをAIが自動生成してくれる機能を何と呼ぶか。","choices":["Copilot pull request summaries（CopilotによるPR要約）","Copilot Release Notes","Copilot Branch Protection","Copilot Webhook"],"correct":0,"explain":"Copilot pull request summariesと呼ばれる機能により、PRの差分内容をもとに説明文の下書きを自動生成でき、PR作成時の記述の手間を減らすことができます。あくまで下書きのため、最終的な内容の確認は必要です。"},{"q":"GitHub Copilotを利用する際に意識しておくべき著作権上の注意点として最も適切なものはどれか。","choices":["提案されたコードが既存コードの一部と酷似する場合があるため、利用条件などを踏まえて確認する","AIが生成したものは著作権を一切考える必要がない","提案コードは必ず自分のオリジナルとして扱ってよい","著作権の問題はCopilotには一切関係しない"],"correct":0,"explain":"Copilotは大量の既存コードを学習しているため、まれに既存コードと似た提案が出ることがあります。利用にあたっては提供元が示す利用条件を踏まえ、必要に応じて内容を確認することが望ましいとされています。"},{"q":"GitHub Copilotが利用できる代表的な開発環境（エディタ）はどれか。","choices":["Visual Studio Codeなどの対応エディタ","紙のノートとペンのみ","電卓アプリのみ","動画再生アプリのみ"],"correct":0,"explain":"GitHub Copilotは、Visual Studio CodeやVisual Studioなど、対応した各種エディタ・IDEに拡張機能として組み込んで利用します。"},{"q":"GitHub Copilotの利用が向いていない、注意が必要な場面として最も適切なものはどれか。","choices":["パスワードやAPIキーなど機密情報そのものを扱わせるような使い方","変数名の候補を考えてもらう場面","定型的なコードの雛形を提案してもらう場面","コメントからコードの概要を書いてもらう場面"],"correct":0,"explain":"Copilotは入力された内容を処理に利用するため、パスワードやAPIキーなどの機密情報を直接入力・生成させるような使い方は避け、機密情報の取り扱いには別途注意する必要があります。"},{"q":"コメントで「// 配列を昇順にソートする関数」のように書くと、その内容に沿ったコードを提案してくれるGitHub Copilotの使い方として正しいものはどれか。","choices":["自然言語のコメントから、それに対応するコードを生成させる","コメントを自動的にすべて削除させる","コメントをテストコードに変換させる","コメントをコミットメッセージとして強制送信させる"],"correct":0,"explain":"GitHub Copilotは、書かれたコメントの内容を解釈し、それに対応するコードを提案する機能を持っています。目的を明確に書いたコメントほど、意図に近い提案が得られやすくなります。"},{"q":"組織内のリポジトリで、特定のファイルやパスをGitHub Copilotの提案生成の対象から除外できる設定を何と呼ぶか。","choices":["Content exclusions（コンテンツの除外設定）","Branch protection","Code owners","Webhooks"],"correct":0,"explain":"Content exclusions（コンテンツ除外）を設定すると、機密性の高いファイルやディレクトリをGitHub Copilotの提案生成の対象から除外し、意図せず内容が参照・提案に利用されるのを防げます。"},{"q":"GitHub Copilotが提供する、Pull Requestの変更内容についてAIが自動でコメントを付けたり指摘したりする機能を一般に何と呼ぶか。","choices":["Copilotによるコードレビュー支援機能","Dependabot alerts","Code of Conduct","Branch protection rule"],"correct":0,"explain":"GitHub Copilotには、PRの変更差分を解析し、潜在的な問題点や改善提案をレビューコメントとして自動的に提示する機能があり、人によるレビューを補助する目的で使われます。"},{"q":"個人向けの「Copilotプラン」に対して、組織向けの「Copilot Business/Enterprise」が主に提供する特徴として正しいものはどれか。","choices":["組織全体での一括ライセンス管理やポリシー設定などの管理機能","コード補完機能自体が個人向けと全く別のものになる","インターネット接続が不要になる","無料で無制限に利用できるようになる"],"correct":0,"explain":"Copilot Business/Enterpriseでは、組織単位でのライセンス管理、利用ポリシーの設定、監査ログなど、チームや組織で使うための管理機能が個人向けプラン（Free・Pro・Pro+・Maxなど）に加えて提供されます。"},{"q":"GitHub Copilotからより意図に近いコード提案を得るための工夫として最も適切なものはどれか。","choices":["関数名や変数名を分かりやすく付け、目的を明確にするコメントを書く","変数名や関数名はすべて意味のない文字列にする","コメントは一切書かないようにする","常に1つの巨大な関数にすべての処理をまとめる"],"correct":0,"explain":"Copilotは周辺のコードやコメント、関数名などの文脈から提案を生成するため、意図が明確に伝わる命名やコメントを書くことで、より的確な提案を得やすくなります。"},{"q":"GitHub Copilotの提案が、公開されている既存のコードと酷似したコードを含む可能性について、利用者が意識しておくべきこととして正しいものはどれか。","choices":["ライセンスや著作権上のリスクがないか、必要に応じて確認する姿勢を持つ","既存コードとの類似は理論上絶対に起こり得ない","類似していても一切確認せず利用してよい","類似コードが検出された場合は自動的に利用が禁止される仕組みが必ず働く"],"correct":0,"explain":"Copilotの提案が、学習に用いられた公開コードと偶然似通ったものになる可能性はゼロではないため、利用者側でもライセンスや著作権上のリスクを意識しておくことが望ましいとされています。"},{"q":"ターミナル上でのコマンド入力を自然言語から支援する、GitHub Copilotの関連機能を何と呼ぶか。","choices":["GitHub Copilot CLI","GitHub Pages","GitHub Discussions","GitHub Projects"],"correct":0,"explain":"GitHub Copilot CLIは、「〇〇したい」という自然言語の説明から、対応するシェルコマンドの候補を提案してくれる機能です。以前提供されていたgh CLIの拡張機能「gh-copilot」は2025年10月に提供終了となり、現在はGitHub Copilot CLIとして提供されています。"},{"q":"GitHub Copilotが生成したコードであっても、CI（自動テスト）でしっかり検証してからマージすべきとされる理由として最も適切なものはどれか。","choices":["AIによる提案であっても人間が書いたコードと同様に誤りを含む可能性があるため","Copilotが生成したコードはテストする必要が一切ないため","CIはCopilotの提案には適用できない仕組みであるため","Copilotの提案は常に100%正しいことが保証されているため"],"correct":0,"explain":"Copilotの提案はあくまでAIによる予測であり、人間が書いたコードと同様に誤りを含む可能性があります。そのため通常のコードと同じようにCIでのテストやレビューを経てからマージすることが望まれます。"},{"q":"GitHub Copilotを利用してコード補完の提案を受け取るために、一般的に必要な環境として正しいものはどれか。","choices":["インターネットへの接続","専用の物理サーバーの自前構築","ローカルのみで完結するオフライン専用モデル","GPU非搭載のPCであること"],"correct":0,"explain":"GitHub Copilotの提案は基本的にクラウド上のモデルとの通信によって生成されるため、一般的にインターネットへの接続が必要です。"},{"q":"チームでGitHub Copilotなどのコード生成AIを導入する際に、あらかじめ利用ルールを定めておくことの意義として最も適切なものはどれか。","choices":["提案コードの確認方法や機密情報の扱いなど、メンバー間での認識のばらつきを防げる","コード生成AIの提案精度を強制的に100%にできる","全メンバーのコミット数が自動的に均等になる","コードレビューが完全に不要になる"],"correct":0,"explain":"あらかじめチームでルールを定めておくことで、AIの提案をどこまで確認してから使うか、機密情報を含むコードにどう対応するかなど、メンバー間で対応のばらつきが出るのを防げます。"}]}];
  const STORAGE_KEY = "gitgithub-quiz-progress-v1";

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
  }

  let progress = loadProgress();

  function ensureCat(ci) {
    if (!progress[ci]) {
      progress[ci] = { seen: new Array(DATA[ci].questions.length).fill(false), hits: 0, misses: 0, combo: 0, best: 0 };
    }
    return progress[ci];
  }

  const app = document.getElementById("app");

  // ---- session state for an in-progress quiz ----
  let session = null; // { catIndex, order: [qIndexes], pos, answers: [null|bool], isRandom, pool: [{ci,qi}] }

  function letters() { return ["ア", "イ", "ウ", "エ"]; }

  function overallStats() {
    let answered = 0, hits = 0, misses = 0, best = 0;
    DATA.forEach((c, i) => {
      const p = progress[i];
      if (!p) return;
      answered += p.seen.filter(Boolean).length;
      hits += p.hits;
      misses += p.misses;
      best = Math.max(best, p.best || 0);
    });
    return { answered, hits, misses, best, total: DATA.reduce((s, c) => s + c.questions.length, 0) };
  }

  function renderHome() {
    session = null;
    const os = overallStats();
    const rate = os.hits + os.misses > 0 ? Math.round((os.hits / (os.hits + os.misses)) * 100) : 0;

    let html = '';
    html += '<div class="topbar"><div class="brand"><span class="dot"></span><span class="mono">git log --learn</span></div></div>';
    html += '<h1 class="page-title">Git・GitHub 学習クイズ</h1>';
    html += '<p class="page-sub">15カテゴリ・全300問。選んで、確かめて、次へ進みます。</p>';

    html += '<div class="stat-row">';
    html += '<div class="stat-tile"><div class="label">回答済み</div><div class="value mono">' + os.answered + ' <span style="font-size:13px;color:var(--ink-faint);font-weight:500;">/ ' + os.total + '</span></div></div>';
    html += '<div class="stat-tile"><div class="label">正答率</div><div class="value mono ' + (rate >= 70 ? 'good' : '') + '">' + rate + '%</div></div>';
    html += '<div class="stat-tile"><div class="label">ベストコンボ</div><div class="value mono">' + os.best + '</div></div>';
    html += '</div>';

    html += '<button class="random-btn" id="randomBtn"><span class="rb-text"><span class="rb-title">ランダム10問に挑戦</span><span class="rb-sub">全カテゴリから出題</span></span><span class="rb-arrow">→</span></button>';

    html += '<div class="cat-rail">';
    DATA.forEach((c, i) => {
      const p = progress[i];
      const total = c.questions.length;
      const seenCount = p ? p.seen.filter(Boolean).length : 0;
      const hits = p ? p.hits : 0;
      const misses = p ? p.misses : 0;
      const unseen = total - seenCount;
      const state = seenCount === 0 ? "todo" : (seenCount === total ? "done" : "progress");
      const pct = Math.round((seenCount / total) * 100);
      html += '<button class="cat-item" data-state="' + state + '" data-cat="' + i + '">';
      html += '<div class="cat-head"><span class="cat-num mono">' + c.num.padStart(2, "0") + '</span><span class="cat-title">' + escapeHtml(c.title) + '</span></div>';
      html += '<div class="cat-stats mono"><span>未出題 ' + unseen + '</span><span class="good">正答 ' + hits + '</span><span class="bad">誤答 ' + misses + '</span></div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      html += '</button>';
    });
    html += '</div>';

    app.innerHTML = html;

    document.getElementById("randomBtn").addEventListener("click", startRandomQuiz);
    document.querySelectorAll(".cat-item").forEach((el) => {
      el.addEventListener("click", () => startCategoryQuiz(parseInt(el.dataset.cat, 10)));
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function startCategoryQuiz(ci) {
    ensureCat(ci);
    session = {
      mode: "cat",
      catIndex: ci,
      pool: DATA[ci].questions.map((q, qi) => ({ ci, qi })),
      pos: 0,
      results: [],
    };
    renderQuestion();
  }

  function startRandomQuiz() {
    const all = [];
    DATA.forEach((c, ci) => c.questions.forEach((q, qi) => all.push({ ci, qi })));
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }
    session = { mode: "random", pool: all.slice(0, 10), pos: 0, results: [] };
    renderQuestion();
  }

  function currentQuestion() {
    const { ci, qi } = session.pool[session.pos];
    return { cat: DATA[ci], q: DATA[ci].questions[qi], ci, qi };
  }

  function renderQuestion() {
    const { cat, q, ci } = currentQuestion();
    const total = session.pool.length;
    const pos = session.pos;

    let html = '';
    html += '<div class="topbar"><button class="back-link" id="backBtn">← カテゴリ一覧</button></div>';
    html += '<div class="quiz-head">';
    html += '<div class="quiz-cat-label mono">' + (session.mode === "random" ? "ランダム10問" : cat.num.padStart(2, "0") + " " + escapeHtml(cat.title)) + '</div>';
    html += '<div class="progress-dots" id="dots">';
    for (let i = 0; i < total; i++) {
      let state = i < pos ? (session.results[i] ? "good" : "bad") : (i === pos ? "current" : "todo");
      html += '<span data-s="' + state + '"></span>';
    }
    html += '</div></div>';

    html += '<div class="q-eyebrow mono">問 ' + (pos + 1) + ' / ' + total + '</div>';
    html += '<div class="q-text">' + escapeHtml(q.q) + '</div>';

    html += '<div class="choice-list" id="choiceList">';
    q.choices.forEach((c, idx) => {
      html += '<button class="choice" data-idx="' + idx + '"><span class="mark mono" data-mark></span><span class="badge mono">' + letters()[idx] + '</span><span class="ctext">' + escapeHtml(c) + '</span></button>';
    });
    html += '</div>';

    html += '<div id="explainWrap"></div>';
    html += '<div class="next-row" id="nextRow"></div>';

    app.innerHTML = html;

    document.getElementById("backBtn").addEventListener("click", renderHome);
    document.querySelectorAll("#choiceList .choice").forEach((el) => {
      el.addEventListener("click", () => selectChoice(parseInt(el.dataset.idx, 10)));
    });
  }

  function selectChoice(idx) {
    const { cat, q, ci, qi } = currentQuestion();
    const correct = idx === q.correct;

    if (session.mode === "cat") {
      const p = ensureCat(ci);
      if (!p.seen[qi]) p.seen[qi] = true;
      if (correct) { p.hits++; p.combo++; p.best = Math.max(p.best, p.combo); }
      else { p.misses++; p.combo = 0; }
      saveProgress(progress);
    }
    session.results[session.pos] = correct;

    document.querySelectorAll("#choiceList .choice").forEach((el) => {
      const i = parseInt(el.dataset.idx, 10);
      el.setAttribute("disabled", "true");
      const markEl = el.querySelector("[data-mark]");
      if (i === q.correct) { el.dataset.result = "correct"; markEl.textContent = "+"; }
      else if (i === idx) { el.dataset.result = "wrong"; markEl.textContent = "−"; }
      else { el.dataset.result = "muted"; }
    });

    document.getElementById("dots").children[session.pos].dataset.s = correct ? "good" : "bad";

    const explainWrap = document.getElementById("explainWrap");
    explainWrap.innerHTML = '<div class="explain-panel"><span class="tag">解説</span>' + escapeHtml(q.explain) + '</div>';

    const isLast = session.pos === session.pool.length - 1;
    const nextRow = document.getElementById("nextRow");
    nextRow.innerHTML = '<button class="btn-primary" id="nextBtn">' + (isLast ? "結果を見る" : "次の問題へ →") + '</button>';
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (isLast) { renderResult(); }
      else { session.pos++; renderQuestion(); }
    });
  }

  function renderResult() {
    const total = session.pool.length;
    const correctCount = session.results.filter(Boolean).length;
    const rate = Math.round((correctCount / total) * 100);

    let html = '';
    html += '<div class="topbar"><button class="back-link" id="backBtn">← カテゴリ一覧</button></div>';
    html += '<div class="result-wrap">';
    html += '<div class="q-eyebrow mono" style="text-align:center;">' + (session.mode === "random" ? "ランダム10問" : escapeHtml(DATA[session.catIndex].title)) + '</div>';
    html += '<div class="result-score mono">' + correctCount + '<span> / ' + total + ' 正解</span></div>';
    html += '<div class="result-rate mono">正答率 ' + rate + '%</div>';
    html += '<div class="result-actions">';
    html += '<button class="btn-ghost" id="retryBtn">もう一度解く</button>';
    html += '<button class="btn-primary" id="homeBtn">カテゴリ一覧に戻る</button>';
    html += '</div></div>';

    app.innerHTML = html;
    document.getElementById("backBtn").addEventListener("click", renderHome);
    document.getElementById("homeBtn").addEventListener("click", renderHome);
    document.getElementById("retryBtn").addEventListener("click", () => {
      if (session.mode === "random") startRandomQuiz();
      else startCategoryQuiz(session.catIndex);
    });
  }

  renderHome();
</script>
