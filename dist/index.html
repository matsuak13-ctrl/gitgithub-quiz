<title>Git・GitHub学習クイズ</title>
<style>
  @font-face { font-family: "system-mono"; src: local("SF Mono"); }

  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #edeae2;
    --ink: #1e2430;
    --ink-dim: #656d7a;
    --ink-faint: #9198a3;
    --border: #ded9cd;
    --accent: #2b56d6;
    --accent-ink: #ffffff;
    --accent-soft: #e8edfc;
    --good: #1c9457;
    --good-bg: #e3f5ea;
    --good-ink: #14603a;
    --bad: #c8433f;
    --bad-bg: #fbeaea;
    --bad-ink: #8f2e2b;
    --shadow: 0 1px 2px rgba(30, 36, 48, 0.04), 0 8px 24px -12px rgba(30, 36, 48, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d;
      --surface: #1b1f27;
      --surface-2: #242a34;
      --ink: #e8eaef;
      --ink-dim: #9aa3b2;
      --ink-faint: #6b7280;
      --border: #2c323d;
      --accent: #6f8dff;
      --accent-ink: #0c1220;
      --accent-soft: rgba(111, 141, 255, 0.14);
      --good: #3ed687;
      --good-bg: rgba(62, 214, 135, 0.12);
      --good-ink: #7fe8ae;
      --bad: #ff6f6a;
      --bad-bg: rgba(255, 111, 106, 0.12);
      --bad-ink: #ff9c98;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171d;
    --surface: #1b1f27;
    --surface-2: #242a34;
    --ink: #e8eaef;
    --ink-dim: #9aa3b2;
    --ink-faint: #6b7280;
    --border: #2c323d;
    --accent: #6f8dff;
    --accent-ink: #0c1220;
    --accent-soft: rgba(111, 141, 255, 0.14);
    --good: #3ed687;
    --good-bg: rgba(62, 214, 135, 0.12);
    --good-ink: #7fe8ae;
    --bad: #ff6f6a;
    --bad-bg: rgba(255, 111, 106, 0.12);
    --bad-ink: #ff9c98;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  a, button { font: inherit; color: inherit; }

  button {
    cursor: pointer;
    border: none;
    background: none;
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- top bar ---------- */

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
  }

  .brand .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--ink-dim);
    padding: 6px 4px;
    border-radius: 6px;
  }
  .back-link:hover { color: var(--ink); }

  /* ---------- home ---------- */

  h1.page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .page-sub {
    color: var(--ink-dim);
    font-size: 14.5px;
    margin: 0 0 24px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .stat-tile .label {
    font-size: 11.5px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }

  .stat-tile .value {
    font-size: 20px;
    font-weight: 700;
  }
  .stat-tile .value.good { color: var(--good-ink); }
  .stat-tile .value.bad { color: var(--bad-ink); }

  .random-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }
  .random-btn:hover { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { .random-btn { transition: none; } }

  .random-btn .rb-text { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .random-btn .rb-title { font-weight: 700; font-size: 15px; }
  .random-btn .rb-sub { font-size: 12.5px; opacity: 0.85; }
  .random-btn .rb-arrow { font-size: 18px; opacity: 0.9; }

  .cat-rail {
    position: relative;
    padding-left: 22px;
  }

  .cat-rail::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 14px;
    bottom: 14px;
    width: 1.5px;
    background: var(--border);
  }

  .cat-item {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px 13px 16px;
    margin-bottom: 10px;
  }

  .cat-item:hover { border-color: var(--accent); }

  .cat-item::before {
    content: "";
    position: absolute;
    left: -22px;
    top: 22px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--ink-faint);
  }

  .cat-item[data-state="progress"]::before { border-color: var(--accent); background: var(--accent-soft); }
  .cat-item[data-state="done"]::before { border-color: var(--good); background: var(--good); }

  .cat-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 6px;
  }

  .cat-num {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .cat-title {
    font-size: 15.5px;
    font-weight: 600;
  }

  .cat-stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .cat-stats b.good { color: var(--good-ink); font-weight: 700; }
  .cat-stats b.bad { color: var(--bad-ink); font-weight: 700; }

  .bar-track {
    height: 4px;
    border-radius: 3px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  /* ---------- quiz ---------- */

  .quiz-head {
    margin-bottom: 18px;
  }

  .quiz-cat-label {
    font-size: 12.5px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }

  .progress-dots {
    display: flex;
    gap: 5px;
  }

  .progress-dots span {
    flex: 1;
    height: 4px;
    border-radius: 3px;
    background: var(--surface-2);
  }
  .progress-dots span[data-s="current"] { background: var(--ink-faint); }
  .progress-dots span[data-s="good"] { background: var(--good); }
  .progress-dots span[data-s="bad"] { background: var(--bad); }

  .q-eyebrow {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin: 16px 0 8px;
  }

  .q-text {
    font-size: 18.5px;
    font-weight: 700;
    line-height: 1.6;
    text-wrap: balance;
    margin: 0 0 18px;
  }

  .choice-list { display: flex; flex-direction: column; gap: 8px; }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .choice:not([disabled]):hover { border-color: var(--accent); }

  .choice .mark {
    flex: none;
    width: 14px;
    font-size: 13px;
    font-weight: 700;
    color: transparent;
    padding-top: 1px;
  }

  .choice .badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 700;
  }

  .choice .ctext { padding-top: 2px; font-size: 14.5px; }

  .choice[data-result="correct"] {
    background: var(--good-bg);
    border-color: var(--good);
  }
  .choice[data-result="correct"] .badge { background: var(--good); color: #fff; }
  .choice[data-result="correct"] .mark { color: var(--good-ink); }

  .choice[data-result="wrong"] {
    background: var(--bad-bg);
    border-color: var(--bad);
  }
  .choice[data-result="wrong"] .badge { background: var(--bad); color: #fff; }
  .choice[data-result="wrong"] .mark { color: var(--bad-ink); }

  .choice[data-result="muted"] { opacity: 0.55; }

  .explain-panel {
    margin-top: 14px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--ink-dim);
    animation: rise 0.22s ease both;
  }
  @media (prefers-reduced-motion: reduce) { .explain-panel { animation: none; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explain-panel .tag {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .next-row { margin-top: 20px; display: flex; justify-content: flex-end; min-height: 44px; }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    padding: 11px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
  }
  :root:not([data-theme="light"]) .btn-primary,
  :root[data-theme="dark"] .btn-primary { background: var(--accent); color: var(--accent-ink); }

  .btn-ghost {
    border: 1px solid var(--border);
    padding: 11px 20px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ---------- result ---------- */

  .result-wrap { text-align: center; padding: 30px 0 10px; }
  .result-score {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .result-score span { font-size: 20px; font-weight: 600; color: var(--ink-faint); }
  .result-rate { color: var(--ink-dim); font-size: 14px; margin: 6px 0 26px; }
  .result-actions { display: flex; gap: 10px; justify-content: center; }

  .hidden { display: none !important; }
</style>

<div id="app"></div>

<script>
  const DATA = [{"num":"1","title":"GitとGitHubの違い","questions":[{"q":"Gitの説明として最も適切なものはどれか。","choices":["ファイルをインターネット上で共有するSNS","変更履歴を記録・管理する分散型バージョン管理システム","プログラムを実行するためのエディタ","ウイルス対策のためのセキュリティソフト"],"correct":1,"explain":"Gitは、ファイルの変更履歴を記録・追跡できる「分散型バージョン管理システム」です。ネットワークがなくてもローカルのPC単体で履歴管理ができるのが大きな特徴です。"},{"q":"GitHubの説明として最も適切なものはどれか。","choices":["ローカル環境で動作するファイル共有ツール","プログラムを圧縮するための圧縮ソフト","Gitリポジトリをインターネット上で共有・管理するサービス","ウイルス対策のためのセキュリティソフト"],"correct":2,"explain":"GitHubはGitで管理されているリポジトリをインターネット上でホスティングするサービスです。共同開発やコードレビューにも活用されます。"},{"q":"GitとGitHubの関係として正しいものはどれか。","choices":["GitHubがなければGitは使えない","GitはGitHubの一機能である","GitHubを使わずGit単体でもバージョン管理はできる","GitとGitHubはまったく同じものである"],"correct":2,"explain":"Gitはツール、GitHubはそのGitリポジトリを保存・共有するためのWebサービスです。GitHubを使わなくても、Git単体でローカルのバージョン管理は可能です。"},{"q":"GitHub以外でGitリポジトリをホスティングできるサービスはどれか。","choices":["GitLab","Photoshop","Slack","Zoom"],"correct":0,"explain":"GitLabやBitbucketなど、GitHub以外にもGitリポジトリをホスティングできるサービスは複数存在します。"},{"q":"「リポジトリ（repository）」とは何か。","choices":["プログラムのエラーメッセージ一覧","プロジェクトのファイルと変更履歴を保存する場所","GitHubアカウントのパスワード","コミットを取り消すコマンド"],"correct":1,"explain":"リポジトリは、プロジェクトに関するファイルとその変更履歴（バージョン情報）をまとめて保存しておく場所のことです。"},{"q":"「ローカルリポジトリ」の説明として正しいものはどれか。","choices":["GitHub上にのみ存在するリポジトリ","自分のPC上に存在するリポジトリ","他人しかアクセスできないリポジトリ","削除済みのリポジトリ"],"correct":1,"explain":"ローカルリポジトリとは、自分のPC内に作成されたリポジトリのことです。これに対し、GitHubなどネットワーク上に置かれたリポジトリを「リモートリポジトリ」と呼びます。"},{"q":"GitHubが主にどのような用途で使われるか、最も適切なものはどれか。","choices":["動画編集","コードの共有・共同開発・コードレビュー","表計算","画像加工"],"correct":1,"explain":"GitHubはコードをオンラインで共有し、複数人での共同開発やPull Requestを使ったコードレビューを行うために広く使われています。"},{"q":"Gitがファイルの変更を記録する仕組みに近い考え方はどれか。","choices":["ファイルを上書きし、過去の状態は残さない","変更のたびにスナップショット（記録）を保存していく","毎回すべてのファイルを削除して作り直す","変更内容を暗号化して読めなくする"],"correct":1,"explain":"Gitはコミットのたびにプロジェクト全体の状態をスナップショットとして記録します。これにより、いつでも過去の状態に戻ることができます。"},{"q":"GitHubで「フォーク（fork）」を行う目的として正しいものはどれか。","choices":["他人のリポジトリを削除するため","リポジトリの履歴をリセットするため","GitHubアカウントを複数作成するため","他人のリポジトリを自分のアカウントにコピーして独自に変更するため"],"correct":3,"explain":"フォークは、他人のリポジトリを自分のアカウントにコピーすることで、自分用に変更を加えたり、Pull Requestを送ったりするための機能です。オープンソース開発で頻繁に利用されます。"},{"q":"Gitを使う主なメリットとして誤っているものはどれか。","choices":["誰がいつどこを変更したか記録できる","過去の状態に戻せる","複数人での同時編集がしやすくなる","インターネットに接続していないと一切利用できない"],"correct":3,"explain":"Gitはローカル環境だけでも変更履歴の記録やコミットが可能な分散型システムです。インターネット接続が必須なのはGitHubなどへのプッシュ・プル時のみです。"},{"q":"「分散型バージョン管理システム」であるGitの特徴として正しいものはどれか。","choices":["変更履歴はGitHub上にしか保存できない","各利用者のPCに、リポジトリの履歴を含む複製を持てる","必ず1台の中央サーバーに接続して使う","ファイルの最新版だけを管理する"],"correct":1,"explain":"Gitでは、各利用者のローカルリポジトリに変更履歴を含むデータを保持できます。そのため、ネットワークに接続していない状態でも履歴の確認やコミットなどの作業ができます。"},{"q":"自分のPCだけでGitを使って履歴管理を始める場合、GitHubアカウントは必要か。","choices":["必ず必要である","有料アカウントだけが必要である","Gitをローカルだけで使うなら必要ない","会社のアカウントが必要である"],"correct":2,"explain":"GitはPC上で動作する独立したバージョン管理システムなので、ローカルだけで使う場合はGitHubアカウントを必要としません。GitHubへ共有するときにGitHubアカウントが必要になります。"},{"q":"「リモートリポジトリ」の説明として最も適切なものはどれか。","choices":["自分のPC内だけにある作業フォルダ","ネットワーク上にあり、複数人で共有できるリポジトリ","削除済みファイルだけを保存する場所","コミット前の変更だけを置く場所"],"correct":1,"explain":"リモートリポジトリは、GitHubなどのネットワーク上に置かれた共有用のリポジトリです。ローカルリポジトリと変更を送受信することで共同作業を進められます。"},{"q":"GitHubの機能であり、Gitそのものの機能ではないものはどれか。","choices":["コミット","ブランチ","Pull Request","マージ"],"correct":2,"explain":"コミット、ブランチ、マージはGitの機能です。Pull Requestは、変更の提案・レビュー・マージを行うためにGitHubなどのホスティングサービスが提供する機能です。"},{"q":"GitHubでリモートリポジトリに付けられる「origin」という名前について正しいものはどれか。","choices":["GitHubが必ず強制する固定名である","最初のリモートによく使われる慣例的な名前で、変更もできる","デフォルトブランチの別名である","GitHubのユーザー名を表す"],"correct":1,"explain":"originは、クローン元など主要なリモートに自動または慣例的に付けられる名前です。予約語ではないため、別の名前を付けたり後から変更したりできます。"},{"q":"GitHub Desktopの説明として正しいものはどれか。","choices":["GitとGitHubの操作を画面上で行いやすくするGUIアプリ","GitHub上の動画を編集するアプリ","Gitを使わずにコードを実行するアプリ","GitHubの料金を管理するアプリ"],"correct":0,"explain":"GitHub Desktopは、コミット、ブランチ、プッシュ、Pull Requestなどの操作を、コマンドラインではなく画面上で行いやすくするデスクトップアプリです。"},{"q":"GitHubのPrivateリポジトリについて正しい説明はどれか。","choices":["インターネット上の誰でも閲覧できる","所有者と許可された利用者だけが閲覧・操作できる","Gitの履歴を保存できない","作成すると自動的にPublicになる"],"correct":1,"explain":"Privateリポジトリは、所有者や招待・許可された利用者など、アクセス権を持つ人だけが閲覧・操作できます。ただし、権限設定や機密情報の扱いには引き続き注意が必要です。"},{"q":"Gitが基本的に管理する対象として最も適切なものはどれか。","choices":["ファイルの内容とその変更履歴","PCに接続された機器の一覧","GitHubの請求情報","インターネットの通信履歴"],"correct":0,"explain":"Gitは、リポジトリ内のファイルの状態と変更履歴を管理します。空のフォルダそのものは管理しないため、空フォルダを残したい場合は.gitkeepなどのファイルを置く方法がよく使われます。"},{"q":"GitHubに障害が発生したり、インターネット接続が切れたりした場合でもできる操作はどれか。","choices":["ローカルリポジトリでコミットする","GitHubへプッシュする","GitHub上でPull Requestを作成する","GitHub上のIssueにコメントする"],"correct":0,"explain":"ローカルリポジトリでの変更、ステージング、コミット、履歴確認などはインターネットなしでも行えます。GitHubとの送受信やGitHub上の機能には接続が必要です。"},{"q":"GitとGitHubを組み合わせて使う利点として最も適切なものはどれか。","choices":["ローカルで履歴管理しながら、オンラインで共有・レビューできる","コミットしなくてもすべての変更が自動公開される","GitHubがすべてのコードの正しさを保証する","インターネットがなくてもGitHubの画面を操作できる"],"correct":0,"explain":"Gitでローカルの変更履歴を管理し、GitHubでリポジトリの共有、Pull Request、レビュー、Issue管理などを行うことで、個人作業と共同作業を組み合わせられます。"}]},{"num":"2","title":"リポジトリの基本操作","questions":[{"q":"「git init」コマンドの役割として正しいものはどれか。","choices":["リモートリポジトリを削除する","現在のフォルダを新しいGitリポジトリとして初期化する","変更内容をコミットする","ファイルをGitHubへアップロードする"],"correct":1,"explain":"git initは、現在のディレクトリをGitで管理するための新しいリポジトリとして初期化するコマンドです。実行すると隠しフォルダ「.git」が作成されます。"},{"q":"「git clone」コマンドの役割として正しいものはどれか。","choices":["リモートリポジトリを自分のPCに複製する","ファイルを完全に削除する","コミット履歴をすべて消去する","ブランチを作成する"],"correct":0,"explain":"git cloneは、GitHubなどにあるリモートリポジトリを丸ごと自分のPC（ローカル環境）にコピーするコマンドです。"},{"q":"「.git」フォルダの役割として正しいものはどれか。","choices":["画像ファイルを保存する場所","そのリポジトリの変更履歴や設定情報を管理する場所","一時的なゴミ箱","GitHubのログイン情報を保存する場所"],"correct":1,"explain":".gitフォルダには、コミット履歴やブランチ情報など、そのリポジトリをGitで管理するために必要なデータがすべて格納されています。通常のファイル操作では触らないのが基本です。"},{"q":"ローカルリポジトリにリモートリポジトリの場所を登録するコマンドはどれか。","choices":["git remote add origin","git delete origin","git push origin","git status"],"correct":0,"explain":"git remote add origin <URL>は、ローカルリポジトリに対して「origin」という名前でリモートリポジトリの接続先を登録するコマンドです。"},{"q":"GitHub上のリポジトリを「Public」に設定した場合の特徴として正しいものはどれか。","choices":["自分だけが閲覧できる","誰でもインターネット経由でリポジトリの中身を閲覧できる","自動的に削除される","コミットができなくなる"],"correct":1,"explain":"Publicリポジトリは、URLを知っている・検索した第三者を含め、誰でも中身を閲覧できる設定です。逆にPrivateは招待されたメンバーのみ閲覧可能です。"},{"q":"「git status」コマンドで確認できることはどれか。","choices":["変更されたファイルやステージング状況などの現在の状態","GitHubのアカウント残高","インターネットの通信速度","PCのバッテリー残量"],"correct":0,"explain":"git statusは、どのファイルが変更されているか、ステージング（git add）されているかなど、現在のリポジトリの状態を確認するコマンドです。"},{"q":"「.gitignore」ファイルの役割として正しいものはどれか。","choices":["Gitの管理対象から除外したいファイル・フォルダを指定する","コミットメッセージのテンプレートを作る","リポジトリを暗号化する","GitHubのユーザー名を保存する"],"correct":0,"explain":".gitignoreファイルに記載したファイルやフォルダは、Gitの追跡（バージョン管理）対象から除外されます。パスワードや一時ファイルなどを除外する際によく使われます。ただし、すでにGitで追跡されているファイルは、あとから.gitignoreに追加しても自動的には追跡対象から外れない点に注意が必要です。"},{"q":"GitHub上でリポジトリを削除できる操作として正しいものはどれか。","choices":["Insightsタブから削除する","Settingsタブの最下部にある「Delete this repository」から削除する","READMEを空にすると自動で削除される","コミットを0件にすると削除される"],"correct":1,"explain":"リポジトリの削除はSettingsタブの一番下にある「Danger Zone」から行います。取り消しが難しい重大な操作で、リポジトリ名の入力など複数の確認手順が設けられていますが、GitHubでは条件を満たす一部のリポジトリであれば、削除後90日以内なら復元できる場合があります。"},{"q":"新しいリポジトリを作る際に選べる「テンプレートリポジトリ」機能の説明として正しいものはどれか。","choices":["既存のリポジトリの構成をひな形として新規リポジトリを作成できる","他人のリポジトリを勝手に書き換えられる","リポジトリのバックアップを自動で取る機能","コミット履歴を検索する機能"],"correct":0,"explain":"テンプレートリポジトリとして登録されたリポジトリは、「Use this template」ボタンから、そのファイル構成を引き継いだ新しいリポジトリをすぐに作成できます。"},{"q":"既存のGitHubリポジトリの名前を変更するにはどうすればよいか。","choices":["リポジトリを一度削除してから作り直すしかない","Settingsタブでリポジトリ名を変更できる","READMEのタイトルを変えると自動で反映される","名前の変更はできない仕様になっている"],"correct":1,"explain":"GitHubではSettingsタブの「Repository name」欄から名前を変更できます。旧URLから新URLへは自動的にリダイレクトされますが、GitHub PagesやActionsで参照されるURLなど、一部リダイレクトされない例外もあります。"},{"q":"登録されているリモートリポジトリの名前とURLを確認するコマンドはどれか。","choices":["git remote -v","git status -v","git branch -v","git init -v"],"correct":0,"explain":"git remote -vを実行すると、originなどのリモート名と、取得（fetch）・送信（push）に使われるURLを確認できます。"},{"q":"git cloneでリポジトリを複製した直後、複製元のリモートには通常どの名前が設定されるか。","choices":["main","origin","clone","remote"],"correct":1,"explain":"git cloneを実行すると、複製元のURLが通常はoriginという名前のリモートとして自動登録されます。originは慣例的な名前であり、後から変更できます。"},{"q":"登録済みのoriginのURLを新しいURLに変更するコマンドはどれか。","choices":["git remote set-url origin <新しいURL>","git remote add origin <新しいURL>","git clone origin <新しいURL>","git status origin <新しいURL>"],"correct":0,"explain":"すでに存在するoriginの接続先を変更する場合は、git remote set-url origin <新しいURL>を使います。git remote addは、新しいリモートを追加するコマンドです。"},{"q":"既存のGitリポジトリ内でもう一度git initを実行した場合の説明として正しいものはどれか。","choices":["既存のコミット履歴が必ずすべて削除される","リポジトリが再初期化され、通常は既存の履歴を上書きしない","GitHub上のリポジトリが削除される","すべてのファイルが自動でコミットされる"],"correct":1,"explain":"既存リポジトリでgit initを実行すると再初期化されますが、通常は既存のコミットやファイルを削除しません。ただし、作業場所を間違えないよう、実行前に現在のフォルダを確認することが大切です。"},{"q":"リポジトリ内の「.git」フォルダを削除すると、一般的にどうなるか。","choices":["作業ファイルを残したまま、Gitの履歴や設定が失われる","GitHubアカウントが削除される","すべての作業ファイルも必ず削除される","自動的に新しいリポジトリが作成される"],"correct":0,"explain":"「.git」フォルダにはコミット履歴、ブランチ、リモート設定などが保存されています。これを削除すると作業ファイルは残りますが、そのフォルダがGitリポジトリとして認識されなくなります。"},{"q":"git statusで「Untracked files」と表示されるファイルはどのような状態か。","choices":["Gitがまだ追跡していない新しいファイル","すでにリモートへ送信済みのファイル","削除が完了したファイル","コンフリクトが解決済みのファイル"],"correct":0,"explain":"Untracked filesは、作業フォルダには存在するものの、まだGitの追跡対象として追加されていないファイルです。必要ならgit addでステージングします。"},{"q":"すでに追跡中のファイルを、PC上には残したままGitの追跡対象から外すコマンドはどれか。","choices":["git rm --cached <ファイル名>","git rm <ファイル名>","git delete <ファイル名>","git clone --remove <ファイル名>"],"correct":0,"explain":"git rm --cached <ファイル名>を使うと、ファイルをPC上に残したままGitの追跡対象から外せます。その後.gitignoreへ追加し、変更をコミットするのが一般的です。"},{"q":".gitignoreファイルで「#」から始まる行は、通常どのように扱われるか。","choices":["コメントとして扱われる","すべてのファイルを無視する指定になる","リポジトリを削除する命令になる","パスワードとして扱われる"],"correct":0,"explain":".gitignoreでは、#から始まる行は通常コメントです。除外理由やパターンの説明を記録するために使えます。ファイル名に#を含める特殊な場合はエスケープが必要です。"},{"q":"git clone <URL>で保存先のフォルダ名を指定しなかった場合、通常はどうなるか。","choices":["リポジトリ名と同じ名前のフォルダが作成される","必ず「clone」という名前になる","デスクトップ全体がリポジトリになる","フォルダは作成されずファイルだけが散らばる"],"correct":0,"explain":"保存先を指定しないgit cloneでは、通常、リポジトリ名を基にした新しいフォルダが作られ、その中に作業ファイルと.gitフォルダが配置されます。"},{"q":"Gitリポジトリではないフォルダでgit statusを実行した場合、一般的にどうなるか。","choices":["Gitリポジトリではないことを示すエラーが表示される","自動的にgit initが実行される","GitHubへ自動接続される","すべてのファイルが自動でコミットされる"],"correct":0,"explain":"git statusはGitリポジトリ内で使うコマンドです。.gitフォルダのある場所またはその配下でない場合は、「not a git repository」などのエラーが表示されます。"}]},{"num":"3","title":"コミットとプッシュ","questions":[{"q":"「git add」コマンドの役割として正しいものはどれか。","choices":["変更をコミット履歴として確定する","変更したファイルをステージングエリアに追加する","リモートリポジトリへ変更を送信する","ファイルを完全に削除する"],"correct":1,"explain":"git addは、変更したファイルを「次にコミットする対象」としてステージングエリアに追加するコマンドです。この時点ではまだ履歴には記録されません。"},{"q":"「git commit」コマンドの役割として正しいものはどれか。","choices":["ステージングした変更を履歴として記録する","リモートリポジトリを作成する","ファイルをダウンロードする","ブランチを削除する"],"correct":0,"explain":"git commitは、git addでステージングされた変更内容を、メッセージ付きで正式な変更履歴（コミット）として記録するコマンドです。"},{"q":"コミットメッセージを書く際に望ましい内容はどれか。","choices":["何も書かなくてよい","その変更の内容や目的が分かる簡潔な説明","絵文字だけを並べる","自分の日記を書く"],"correct":1,"explain":"コミットメッセージは、後から履歴を見返した際に「何を・なぜ変更したか」がすぐ分かるよう、簡潔で分かりやすい内容にすることが推奨されます。"},{"q":"「git push」コマンドの役割として正しいものはどれか。","choices":["ローカルのコミットをリモートリポジトリへ反映する","リモートの変更をローカルへ取り込む","コミットをすべて削除する","ファイルをステージングする"],"correct":0,"explain":"git pushは、ローカルリポジトリで作成したコミットを、GitHubなどのリモートリポジトリへアップロード（反映）するコマンドです。"},{"q":"「ステージングエリア」の説明として正しいものはどれか。","choices":["コミット済みの変更を保管する場所","次のコミットに含める変更を一時的に置いておく場所","GitHub上の公開ページ","削除されたファイルの復元場所"],"correct":1,"explain":"ステージングエリア（インデックス）は、git addされたファイルが「次にコミットする対象」として一時的に置かれる場所です。コミットするまで実際の履歴には記録されません。"},{"q":"「git log」コマンドで確認できることはどれか。","choices":["これまでのコミット履歴","PCの起動ログ","GitHubの通知一覧","インターネットの接続状況"],"correct":0,"explain":"git logは、そのリポジトリに記録されているコミットの履歴（誰が・いつ・何をコミットしたか）を一覧表示するコマンドです。"},{"q":"各コミットに割り振られる一意な識別子（英数字の文字列）を何と呼ぶか。","choices":["コミットハッシュ","パスワード","ブランチ名","IPアドレス"],"correct":0,"explain":"コミットには「コミットハッシュ」と呼ばれる一意な英数字の識別子が自動で付与されます。これを使って特定のコミットを指定したり参照したりできます。"},{"q":"「git commit -m \"メッセージ\"」の「-m」オプションの意味として正しいものはどれか。","choices":["コミットを取り消す","コミットメッセージをその場でコマンドに含めて指定する","マージを実行する","リポジトリを削除する"],"correct":1,"explain":"-mオプションを使うことで、エディタを別途開かずに、コマンドの中でそのままコミットメッセージを指定できます。"},{"q":"「git pull」と「git push」の違いとして正しいものはどれか。","choices":["pullはリモートの変更を取得、pushはローカルの変更をリモートへ送信する","pullとpushはまったく同じ動作をする","pullはファイルを削除し、pushはファイルを復元する","pullはコミットを作成し、pushはブランチを作成する"],"correct":0,"explain":"git pullはリモートリポジトリの最新の変更を自分のローカルに取り込む操作、git pushはその逆でローカルの変更をリモートへ送る操作です。"},{"q":"直前に行ったコミットのメッセージだけを修正したい場合に使うコマンドはどれか。","choices":["git commit --amend","git clone","git init","git remote"],"correct":0,"explain":"git commit --amendを使うと、直前のコミットの内容やメッセージを修正できます。誤字の修正など、公開前のコミットを整える際によく使われます。"},{"q":"git addで誤ってステージングしてしまったファイルを、ステージングから外す（コミット前の状態に戻す）ために使うコマンドはどれか。","choices":["git restore --staged ファイル名","git commit --amend","git tag -d ファイル名","git clone ファイル名"],"correct":0,"explain":"git restore --staged ファイル名（または古い書き方のgit reset ファイル名）を使うと、誤ってgit addでステージングしてしまったファイルを、ステージング前の状態に戻せます。ファイル自体の変更内容は失われません。"},{"q":"直前のコミットを取り消しつつ、変更内容自体はそのまま作業ディレクトリに残しておきたい場合に使うコマンドはどれか。","choices":["git reset --soft HEAD^","git clone","git push --force","git tag -d"],"correct":0,"explain":"git reset --soft HEAD^ を使うと、直前のコミットを取り消しつつ、変更内容はステージングエリアに残したまま作業を続けられます。"},{"q":"「git diff」コマンドの役割として正しいものはどれか。","choices":["ワーキングディレクトリとステージングエリアの差分などを表示する","リポジトリを複製する","ブランチを削除する","コミットメッセージを一括変更する"],"correct":0,"explain":"git diffは、既定では作業ツリー（ワーキングディレクトリ）とステージングエリアの差分を表示するコマンドです。直前のコミットとの差分を見たい場合はgit diff HEAD、ステージング済みの差分だけを見たい場合はgit diff --stagedのように対象を指定します。"},{"q":"コミット前に、変更内容をファイル単位ではなく変更箇所（ハンク）ごとに選んで対話的にステージングできるオプションはどれか。","choices":["git add -p（--patch）","git commit -a","git push --force","git log --oneline"],"correct":0,"explain":"git add -p（--patch）を使うと、1つのファイル内の変更を複数のかたまり（ハンク）に分け、それぞれをステージングするかどうかを対話的に選択できます。1つのファイルに複数の異なる目的の変更が混ざっている場合に便利です。"},{"q":"1つのコミットに、意味のある範囲でまとまった変更だけを含めることが推奨される理由として最も適切なものはどれか。","choices":["後から変更履歴を追いやすくなり、問題発生時の原因特定がしやすくなるため","コミット数が多いほどGitHubの評価が上がるため","ファイル容量を圧縮できるため","リモートリポジトリの通信速度が上がるため"],"correct":0,"explain":"目的ごとに小さくまとまったコミットにしておくことで、変更履歴が追いやすくなり、不具合が起きた際に原因となったコミットを特定しやすくなります。"},{"q":"git pushしようとした際、リモート側に自分のローカルにない新しいコミットが存在するために拒否された。適切な対処法はどれか。","choices":["git pullなどでリモートの変更を取り込んでから、改めてpushする","常にgit push --forceで上書きする","リポジトリを削除して作り直す",".gitignoreに該当ファイルを追加する"],"correct":0,"explain":"リモートに自分の手元にない変更がある場合、pushは拒否されます。まずgit pull（またはfetch+merge）でリモートの変更を取り込み、必要であれば競合を解消してからpushします。"},{"q":"コミットメッセージの1行目（タイトル部分）を書く際の一般的な慣習として適切なものはどれか。","choices":["50文字程度を目安に、変更内容を簡潔にまとめる","必ず500文字以上で詳細に書く","英語のみで書き、日本語は使用禁止とする","絵文字を必ず先頭に付ける"],"correct":0,"explain":"コミットメッセージの1行目は要約として簡潔に（目安として50文字程度）まとめ、必要であれば空行を挟んで詳細な説明を続けるのが一般的な慣習です。"},{"q":"複数の変更済みファイルのうち、特定の1ファイルだけをステージングしたい場合に使うコマンドはどれか。","choices":["git add ファイル名","git commit ファイル名","git push ファイル名","git clone ファイル名"],"correct":0,"explain":"git add ファイル名 と指定することで、変更したファイルのうち特定のファイルだけを選んでステージングエリアに追加できます。"},{"q":"コミットハッシュを扱う際、フルの文字列ではなく先頭7文字程度の短縮形がよく使われる理由として適切なものはどれか。","choices":["多くの場合、先頭の数文字だけでも他のコミットと区別できるため","短縮形でないとGitが動作しないため","短縮形にするとコミット内容が圧縮されるため","GitHub上では短縮形しか表示できない仕様のため"],"correct":0,"explain":"コミットハッシュは、Gitで広く使われているSHA-1形式では通常40桁の16進数です（ハッシュ方式によって桁数は異なります）。多くの場合、先頭7文字程度でも他のコミットと一意に区別できるため、ログ表示などでは短縮形がよく使われます。"},{"q":"「git commit -a」の「-a」オプションが意味するものとして正しいものはどれか。","choices":["Gitで追跡済みの変更ファイルを自動的にステージングしてからコミットする","すべてのブランチを一括でコミットする","リモートリポジトリへ自動的にプッシュする","新規（未追跡）ファイルも含めてすべて自動でコミットする"],"correct":0,"explain":"-aオプションは、Gitがすでに追跡している（一度でもコミットされたことのある）ファイルの変更を自動的にステージングしてからコミットします。ただし新規の未追跡ファイルは対象外で、別途git addが必要です。"}]},{"num":"4","title":"GitHubのUIの使い方","questions":[{"q":"GitHubの「Star」機能の役割として正しいものはどれか。","choices":["リポジトリを削除する","気に入ったリポジトリにブックマークのような印を付ける","コードを自動修正する","リポジトリを非公開にする"],"correct":1,"explain":"Starは、気になったリポジトリに印を付けて、後から自分のページからすぐ見つけられるようにする機能です。人気度の目安としても使われます。"},{"q":"GitHubの「Watch」機能の役割として正しいものはどれか。","choices":["リポジトリの動画を再生する","そのリポジトリの更新通知を受け取る","リポジトリを削除する","他人のパスワードを閲覧する"],"correct":1,"explain":"Watchを設定すると、そのリポジトリのIssueやPRなどの更新があった際に通知を受け取れるようになります。"},{"q":"リポジトリの「Insights」タブで確認できる内容はどれか。","choices":["コミット数の推移や貢献者などの統計情報","パスワードの一覧","ファイルの中身そのもの","他人のメールアドレス"],"correct":0,"explain":"Insightsタブでは、コミットの推移、貢献者（コントリビューター）、コードの変更量など、リポジトリに関する統計情報を確認できます。"},{"q":"リポジトリの「Code」タブで主にできることはどれか。","choices":["ファイル一覧の閲覧やREADMEの表示","課金設定の変更","ユーザーの退会手続き","メールの送受信"],"correct":0,"explain":"Codeタブは、そのリポジトリのデフォルト画面で、ファイル一覧、README、ブランチの切り替えなどが行える中心的なタブです。"},{"q":"リポジトリの「Settings」タブでできることはどれか。","choices":["リポジトリ名の変更や公開設定の変更など各種設定","コミット履歴の閲覧のみ","READMEの内容表示のみ","他人のリポジトリの直接編集"],"correct":0,"explain":"Settingsタブでは、リポジトリ名の変更、公開/非公開の切り替え、コラボレーターの管理、削除など、リポジトリ全体に関わる設定を行えます。"},{"q":"GitHubのプロフィールページに表示される、日々の活動量を緑の濃淡で示すマス目のグラフを何と呼ぶか。","choices":["コントリビューショングラフ（草）","コミットチャート","アクティビティバッジ","スターマップ"],"correct":0,"explain":"このグラフは通称「草」とも呼ばれ、日々のコミットなどの活動量が多いほど色が濃く表示され、継続的な活動の可視化に使われます。"},{"q":"GitHub上で特定のキーワードやユーザーのリポジトリを探す際に使う機能はどれか。","choices":["検索バー","Settingsタブ","Insightsタブ","Wiki"],"correct":0,"explain":"画面上部の検索バーから、リポジトリ名やコード内容、ユーザー名などさまざまな条件でGitHub全体を検索できます。"},{"q":"GitHubで新着のメンションやコメントなどをまとめて確認できる機能はどれか。","choices":["Notifications（通知）","Billing（請求）","Marketplace","Explore"],"correct":0,"explain":"Notifications（通知）画面では、自分が関わるIssueやPull Requestへのコメント、メンションなどの更新情報をまとめて確認できます。"},{"q":"GitHub上のブラウザ画面から、ローカルにクローンせずに直接ファイルを編集する方法はどれか。","choices":["ファイル表示画面の鉛筆アイコン（Edit）から編集する","READMEを削除する","リポジトリをフォークするしかない","Issueを作成するしかない"],"correct":0,"explain":"GitHub上でファイルを開くと表示される鉛筆アイコンをクリックすると、ブラウザ上で直接内容を編集できます。書き込み権限がある自分のリポジトリではそのままコミットできますが、権限がない他人のリポジトリでは、GitHubが自動でフォークを作成し、そこへの変更としてPull Requestを開く流れになります。"},{"q":"リポジトリに「machine-learning」「python」のようなキーワードを付けて分類しやすくする機能はどれか。","choices":["Topics（トピック）","Milestone","Assignee","Webhook"],"correct":0,"explain":"Topicsはリポジトリに関連するキーワードタグを付けられる機能で、同じテーマのリポジトリを見つけやすくするために使われます。"},{"q":"GitHubの「Fork」機能の役割として正しいものはどれか。","choices":["他人のリポジトリを自分のアカウント配下に複製し、自由に変更を加えられるようにする","リポジトリを完全に削除する","リポジトリの閲覧権限を制限する","コミット履歴を1つにまとめる"],"correct":0,"explain":"Forkは、他のユーザーのリポジトリを自分のアカウント配下に複製する機能です。元のリポジトリに影響を与えずに自由に変更を加え、必要であればPull Requestで変更を提案できます。"},{"q":"リポジトリの「Pull requests」タブで主に確認できる内容はどれか。","choices":["作成中・レビュー中・マージ済みなどのPull Requestの一覧","リポジトリのスター数の推移","GitHub Actionsの実行ログ","リポジトリのライセンス情報"],"correct":0,"explain":"Pull requestsタブでは、そのリポジトリに対して作成されたPull Requestを、状態（Open/Closedなど）ごとに一覧で確認できます。"},{"q":"GitHubの「Discussions」機能の主な用途として最も適切なものはどれか。","choices":["バグ報告やタスク管理ではなく、質問や雑談、アイデア出しなどのオープンな対話を行う","コードの差分を自動生成する","リポジトリの権限を管理する","ワークフローを自動実行する"],"correct":0,"explain":"DiscussionsはIssueとは異なり、明確なタスクや不具合報告というよりは、質問・アイデア・雑談など、コミュニティ内のオープンな対話のために使われる機能です。"},{"q":"リポジトリのトップページ右側にある「About」欄で設定できる内容として適切でないものはどれか。","choices":["そのリポジトリへの過去のコミット全件の詳細ログ","リポジトリの簡単な説明文","公開されているWebサイトのURL","Topics（分類用のキーワード）"],"correct":0,"explain":"About欄では説明文・URL・Topicsなどを設定できますが、コミット全件の詳細ログはCommitsやInsightsなど別の場所で確認するものであり、About欄の項目ではありません。"},{"q":"GitHub上でファイルを開いた際に使える「Blame」表示で確認できることはどれか。","choices":["ファイルの各行がどのコミット・誰によって最後に変更されたか","そのファイルのウイルススキャン結果","ファイルのライセンス情報","ファイルを開いたユーザーの一覧"],"correct":0,"explain":"Blame表示を使うと、ファイルの各行が最後にどのコミットで、誰によって変更されたかを行単位で確認できます。"},{"q":"GitHubの「Organization（組織）」アカウントの役割として最も適切なものはどれか。","choices":["複数人・複数チームで、共有のリポジトリや権限をまとめて管理する","個人の学習履歴を記録する","リポジトリのバックアップを自動生成する","コードの著作権を自動的に主張する"],"correct":0,"explain":"Organizationは、個人アカウントとは別に用意できるアカウント種別で、複数のメンバーやチームでリポジトリと権限をまとめて管理する際に使われます。"},{"q":"特定のファイルについて、過去にどのようなコミットで変更されてきたかの履歴を確認したい場合、GitHub上でどうするのが適切か。","choices":["そのファイルの画面で「History」を開く","リポジトリごと削除して作り直す","Settingsタブでファイル名を検索する","Star数を確認する"],"correct":0,"explain":"ファイルの表示画面には「History」というリンクがあり、そのファイルに対する過去のコミット履歴を時系列で確認できます。"},{"q":"GitHubの検索バーで「is:issue is:open」のように条件を絞り込むために使う書き方を一般的に何と呼ぶか。","choices":["検索クオリファイア（絞り込み構文）","コミットハッシュ","プルリクエストテンプレート","ワークフローファイル"],"correct":0,"explain":"「is:」「label:」「author:」のようにキーワードで条件を指定する書き方は検索クオリファイアと呼ばれ、Issue・PR・コードなどを効率的に絞り込むために使われます。"},{"q":"GitHub上でMarkdownファイルを編集する際、記述内容がどのように表示されるかをその場で確認しながら編集できる機能はどれか。","choices":["プレビュー機能","Insights機能","Fork機能","Watch機能"],"correct":0,"explain":"GitHubのファイル編集画面には「Preview」タブがあり、Markdownで書いた内容がどのように表示されるかをリアルタイムで確認しながら編集できます。"},{"q":"リポジトリの「Releases」タブで一般的に確認できる内容として正しいものはどれか。","choices":["バージョンごとにまとめられたリリースノートや配布ファイル","そのリポジトリを閲覧しているユーザーの一覧","未解決のセキュリティ脆弱性の一覧のみ","コードのコメント数の統計"],"correct":0,"explain":"Releasesタブでは、タグに紐づく形でバージョンごとのリリースノートや、配布用にアップロードされたファイル（アセット）を確認できます。"}]},{"num":"5","title":"READMEとライセンス","questions":[{"q":"「README.md」ファイルの主な役割として正しいものはどれか。","choices":["リポジトリの内容や使い方を説明する文書","プログラムを実行するファイル","コミット履歴を保存するファイル","パスワードを保存するファイル"],"correct":0,"explain":"README.mdは、そのプロジェクトが何であるか、使い方やセットアップ方法などを説明するための文書で、リポジトリのCodeタブの下部に自動で表示されます。"},{"q":"README.mdの拡張子「.md」が意味する形式はどれか。","choices":["Markdown形式","動画形式","画像形式","実行ファイル形式"],"correct":0,"explain":"「.md」はMarkdown形式のファイルを表す拡張子です。見出しや箇条書き、リンクなどを簡単な記法で装飾できます。"},{"q":"「LICENSE」ファイルの役割として正しいものはどれか。","choices":["そのコードをどのような条件で利用・改変・再配布してよいかを示す","コミット履歴を管理する","利用者のパスワードを保存する","エラーログを保存する"],"correct":0,"explain":"LICENSEファイルには、そのコードを他人がどのような条件で利用・改変・再配布できるかというルール（利用許諾条件）が記載されます。"},{"q":"「MITライセンス」の特徴として正しいものはどれか。","choices":["著作権表示を残せば商用利用や改変が広く認められる、比較的自由なライセンス","一切の利用・閲覧を禁止するライセンス","有料での利用のみ許可するライセンス","GitHub社の許可がなければ使えないライセンス"],"correct":0,"explain":"MITライセンスは、著作権表示とライセンス文の表示を条件に、商用利用・改変・再配布などを広く認める、比較的制限の緩いオープンソースライセンスの一つです。"},{"q":"GitHub上でリポジトリにライセンスファイルが一切設定されていない場合の扱いとして正しいものはどれか。","choices":["自動的に自由利用できるとみなされる","デフォルトでは著作権が保護され、他人が自由に使ってよいとは限らない","誰でも無条件に改変・販売できる","ライセンスがないと公開自体ができない"],"correct":1,"explain":"ライセンスが明記されていないコードは、たとえ公開されていても著作権法上は保護されており、他人が自由に利用してよいとは限りません。利用条件を明確にするためにライセンスの設定が推奨されます。"},{"q":"GitHubで新規ファイル作成時にライセンス文をテンプレートから選んで追加できる機能はどれか。","choices":["「Add file」→「Create new file」でファイル名にLICENSEと入力すると選べる「Choose a license template」","Insightsタブの機能","Star機能","Fork機能"],"correct":0,"explain":"「Add file」から「Create new file」を選び、ファイル名として「LICENSE」と入力すると、「Choose a license template」というボタンが表示されます。ここから主要なライセンス（MIT、Apache 2.0など）のテンプレートを選ぶだけで内容を自動入力できます。"},{"q":"READMEに書く内容として一般的に適切でないものはどれか。","choices":["プロジェクトの概要や目的","使い方・セットアップ手順","自分の個人的なパスワードや秘密鍵","ライセンスの種類"],"correct":2,"explain":"READMEの公開範囲はリポジトリの可視性（Public/Private）に従うため、必ずしも「誰でも閲覧できる」わけではありません。ただし、Publicでも後から可視性が変わる可能性のあるPrivateリポジトリでも、パスワードや秘密鍵などの機密情報は書くべきではありません。"},{"q":"「CODE_OF_CONDUCT.md」ファイルの役割として正しいものはどれか。","choices":["プロジェクトに参加する際の行動規範やマナーを定める文書","ソースコードの一覧","課金プランの説明","エラーコードの一覧表"],"correct":0,"explain":"CODE_OF_CONDUCT.mdは、コミュニティ内で参加者が守るべき行動規範（ハラスメント禁止など）を定めた文書で、オープンソースプロジェクトでよく用意されます。"},{"q":"「CONTRIBUTING.md」ファイルの役割として正しいものはどれか。","choices":["外部の人がそのプロジェクトに貢献（コントリビュート）する際のルールや手順を説明する","リポジトリの課金情報を管理する","ユーザーのログイン履歴を記録する","画像ファイルを保存する"],"correct":0,"explain":"CONTRIBUTING.mdには、Issueの立て方やPull Requestの送り方など、外部の開発者がプロジェクトに参加・貢献する際のガイドラインが記載されます。"},{"q":"READMEの上部によく表示される、ビルド状況やテスト結果などを一目で示す小さな画像を何と呼ぶか。","choices":["バッジ（Badge）","ラベル（Label）","マイルストーン（Milestone）","ウェブフック（Webhook）"],"correct":0,"explain":"バッジは、CIのビルド状況やバージョン番号、ライセンスの種類などを一目で確認できるようにする小さなアイコン画像で、READMEの見栄えと情報量を高める目的で使われます。"},{"q":"Markdownで見出し（大見出し・中見出しなど）を表現する際に使う記号はどれか。","choices":["# （シャープ、ハッシュ記号）","@ （アットマーク）","% （パーセント記号）","& （アンパサンド）"],"correct":0,"explain":"Markdownでは行頭に # を1つ以上並べることで見出しを表現します。#の数が多いほど小さい見出しになります（例: #は大見出し、##は中見出し）。"},{"q":"Markdownでソースコードを整形して表示するために使う記法はどれか。","choices":["```（バッククォート3つ）で囲む","**（アスタリスク2つ）で囲む","> を行頭に付ける","--- を挟む"],"correct":0,"explain":"バッククォート3つ（```）で囲むとコードブロックとして整形されます。さらに開始のバッククォート直後に言語名を書く（例: ```python）ことで、その言語向けのシンタックスハイライト（色分け）が適用されます。言語名を省略すると、色分けされない場合があります。"},{"q":"分量が多いREADMEに目次（Table of Contents）を用意する目的として最も適切なものはどれか。","choices":["読み手が知りたい項目にすぐアクセスできるようにするため","ファイル容量を増やして信頼性を示すため","GitHubの検索順位を上げるため","ライセンス表記を省略できるようにするため"],"correct":0,"explain":"目次を用意することで、読み手は知りたい情報（インストール方法や使い方など）に素早くアクセスでき、ドキュメントとしての使いやすさが向上します。"},{"q":"「Apache License 2.0」がMITライセンスと比べて持つ特徴として正しいものはどれか。","choices":["特許に関する取り扱いなど、より詳細な条項が含まれている","商用利用を一切禁止している","改変を一切禁止している","ソースコードを絶対に公開してはならないとする"],"correct":0,"explain":"Apache License 2.0はMITライセンスと同様に寛容なライセンスですが、特許権の扱いなど、より詳細な条項が含まれている点が特徴です。"},{"q":"「GPL（GNU General Public License）」のようなコピーレフト型ライセンスの特徴として正しいものはどれか。","choices":["そのコードを利用・改変した派生物を配布する場合、原則としてその派生物にも同じライセンス条件の適用を求める","誰も自由に利用できないよう厳しく制限する","著作権を完全に放棄する","商用利用のみを許可する"],"correct":0,"explain":"コピーレフト型のライセンス（GPLなど）は、そのコードを利用・改変して作られた派生物を配布する際に、原則として同じライセンス条件の適用を求める点が特徴です。単に内部で利用・改変するだけで配布を伴わない場合は、GPLの条件が直接問題になるとは限りません。"},{"q":"リポジトリ直下の「.github」ディレクトリによく配置されるものとして正しいものはどれか。","choices":["Issue/PRのテンプレートやワークフローファイルなど","コンパイル済みのバイナリファイル","個人のパスワード情報","READMEファイルのバックアップのみ"],"correct":0,"explain":".githubディレクトリには、Issueテンプレート、PRテンプレート、GitHub Actionsのワークフローファイル（.github/workflows/）など、GitHub特有の設定ファイルがまとめて配置されます。"},{"q":"README.mdというファイル名がリポジトリのトップページに自動的に内容表示される理由として正しいものはどれか。","choices":["GitHubがこのファイル名を特別に認識し、リポジトリの説明として自動表示する仕様になっているため","README.mdは他のファイルよりファイルサイズが小さいため","拡張子が.mdのファイルはすべて自動表示される仕様のため","README.mdは自動的にコミット数が多くなるため"],"correct":0,"explain":"GitHubはリポジトリ直下のREADME.md（またはREADME）を特別なファイルとして認識し、その内容をリポジトリのトップページに自動的にレンダリングして表示します。"},{"q":"READMEにインストール手順（セットアップ方法）を明記しておく目的として最も適切なものはどれか。","choices":["初めてそのプロジェクトに触れる人が、迷わず環境構築できるようにするため","ライセンス表記を省略するため","GitHubの検索エンジンを最適化するため","コミット履歴を圧縮するため"],"correct":0,"explain":"インストール手順を明記しておくことで、初めてリポジトリを利用する人でも迷わずに環境構築でき、プロジェクトへの参加や利用のハードルを下げられます。"},{"q":"Markdownで箇条書き（リスト）を表現する際に使う記法として正しいものはどれか。","choices":["行頭に「-」や「*」を付ける","行頭に「#」を付ける","文字列を「**」で囲む","文字列を「```」で囲む"],"correct":0,"explain":"Markdownでは行頭に「-」や「*」を付けることで箇条書き（リスト）を表現できます。数字と「.」を使えば番号付きリストにもなります。"},{"q":"ソースコードのファイル冒頭にライセンス表記のコメントを入れることがある理由として最も適切なものはどれか。","choices":["LICENSEファイルを見なくても、そのファイル単体の利用条件が分かるようにするため","コンパイル速度を上げるため","ファイルサイズを削減するため","Gitの差分表示を見やすくするため"],"correct":0,"explain":"プロジェクト全体のLICENSEファイルとは別に、各ソースファイルの冒頭にライセンス表記を入れることで、そのファイルが単独で配布・参照された場合でも利用条件が分かるようにする狙いがあります。"}]},{"num":"6","title":"ブランチ操作とマージ","questions":[{"q":"「ブランチ（branch）」の役割として正しいものはどれか。","choices":["メインの履歴とは別に、独立して作業を進められる分岐を作る","ファイルを完全に削除する","リポジトリを非公開にする","コミットメッセージを暗号化する"],"correct":0,"explain":"ブランチを使うと、メインの開発ラインに影響を与えずに、機能追加やバグ修正などの作業を独立して進めることができます。"},{"q":"リポジトリ作成時に自動的に用意される、基準となるブランチを何と呼ぶことが多いか。","choices":["main（またはmaster）ブランチ","sub ブランチ","test ブランチ","temp ブランチ"],"correct":0,"explain":"多くのリポジトリでは「main」（旧称master）が最初から存在するデフォルトブランチとして扱われ、他のブランチはこれを基準に作成されます。"},{"q":"現在のリポジトリに存在するブランチの一覧を確認するコマンドはどれか。","choices":["git branch","git commit","git clone","git add"],"correct":0,"explain":"git branchコマンドを実行すると、原則としてローカルブランチの一覧が表示されます。リモート追跡ブランチも含めて確認したい場合はgit branch -a、リモートのブランチだけを見たい場合はgit branch -rを使います。"},{"q":"新しいブランチを作成し、同時にそのブランチへ移動するコマンドはどれか。","choices":["git switch -c 新ブランチ名","git status","git log","git remote"],"correct":0,"explain":"git switch -c（旧来はgit checkout -b）を使うと、新しいブランチを作成すると同時にそのブランチへ切り替えることができます。"},{"q":"「マージ（merge）」とは何か。","choices":["あるブランチの変更内容を別のブランチに取り込むこと","ブランチを削除すること","コミット履歴をすべて消すこと","ファイルを暗号化すること"],"correct":0,"explain":"マージは、あるブランチで行われた変更を、別のブランチ（多くの場合main）に統合して取り込む操作です。"},{"q":"同じ箇所を複数人が別々に変更したことでマージがうまくいかなくなる状態を何と呼ぶか。","choices":["コンフリクト（競合）","リセット","フォーク","クローン"],"correct":0,"explain":"コンフリクト（競合）は、複数のブランチで同じ箇所に異なる変更が加えられ、Gitが自動で統合できなくなった状態です。手動でどちらの内容を残すか判断・修正する必要があります。"},{"q":"分岐後に一方のブランチに変更がなく、履歴を一本の直線として単純に繋げられるマージを何と呼ぶか。","choices":["Fast-forward（早送り）マージ","スロー（低速）マージ","リバースマージ","デッドマージ"],"correct":0,"explain":"Fast-forwardマージは、マージ先のブランチに新しいコミットがない場合に、履歴を分岐させずそのまま指し先を進めるだけで完了するシンプルなマージ方法です。"},{"q":"不要になったブランチを削除するコマンドとして正しいものはどれか。","choices":["git branch -d ブランチ名","git init","git clone","git status"],"correct":0,"explain":"git branch -d ブランチ名を実行すると、指定したブランチを削除できます（マージ済みでない場合は-Dで強制削除が必要になることがあります）。"},{"q":"作業前に自分が今どのブランチにいるかを確認することが重要な理由として最も適切なものはどれか。","choices":["意図しないブランチへの変更・コミットを防ぐため","見た目をきれいにするため","通信速度を上げるため","パスワードを変更する必要があるため"],"correct":0,"explain":"作業しているブランチを勘違いしたまま変更・コミットすると、想定外のブランチに変更が混ざってしまうため、作業前に現在のブランチを確認する習慣が重要です。"},{"q":"「git merge」と「git rebase」の違いについて、最も適切な説明はどれか。","choices":["mergeは既存のコミットを保ったまま統合し、rebaseはコミットを別の土台に積み直して新しいコミットとして履歴を書き換える","mergeはファイルを削除し、rebaseはファイルを復元する","mergeとrebaseはまったく同じ動作をする","mergeはリモート専用、rebaseはローカル専用の機能である"],"correct":0,"explain":"mergeは既存のコミットをそのまま残して統合する操作です（分岐先に新しいコミットがないFast-forwardマージの場合は、履歴は直線のままになります）。一方rebaseはコミットの土台（ベース）を変更し、別のコミットとして履歴を積み直すことで、一本の直線の履歴に整理する操作です。"},{"q":"既に存在するブランチへ切り替えるために使うコマンドはどれか。","choices":["git checkout ブランチ名（またはgit switch ブランチ名）","git branch -d ブランチ名","git merge ブランチ名","git commit ブランチ名"],"correct":0,"explain":"既存のブランチへ移動するにはgit checkout ブランチ名、または近年推奨されるgit switch ブランチ名を使います。"},{"q":"マージの際にコンフリクトが発生したファイルの中で、競合箇所を示すために挿入される記号として正しいものはどれか。","choices":["<<<<<<< と ======= と >>>>>>>","###...###","*** ... ***","@@@ ... @@@"],"correct":0,"explain":"コンフリクトが発生すると、ファイル内に<<<<<<<、=======、>>>>>>>という記号で区切られ、双方の変更内容が両方とも表示されます。手動でどちらを残すか編集して解消します。"},{"q":"ローカルに保存されているリモート追跡ブランチの一覧を確認するコマンドとして正しいものはどれか。","choices":["git branch -r","git status","git log","git init"],"correct":0,"explain":"git branch -rは、ローカルに保存されている「リモート追跡ブランチ」の一覧を表示します。これは取得済みの情報であり、実際のリモートの最新状態と合わせるには、あらかじめgit fetch（削除されたブランチも反映したい場合はgit fetch --prune）を実行しておく必要があります。"},{"q":"機能開発の際に、mainブランチとは別に「トピックブランチ（feature branch）」を作って作業する理由として最も適切なものはどれか。","choices":["開発中の変更がmainブランチに影響を与えないようにし、安全に作業を進めるため","ブランチを増やすほどGitHubの評価が上がるため","コミット数を強制的に減らすため","リモートリポジトリの容量を節約するため"],"correct":0,"explain":"トピックブランチを切って作業することで、開発中の未完成な変更がmainブランチに混ざることを防ぎ、他のメンバーへの影響を抑えながら安全に作業を進められます。"},{"q":"「git merge --no-ff」を使うことの意味として正しいものはどれか。","choices":["fast-forwardが可能な場合でも、あえてマージコミットを作成して履歴に残す","コンフリクトを自動的にすべて解消する","マージを取り消す","ブランチを強制的に削除する"],"correct":0,"explain":"--no-ffオプションを付けると、fast-forwardマージが可能な状況でも、あえてマージコミットを作成します。ブランチが分岐・統合した事実を履歴として明示的に残したい場合に使われます。"},{"q":"ブランチ名を「feature/login-form」のように付けることの利点として最も適切なものはどれか。","choices":["ブランチの目的や種類が名前から分かりやすくなる","ブランチの作成速度が速くなる","コミット数が自動的に減る","GitHub Actionsが自動的に高速化する"],"correct":0,"explain":"「feature/」「fix/」のような接頭辞を付けたブランチ名の命名規則を用いることで、そのブランチが何のために作られたかが一目で分かりやすくなります。"},{"q":"現在のブランチに、まだmainへマージされていないブランチを確認したい場合に使うコマンドとして適切なものはどれか。","choices":["git branch --no-merged","git commit --amend","git tag","git clone"],"correct":0,"explain":"git branch --no-mergedを使うと、現在のブランチにまだ取り込まれていない（マージされていない）ブランチの一覧を確認できます。逆にgit branch --mergedはマージ済みのブランチを表示します。"},{"q":"他のメンバーがリモートに作成した新しいブランチを、自分のローカル環境でも作業できるようにする一般的な手順として正しいものはどれか。","choices":["git fetchなどでリモート情報を取得したうえで、そのブランチをチェックアウトする","リポジトリを一から作り直す","そのブランチを必ず削除してから作業する","常にmainブランチのみで作業を続ける"],"correct":0,"explain":"git fetchでリモートの最新情報を取得すると、リモートブランチの存在をローカルからも認識できるようになり、そこからgit checkoutやgit switchでそのブランチの作業を始められます。"},{"q":"マージ中に発生したコンフリクトを手動で解消した後、作業を完了させるための一般的な手順として正しいものはどれか。","choices":["解消したファイルをgit addでステージングし、git commitでマージを完了させる","リポジトリを削除して再クローンする","git pushだけを実行すればよい","コンフリクトしたファイルをすべて削除する"],"correct":0,"explain":"コンフリクト箇所を手動で編集して解消した後は、そのファイルをgit addでステージングし、git commitを実行することでマージ作業を完了させます。"},{"q":"「マージコミット」の説明として正しいものはどれか。","choices":["2つ以上の親コミットを持つ、ブランチの統合を表すコミット","コミットメッセージを持たない特殊なコミット","リモートにのみ存在し、ローカルには作成できないコミット","常に自動的に削除される一時的なコミット"],"correct":0,"explain":"マージコミットは、通常のコミットとは異なり2つ（以上）の親コミットを持つ特殊なコミットで、複数のブランチの変更が統合されたことを表します。"}]},{"num":"7","title":"Pull Request（PR）の流れ","questions":[{"q":"「Pull Request（PR）」とは何か。","choices":["あるブランチの変更を別のブランチに取り込んでほしいと提案・依頼する仕組み","リポジトリを完全に削除する機能","パスワードを再発行する機能","ファイルを圧縮する機能"],"correct":0,"explain":"Pull Requestは、あるブランチで行った変更を、別のブランチ（多くはmain）に取り込んでほしいと提案し、レビューを経てマージするためのGitHubの仕組みです。"},{"q":"Pull Requestを作成する主な目的として最も適切なものはどれか。","choices":["変更内容を他のメンバーに確認・レビューしてもらってから安全にマージするため","リポジトリを非公開にするため","コミット履歴を完全に消すため","自分のパスワードを変更するため"],"correct":0,"explain":"PRを経由することで、変更内容を他のメンバーがレビューし、問題がないか確認したうえでマージできるため、品質の担保やチーム内の情報共有につながります。"},{"q":"PRに対するレビュー（Review）の役割として正しいものはどれか。","choices":["変更内容を確認し、コメントや承認・修正依頼を行う","リポジトリを削除する","ブランチ名を自動生成する","コミットメッセージを暗号化する"],"correct":0,"explain":"レビューでは、他のメンバーがPRの差分（diff）を確認し、コメントを付けたり、問題がなければ承認（Approve）したりします。"},{"q":"PRのレビューにおける「Approve」と「Request changes」の違いとして正しいものはどれか。","choices":["Approveは承認、Request changesは修正が必要という意思表示","Approveは削除依頼、Request changesは承認","両者はまったく同じ意味である","Approveはコメント不可、Request changesはコメント必須"],"correct":0,"explain":"Approveは「この変更内容に問題ない」という承認の意思表示、Request changesは「マージ前に修正してほしい点がある」という差し戻しの意思表示です。"},{"q":"GitHubのPRマージ方法のうち、複数のコミットを1つにまとめてからマージする方式を何と呼ぶか。","choices":["Squash and merge","Merge commit","Rebase and merge","Fork and merge"],"correct":0,"explain":"Squash and mergeは、そのPR内の複数のコミットを1つのコミットにまとめてからマージ先のブランチに統合する方式で、履歴をすっきり保ちたい場合によく使われます。"},{"q":"まだ作業が完了しておらず、レビューの準備ができていないことを示すために使うPRの状態はどれか。","choices":["Draft（下書き）PR","Closed PR","Merged PR","Deleted PR"],"correct":0,"explain":"Draft PRは、作業途中であることを示しつつ早めに変更内容を共有したい場合に使う状態で、準備ができてから通常のPRに切り替えてレビューを依頼します。"},{"q":"PRの特定のコード行にコメントを付ける目的として最も適切なものはどれか。","choices":["その箇所についての質問・指摘・提案を具体的に伝えるため","そのコードを自動的に削除するため","コミット履歴を書き換えるため","リポジトリを非公開にするため"],"correct":0,"explain":"コード行単位でコメントを付けることで、どの部分について指摘・質問しているのかが明確になり、レビューのやり取りがしやすくなります。"},{"q":"PRをマージした後、そのために使った作業用ブランチをどうするのが一般的か。","choices":["役目を終えたら削除することが多い","絶対に削除してはいけない","自動的にmainブランチに名前が変わる","削除するとリポジトリごと消える"],"correct":0,"explain":"マージが完了した作業用ブランチは基本的に不要になるため、リポジトリを整理するために削除することが一般的です。GitHub上ではマージ後に削除ボタンが表示されます。"},{"q":"PRでコンフリクト（競合）が発生した場合、一般的な対処方法として正しいものはどれか。","choices":["競合箇所を確認し、どちらの内容を残すか手動で編集して解決する","PR自体を無条件で削除する","リポジトリごと作り直す","何もせず自動的に解決されるのを待つしかない"],"correct":0,"explain":"コンフリクトはGitが自動で判断できない変更の衝突のため、該当箇所を人が確認し、どちらの内容を残すか（あるいは両方を組み合わせるか）を手動で編集して解決します。"},{"q":"PR作成時に、記載すべき項目のフォーマットをあらかじめ用意しておく機能を何と呼ぶか。","choices":["PRテンプレート","Issueラベル","Webhook","コミットハッシュ"],"correct":0,"explain":"PRテンプレートを設定しておくと、変更内容や確認事項など記載してほしい項目のひな形が自動で入力欄に表示され、PRの説明が漏れなく統一された形式で書きやすくなります。"},{"q":"GitHubのPRマージ方法のうち、各コミットの変更内容を個別に残しつつ、ブランチの分岐を作らず一直線の履歴としてmainに追加する方式を何と呼ぶか。","choices":["Rebase and merge","Squash and merge","Merge commit","Force merge"],"correct":0,"explain":"Rebase and mergeは、PR内の各コミットの変更内容を保持しつつ、それらをmainブランチの先頭に付け替えることで、マージコミットを作らず一直線の履歴にする方式です。ただしGitHub上では実際には新しいコミットとして作り直されるため、コミットのSHA（ハッシュ値）は元のものとは変わる点に注意が必要です。"},{"q":"PRのタイトルと説明文を分かりやすく書くことが重要な理由として最も適切なものはどれか。","choices":["レビュアーが変更内容の背景や目的を素早く理解でき、レビューの質と速度が上がるため","PRの数が自動的に減るため","GitHub Actionsの実行速度が上がるため","コミット数が自動的に集約されるため"],"correct":0,"explain":"PRのタイトルや説明に変更の目的・背景・確認方法などを書いておくことで、レビュアーが内容を素早く理解でき、的確なレビューにつながります。"},{"q":"PR作成時に、特定の人にレビューを依頼するために指定する項目はどれか。","choices":["Reviewers","Assignees","Labels","Milestone"],"correct":0,"explain":"Reviewers欄で特定のユーザーやチームを指定すると、そのPRのレビューを依頼する通知が届きます。Assigneesは主に対応の担当者を示す項目です。"},{"q":"mainブランチへのマージ条件として、CI（テストなど）のステータスチェックがすべて成功していることを必須にする設定の目的として正しいものはどれか。","choices":["テストが通っていない不具合のあるコードが誤ってマージされるのを防ぐため","PRの数を制限するため","レビュアーを自動的に増やすため","コミットメッセージを自動生成するため"],"correct":0,"explain":"ステータスチェックを必須にすることで、テストやビルドが失敗した状態のコードが誤ってmainブランチにマージされることを防げます。"},{"q":"PR画面の「Commits」タブで確認できる内容として正しいものはどれか。","choices":["そのPRに含まれる個々のコミットの一覧と履歴","リポジトリ全体のスター数","他のリポジトリのPR一覧","ライセンス情報"],"correct":0,"explain":"Commitsタブでは、そのPRのブランチに含まれる個々のコミットを、時系列で一覧確認できます。"},{"q":"「Draft PR」として作成したPRを、レビューしてもらえる状態にするために行う操作はどれか。","choices":["「Ready for review」に変更する","PRを一度閉じて新しく作り直す","リポジトリをForkし直す","コミットをすべて削除する"],"correct":0,"explain":"Draft PRは「Ready for review」ボタンを押すことで通常のPRの状態に変わり、レビュアーに正式にレビューを依頼できるようになります。"},{"q":"複数人で1つのコミットを共同作成したことを示すために、コミットメッセージ末尾に付けることがある記法はどれか。","choices":["Co-authored-by: 名前 <メールアドレス>","Reviewed-by-all: true","merge --pair","commit --shared"],"correct":0,"explain":"コミットメッセージの末尾に「Co-authored-by: 名前 <メールアドレス>」と記載することで、複数人でそのコミットを共同作成したことをGitHub上で示せます。"},{"q":"PRを提出する前に、自分自身で変更内容を見直す「セルフレビュー」を行うことの利点として最も適切なものはどれか。","choices":["単純なミスや意図しない変更を自分で先に発見でき、レビュアーの負担を減らせる","レビュアーの承認が不要になる","マージが自動化される","コミットメッセージが自動生成される"],"correct":0,"explain":"提出前に自分でDiffを見直すことで、消し忘れたデバッグコードや不要な変更に自分で気づける場合が多く、レビュアーの負担軽減やレビュー速度の向上につながります。"},{"q":"PR画面の「Files changed」タブで主にできることはどれか。","choices":["変更されたファイルの差分を確認し、行単位でコメントを付ける","リポジトリのスター数を確認する","Organizationのメンバー一覧を見る","リリースタグを作成する"],"correct":0,"explain":"Files changedタブでは、そのPRによって変更されたファイルの差分（Diff）を確認でき、気になる行に直接コメントを付けてレビューできます。"},{"q":"1つのPRに含める変更を、なるべく小さく・目的を絞ってまとめることが推奨される理由として最も適切なものはどれか。","choices":["レビューしやすくなり、問題があった場合の影響範囲も小さく抑えられるため","GitHubの表示速度が上がるため","コミットメッセージを書かなくてよくなるため","自動的にマージされるようになるため"],"correct":0,"explain":"PRが小さく目的が絞られているほど、レビュアーは内容を理解しやすく、また万が一問題があった場合でも影響範囲を小さく抑えられます。"}]},{"num":"8","title":"GitHub Actionsの概要","questions":[{"q":"「GitHub Actions」の説明として最も適切なものはどれか。","choices":["リポジトリ内の処理を自動化できるCI/CDの仕組み","ファイルを圧縮するツール","パスワードを管理するツール","画像を編集するツール"],"correct":0,"explain":"GitHub Actionsは、テストの実行やビルド、デプロイなどの処理を、特定のイベント（プッシュなど）をきっかけに自動で実行できるCI/CD（継続的インテグレーション/デリバリー）の仕組みです。"},{"q":"GitHub Actionsのワークフローファイルが置かれるフォルダはどこか。","choices":[".github/workflows","src/actions","workflows/","assets/github"],"correct":0,"explain":"ワークフローの設定ファイル（YAML形式）は、リポジトリ内の「.github/workflows」フォルダに配置することで、GitHub Actionsに認識されます。"},{"q":"GitHub Actionsの設定ファイルによく使われる、階層構造をシンプルな書式で表現できるファイル形式はどれか。","choices":["YAML","JPEG","MP3","EXE"],"correct":0,"explain":"GitHub Actionsのワークフローは、インデント（字下げ）を使って構造を表す「YAML」形式のファイルで記述します。"},{"q":"ワークフローファイル内の「on:」の役割として正しいものはどれか。","choices":["ワークフローがどのイベントをきっかけに実行されるかを指定する","ファイルを削除するタイミングを指定する","リポジトリの色を指定する","課金プランを指定する"],"correct":0,"explain":"「on:」は、プッシュ時・PR作成時・定期実行時など、そのワークフローがどんなイベントをきっかけに動くかを指定する設定項目です。"},{"q":"GitHub Actionsにおける「ジョブ（job）」と「ステップ（step）」の関係として正しいものはどれか。","choices":["1つのジョブの中に、複数のステップ（実行される処理の単位）が含まれる","ステップの中にジョブが含まれる","ジョブとステップはまったく同じ意味である","ジョブは常に1ステップしか持てない"],"correct":0,"explain":"ワークフローは1つ以上のジョブで構成され、各ジョブの中に、コマンド実行などの具体的な処理単位である「ステップ」が順番に並びます。"},{"q":"他の人が作った再利用可能な処理（Action）を、自分のワークフローに組み込める場所はどこか。","choices":["GitHub Marketplace","GitHubのBillingページ","Insightsタブ","READMEファイル内"],"correct":0,"explain":"GitHub Marketplaceには、テスト実行や通知送信など、さまざまな用途向けに作られた再利用可能なActionが公開されており、探して選ぶ場所として使えます。実際に自分のワークフローへ組み込む際は、YAMLファイルの中でuses:を使ってそのActionを指定します。"},{"q":"「CI（継続的インテグレーション）」の目的として最も適切なものはどれか。","choices":["コードの変更を頻繁に統合し、その都度自動でビルド・テストして問題を早期に発見する","コミットメッセージを自動生成する","リポジトリを非公開にする","ユーザーのパスワードを暗号化する"],"correct":0,"explain":"CI（継続的インテグレーション）は、コードの変更をこまめに統合し、その都度自動テストやビルドを行うことで、不具合を早期に発見・修正しやすくする開発手法です。"},{"q":"「CD（継続的デリバリー/デプロイ）」の目的として最も適切なものはどれか。","choices":["テストを通過したコードを自動的に本番環境などへ配布・反映しやすくする","コミットを禁止する","リポジトリを削除する","ユーザーのアカウントを凍結する"],"correct":0,"explain":"CD（継続的デリバリー／デプロイ）は、テストを通過したコードを自動的に検証環境や本番環境へ配布・反映する仕組みで、リリース作業の手間やミスを減らす目的があります。"},{"q":"実行されたGitHub Actionsのワークフローの成功・失敗結果を確認できる場所はどこか。","choices":["リポジトリの「Actions」タブ","Settingsタブのみ","READMEファイルのみ","Issueのコメント欄のみ"],"correct":0,"explain":"リポジトリの「Actions」タブから、これまで実行されたワークフローの一覧や、それぞれの成功・失敗の結果、詳細なログを確認できます。"},{"q":"APIキーなどの機密情報をワークフロー内で安全に扱うために使う仕組みはどれか。","choices":["Secrets","README","Topics","Insights"],"correct":0,"explain":"Secretsは、APIキーやパスワードなどの機密情報を暗号化してGitHub上に保存し、ワークフロー実行時にだけ安全に読み込んで利用できる仕組みです。コード上に直接書き込むことを避けられます。"},{"q":"ワークフローファイルの「runs-on:」で指定する内容として正しいものはどれか。","choices":["そのジョブを実行するrunner（GitHubホストの仮想環境やself-hosted runnerなど）","ワークフローを実行する曜日","レビュアーの名前","コミットメッセージの書式"],"correct":0,"explain":"runs-on:には、ubuntu-latestやwindows-latestなどGitHubがホストする仮想環境のほか、自分たちで用意したself-hosted runnerのラベルも指定できます。そのジョブをどのrunner（実行環境）で動かすかを指定する項目です。"},{"q":"1つのjob内に定義された複数のsteps（ステップ）は、どのような順序で実行されるか。","choices":["記述された順番に上から順に実行される","常にランダムな順序で実行される","常にすべて同時並行で実行される","GitHubが自動で最適な順序に並べ替える"],"correct":0,"explain":"1つのjob内のstepsは、ワークフローファイルに記述された順番通りに、上から順に実行されます。"},{"q":"多くのワークフローの最初のステップで使われる「actions/checkout」の役割として正しいものはどれか。","choices":["リポジトリのコードを実行環境（仮想マシン）上に取得する","Slackへ通知を送る","テスト結果を自動修正する","ライセンスファイルを生成する"],"correct":0,"explain":"actions/checkoutは、そのワークフローが動作する仮想環境上に、リポジトリのコードをチェックアウト（取得）するための公式Actionで、多くのワークフローの最初のステップとして使われます。"},{"q":"READMEなどによく貼られる、ワークフローの直近の実行が成功したか失敗したかを一目で示す小さな画像を何と呼ぶか。","choices":["ステータスバッジ（Workflow status badge）","コントリビューショングラフ","プロフィールREADME","セキュリティアドバイザリ"],"correct":0,"explain":"ワークフローのステータスバッジは、直近の実行結果（成功/失敗）を示す小さな画像で、READMEに埋め込むことでビルド状況を一目で示せます。"},{"q":"ワークフローのトリガーとして「on: push」と「on: pull_request」を指定した場合の違いとして正しいものはどれか。","choices":["pushは指定ブランチへの直接のコミット反映時、pull_requestはPRの作成・更新時に実行される","pushとpull_requestは全く同じ動作をする","pull_requestはコミットがない限り絶対に実行されない","pushは手動実行専用のトリガーである"],"correct":0,"explain":"on: pushは指定した条件（ブランチなど）へのコミットのプッシュ時に、on: pull_requestはPull Requestの作成・更新時にワークフローを実行するトリガーです。用途に応じて使い分けます。"},{"q":"ワークフローファイル内の「env:」で設定する内容として正しいものはどれか。","choices":["ワークフローやジョブ、ステップの中で使える環境変数","実行対象のOSの種類","レビュアーの一覧","リポジトリのライセンス"],"correct":0,"explain":"env:を使うと、ワークフロー全体・ジョブ・ステップの単位で環境変数を定義でき、スクリプト内などから参照できます。"},{"q":"実行に失敗したワークフローを、コードを変更せずにそのまま再度実行したい場合に使う機能はどれか。","choices":["Actionsタブから「Re-run jobs」を選択する","リポジトリを削除して作り直す","新しいブランチを作成する",".gitignoreを編集する"],"correct":0,"explain":"Actionsタブで対象のワークフロー実行を開き、「Re-run jobs」を選択することで、コードを変更せずに同じワークフローを再実行できます。"},{"q":"Privateリポジトリで GitHub Actions を利用する際に一般的に意識しておく必要があるものはどれか。","choices":["アカウントのプランに応じた実行時間（分）の利用上限や課金","Star数の上限","Watchできる人数の上限","Issueを作成できる最大件数"],"correct":0,"explain":"Privateリポジトリの場合、GitHub Actionsの実行時間はプランごとに無料枠が決まっており、それを超えると課金が発生することがあります。Publicリポジトリでは多くの場合無料で利用できます。"},{"q":"ワークフローのステップで「uses:」キーワードを使う場合、何を指定するか。","choices":["再利用する既存のAction（処理のまとまり）","実行するOSの種類","コミットメッセージの内容","レビュアーのユーザー名"],"correct":0,"explain":"uses:には、Marketplaceなどで公開されている再利用可能なAction（例: actions/checkout@v4）を指定し、そのステップでその処理を利用します。"},{"q":"ワークフローの実行中に生成されたテスト結果やビルド成果物を、実行完了後もダウンロードできるように保存しておく仕組みを何と呼ぶか。","choices":["Artifacts（アーティファクト）","Secrets","Webhooks","Topics"],"correct":0,"explain":"actions/upload-artifactなどを使ってArtifactsとして保存しておくことで、ワークフロー実行後もテスト結果やビルド成果物をダウンロードして確認できます。"}]},{"num":"9","title":"IssuesとProjects","questions":[{"q":"GitHubの「Issue」の主な用途として正しいものはどれか。","choices":["バグ報告や機能要望、タスクなどを記録・管理する","リポジトリを削除する","パスワードを変更する","コミット履歴を暗号化する"],"correct":0,"explain":"Issueは、バグの報告や新機能の提案、やるべきタスクなどを1件ずつ記録し、議論や進捗管理を行うための機能です。"},{"q":"Issueに付けて内容を分類・整理するために使う機能はどれか。","choices":["Label（ラベル）","Fork","Clone","Merge"],"correct":0,"explain":"Labelを使うと、「bug」「enhancement」「question」などの分類をIssueに付けることができ、種類ごとに絞り込んで確認しやすくなります。"},{"q":"Issueにおける「Assignee（担当者）」の役割として正しいものはどれか。","choices":["そのIssueの対応を担当する人を割り当てる","そのIssueを自動で削除する","そのIssueのコメントを禁止する","そのIssueを非公開にする"],"correct":0,"explain":"Assigneeを設定すると、そのIssue（課題）の対応責任者が誰であるかが明確になり、チーム内での役割分担がしやすくなります。"},{"q":"複数のIssueやPRを、特定のリリースや期日に向けてグループ化する機能はどれか。","choices":["Milestone","Watch","Star","Topics"],"correct":0,"explain":"Milestoneは、「v1.0リリース」のような目標に向けて、関連するIssueやPRをまとめて進捗を管理するための機能です。"},{"q":"Pull Requestの説明文に「closes #12」のように記載する目的として正しいものはどれか。","choices":["そのPRがマージされたときに、番号12番のIssueを自動でクローズ（解決済みに）する","12番目のブランチを削除する","12個のファイルを一括削除する","12人のコラボレーターを追加する"],"correct":0,"explain":"「closes #番号」といったキーワードをPRの説明に書いておくと、そのPRがマージされた際に対応するIssueが自動的にクローズされ、対応関係が分かりやすくなります。ただしこの自動クローズは、PRがデフォルトブランチ（多くはmain）を対象としている場合に働く仕組みで、それ以外のブランチを対象とするPRではキーワードが自動クローズとして機能しません。"},{"q":"GitHub Projectsの「カンバンボード」のような機能で管理できることはどれか。","choices":["ToDo・進行中・完了などの状態ごとにタスク（IssueやPR）を並べて進捗管理する","コミットメッセージを暗号化する","リポジトリの容量を圧縮する","パスワードを再発行する"],"correct":0,"explain":"GitHub Projectsでは、item（アイテム）として表示されるIssueやPRを「ToDo」「進行中」「完了」などの列に並べ替えることで、プロジェクト全体の進捗を視覚的に管理できます。"},{"q":"新規Issue作成時に、記載してほしい項目をあらかじめ用意しておく機能を何と呼ぶか。","choices":["Issueテンプレート","PRテンプレート","READMEテンプレート","Actionsテンプレート"],"correct":0,"explain":"Issueテンプレートを設定しておくと、「再現手順」「期待する動作」など報告に必要な項目のひな形が自動表示され、内容の抜け漏れを防ぎやすくなります。"},{"q":"対応が完了したIssueを終了状態にする操作を何と呼ぶか。","choices":["Close（クローズ）する","Delete（完全削除）する","Merge（マージ）する","Fork（フォーク）する"],"correct":0,"explain":"対応が完了したIssueは「Close」することで終了状態になります。削除とは異なり、履歴として内容は残ったまま「解決済み」として扱われます。"},{"q":"Issueやコメントの中で、特定のユーザーに通知を送りつつ言及するために使う記法はどれか。","choices":["@ユーザー名","#ユーザー名","$ユーザー名","&ユーザー名"],"correct":0,"explain":"「@ユーザー名」と記述すると、そのユーザーに通知が届き、コメント内で特定の相手に呼びかける（メンションする）ことができます。"},{"q":"GitHub ProjectsとIssueの関係として正しいものはどれか。","choices":["Projectsのボード上にIssueやPRをitem（アイテム）として紐づけて管理できる","Projectsを作るとすべてのIssueが自動で削除される","ProjectsとIssueはまったく別のサービスで連携できない","Projectsを使うとIssueが作成できなくなる"],"correct":0,"explain":"GitHub Projectsは、既存のIssueやPRをitem（アイテム）としてボード上に配置し、進捗状況に応じて整理・管理するための機能で、Issueと密接に連携しています。"},{"q":"Issueにコメントを重ねて議論を進めることの目的として最も適切なものはどれか。","choices":["関係者間で問題の詳細や対応方針についての認識をすり合わせるため","コミット数を水増しするため","リポジトリの容量を増やすため","ブランチを自動的に作成するため"],"correct":0,"explain":"Issueのコメント欄でやり取りを重ねることで、報告された問題の詳細や、対応方針について関係者間で認識をすり合わせながら進められます。"},{"q":"一度Closeしたが対応が不十分だったIssueを、再度対応対象として戻す操作を何と呼ぶか。","choices":["Reopen（再オープン）","Fork","Rebase","Squash"],"correct":0,"explain":"Closeされたissueを再度対応が必要な状態に戻す操作はReopenと呼ばれ、Issue画面の「Reopen issue」ボタンから行えます。"},{"q":"特に重要なIssueをリポジトリのIssue一覧の上部に固定表示する機能を何と呼ぶか。","choices":["Pin（ピン留め）","Watch","Star","Fork"],"correct":0,"explain":"Pin機能を使うと、特に重要なIssueをIssue一覧の上部に固定表示でき、他のメンバーの目に留まりやすくできます。"},{"q":"「バグ報告用」「機能要望用」など、目的別に複数のIssueテンプレートを用意しておくことの利点として最も適切なものはどれか。","choices":["報告者が種類に応じて必要な情報を漏れなく記載しやすくなる","Issueの作成自体を禁止できる","コミット履歴を自動で書き換えられる","GitHub Actionsの実行を高速化できる"],"correct":0,"explain":"目的別にテンプレートを分けておくことで、報告者はその種類に必要な情報（再現手順や環境情報など）を漏れなく記載しやすくなり、対応する側も内容を把握しやすくなります。"},{"q":"Issueの説明文の中に「- [ ] タスク内容」のように書くことで表現できるものはどれか。","choices":["チェックボックス付きのタスクリスト","折れ線グラフ","コミット履歴","ライセンス表記"],"correct":0,"explain":"「- [ ] 内容」と書くと、チェックボックス付きのタスクリストとして表示され、完了した項目にチェックを入れて進捗を可視化できます。"},{"q":"GitHub Projectsで、標準の「Status」以外に「優先度」や「見積もり」などの独自項目を追加できる機能を何と呼ぶか。","choices":["Custom fields（カスタムフィールド）","Webhooks","Secrets","Topics"],"correct":0,"explain":"GitHub ProjectsのCustom fields機能を使うと、Status以外にも優先度や見積もり工数といった独自の項目を追加し、より柔軟にタスクを管理できます。"},{"q":"Issue番号（#12など）の付き方として正しいものはどれか。","choices":["同じリポジトリ内でIssueとPRを通して連番で自動的に採番される","ユーザーが毎回手動で番号を決めて入力する","作成した日付がそのまま番号になる","Organization全体で共通の番号が使われる"],"correct":0,"explain":"Issue番号は、そのリポジトリ内でIssueとPull Requestを通して自動的に連番で採番されます。手動で指定することはできません。"},{"q":"「good first issue」というラベルが付けられたIssueの意味として最も適切なものはどれか。","choices":["そのプロジェクトに初めて貢献する人向けに、比較的取り組みやすいIssueであることを示す","そのIssueが緊急で最優先であることを示す","そのIssueがすでに解決不可能であることを示す","そのIssueがセキュリティ上の重大な問題であることを示す"],"correct":0,"explain":"「good first issue」は、オープンソースプロジェクトなどで慣習的に使われるラベルで、そのプロジェクトに初めて貢献する人でも取り組みやすい規模・内容のIssueであることを示します。"},{"q":"GitHub Projectsで、同じ内容を「テーブル」「ボード」「ロードマップ」のように異なる形式で切り替えて表示できる仕組みを何と呼ぶか。","choices":["ビュー（View）","テンプレート","ワークフロー","ラベル"],"correct":0,"explain":"GitHub Projectsでは、同じアイテム群をテーブル形式・カンバンボード形式・ロードマップ（タイムライン）形式など、複数のビューに切り替えて表示できます。"},{"q":"Issueに対して👍や🎉などの絵文字で反応を付ける「リアクション」機能の主な目的として最も適切なものはどれか。","choices":["コメントを増やさずに賛否や共感などの意思表示をするため","コミットを自動生成するため","リポジトリを強制的にForkするため","ブランチを自動削除するため"],"correct":0,"explain":"リアクション機能を使うと、「+1です」といった短いコメントを大量に増やさなくても、絵文字1つで賛否や共感などの意思表示を手軽に行えます。"}]},{"num":"10","title":"タグとリリース","questions":[{"q":"Gitにおける「タグ（tag）」の役割として正しいものはどれか。","choices":["特定のコミットに、バージョン番号などの目印となる名前を付ける","ブランチを削除する","ファイルをステージングする","コミットメッセージを暗号化する"],"correct":0,"explain":"タグは、特定の時点のコミットに「v1.0.0」のような分かりやすい名前を付けて、そのバージョンをすぐに参照できるようにする機能です。"},{"q":"現在のコミットに新しいタグを作成するコマンドとして正しいものはどれか。","choices":["git tag v1.0.0","git branch v1.0.0","git clone v1.0.0","git status v1.0.0"],"correct":0,"explain":"git tag タグ名（例：git tag v1.0.0）を実行すると、現在のコミットにそのタグ名を付けることができます。"},{"q":"「v1.2.3」のようなバージョン表記の付け方を何と呼ぶか。","choices":["セマンティックバージョニング","コミットハッシュ","ブランチ命名規則","コンフリクト表記"],"correct":0,"explain":"「メジャー.マイナー.パッチ」の形式で数字を並べる表記自体は「セマンティックバージョニング」と呼ばれますが、単に数字が3つ並んでいるだけでは厳密なSemVerとは限りません。後方互換性の有無に応じてメジャー・マイナー・パッチの各桁を更新するという規則に従って運用されて初めて、セマンティックバージョニングとして機能します。"},{"q":"GitHubの「Release（リリース）」機能の説明として正しいものはどれか。","choices":["特定のタグを基に、変更内容やダウンロード用ファイルなどをまとめて公開する機能","リポジトリを完全に削除する機能","コミットメッセージを一括変換する機能","他人のパスワードを表示する機能"],"correct":0,"explain":"Release機能を使うと、タグを基準に「バージョン1.0を公開しました」といった形で、変更内容の説明やダウンロード用のファイル（Assets）をまとめて公開できます。"},{"q":"リリースの際に記載する、変更点や新機能などをまとめた文書を何と呼ぶか。","choices":["リリースノート","コミットハッシュ","プルリクエスト","Issueテンプレート"],"correct":0,"explain":"リリースノートは、そのバージョンで追加・修正・変更された内容を利用者に分かりやすく伝えるための文書で、Release作成時に記入します。"},{"q":"「タグ」と「ブランチ」の違いとして正しいものはどれか。","choices":["ブランチは新しいコミットが追加されると先端が進むが、タグは特定のコミットを指したまま基本的に動かない","タグは変更を続けられるが、ブランチは動かせない","タグとブランチはまったく同じ機能である","タグはリモートにのみ存在し、ブランチはローカルにのみ存在する"],"correct":0,"explain":"ブランチは新しいコミットを追加すると先端の位置が進んでいきますが、タグはある時点のコミットに固定された目印であり、通常はその後動くことはありません。"},{"q":"ローカルで作成したタグをリモートリポジトリへ反映させるコマンドとして正しいものはどれか。","choices":["git push --tags","git pull --tags","git clone --tags","git status --tags"],"correct":0,"explain":"通常のgit pushだけではタグは送信されないため、タグをリモートへ反映させるにはgit push --tags（または個別指定でのpush）を使う必要があります。"},{"q":"GitHubのReleaseページで、実行ファイルやビルド済みファイルなどを添付できる項目を何と呼ぶか。","choices":["Assets（アセット）","Labels（ラベル）","Milestones（マイルストーン）","Topics（トピック）"],"correct":0,"explain":"AssetsはReleaseに添付できるファイルの領域で、ソースコードのzipに加えて、ビルド済みの実行ファイルなどを利用者向けに配布する際によく使われます。"},{"q":"正式版として公開する前の、テスト段階のバージョンとしてリリースするときに使う設定はどれか。","choices":["Pre-release（プレリリース）","Draft PR","Fork","Watch"],"correct":0,"explain":"Pre-releaseとして公開すると、正式版とは区別して「試験的なバージョン」であることを利用者に明示できます。"},{"q":"そのリポジトリの最新の正式リリースバージョンを確認できる場所はどこか。","choices":["リポジトリの「Releases」ページ","Settingsタブのみ","コミットメッセージの本文のみ",".gitignoreファイルの中"],"correct":0,"explain":"リポジトリの右側やReleasesページから、これまで公開されたリリースの一覧や、現在の最新バージョンを確認できます。"},{"q":"「アノテートタグ（annotated tag）」が「軽量タグ（lightweight tag）」と比べて持つ特徴として正しいものはどれか。","choices":["作成者やメッセージ、日付などの情報を独立したオブジェクトとして保持できる","リモートへは絶対にプッシュできない","1つのコミットに複数個は付けられない","ブランチと完全に同じ挙動をする"],"correct":0,"explain":"アノテートタグ（git tag -aで作成）は、作成者・メッセージ・日付などの情報を持つ独立したオブジェクトとして記録されます。軽量タグは単に特定のコミットを指すだけの簡易的なポインタです。"},{"q":"リポジトリに存在するタグの一覧を確認するコマンドとして正しいものはどれか。","choices":["git tag","git branch -d","git commit --list","git push --tags-only"],"correct":0,"explain":"引数なしでgit tagを実行すると、そのリポジトリに存在するタグの一覧が表示されます。"},{"q":"過去のバージョン（特定のタグ）の時点のコードを手元で確認したい場合に使う操作として適切なものはどれか。","choices":["git checkout タグ名 のように、そのタグを指定してチェックアウトする","そのタグを削除する","git push --forceでタグを上書きする","リポジトリを新規作成する"],"correct":0,"explain":"git checkout タグ名（またはgit switch --detach タグ名）とすることで、そのタグが指すコミット時点のコードの状態を確認できます。"},{"q":"GitHubのReleaseを作成する際、対象期間のPRやコミットから変更点のリストを自動的に作成してくれる機能を何と呼ぶか。","choices":["Generate release notes（リリースノート自動生成）","Auto merge","Dependabot","Code scanning"],"correct":0,"explain":"Generate release notes機能を使うと、前回のリリース以降にマージされたPRなどの情報をもとに、変更点のリストを自動的に作成してくれます。"},{"q":"セマンティックバージョニング「v1.2.3」のうち、後方互換性のない大きな変更を行った際に更新される桁はどれか。","choices":["1番目（メジャーバージョン）","2番目（マイナーバージョン）","3番目（パッチバージョン）","すべて同時に必ず更新される"],"correct":0,"explain":"セマンティックバージョニングでは「メジャー.マイナー.パッチ」の形式が使われ、後方互換性のない変更を行った場合はメジャーバージョン（1番目）を上げるのが慣習です。"},{"q":"誤って作成したローカルのタグを削除するコマンドとして正しいものはどれか。","choices":["git tag -d タグ名","git branch -D タグ名","git commit --delete タグ名","git clone --remove タグ名"],"correct":0,"explain":"ローカルのタグを削除するにはgit tag -d タグ名を使います。すでにリモートへプッシュ済みの場合は、別途git push --delete origin タグ名なども必要です。"},{"q":"GitHubのReleaseを公開せず「Draft（下書き）」として保存しておくことの利点として最も適切なものはどれか。","choices":["内容を確認・調整してから、準備が整ったタイミングで公開できる","そのバージョンのコードを完全に削除できる","他のユーザーからのアクセスを永久に禁止できる","自動的にすべてのIssueをCloseできる"],"correct":0,"explain":"Draftとして保存しておくと、リリースノートの内容や添付ファイルを確認・調整したうえで、準備が整ったタイミングで正式に公開（Publish）できます。"},{"q":"あるブランチの「最新コミット」にタグを打った後、そのブランチにさらに新しいコミットを追加した場合、タグが指すコミットはどうなるか。","choices":["タグを打った時点のコミットを指したまま変わらない","自動的に最新のコミットへ移動する","タグ自体が自動的に削除される","ブランチごと過去の状態に巻き戻る"],"correct":0,"explain":"タグは特定の1つのコミットを指すポインタであり、後からそのブランチに新しいコミットが追加されても、タグ自体は打った時点のコミットを指したまま変わりません。"},{"q":"GitHubのRelease作成画面で、Gitの「タグ名」とは別に設定できる「リリースタイトル」の役割として正しいものはどれか。","choices":["「v1.2.0 - ログイン機能の追加」のように、人間にとって分かりやすい表題を付けられる","タグ名を自動的に上書きする","コミットハッシュを置き換える","ブランチ名を変更する"],"correct":0,"explain":"リリースのタイトルはタグ名とは別に自由に設定でき、「v1.2.0 - ログイン機能の追加」のように内容が分かりやすい表題を付けることができます。"},{"q":"リポジトリの「Tags」一覧ページで一般的に確認できる内容はどれか。","choices":["作成されたタグと、それぞれが指すコミットの一覧","Issueの担当者一覧","Organizationのメンバー一覧","Star数の推移グラフ"],"correct":0,"explain":"Tagsページでは、そのリポジトリに作成されたタグの一覧と、それぞれのタグがどのコミットを指しているかを確認できます。"}]},{"num":"11","title":"チーム開発におけるGitフロー","questions":[{"q":"「Gitフロー（ブランチ運用ルール）」を決める目的として最も適切なものはどれか。","choices":["チームで一貫したブランチの使い方を共有し、開発を混乱なく進めるため","リポジトリを非公開にするため","コミットメッセージを暗号化するため","GitHubの利用料金を下げるため"],"correct":0,"explain":"チーム開発では、ブランチの作り方やマージのタイミングなどのルール（ブランチ戦略）を決めておくことで、複数人が同時に作業しても混乱や事故を防ぎやすくなります。"},{"q":"新機能の開発用に切られる、一時的な作業ブランチを一般的に何と呼ぶか。","choices":["feature（フィーチャー）ブランチ","delete ブランチ","readonly ブランチ","public ブランチ"],"correct":0,"explain":"featureブランチは、特定の機能追加や修正のために作成される作業用ブランチで、完成後にmainなどへマージし、役目を終えたら削除するのが一般的な運用です。"},{"q":"「GitHub Flow」と呼ばれる比較的シンプルなブランチ運用の基本的な流れとして正しいものはどれか。","choices":["mainブランチから作業用ブランチを切り、変更後にPRを作成してレビューを経てmainにマージする","常にmainブランチに直接コミットし続ける","ブランチは一切作成せず全員で1つの履歴を共有する","リポジトリごとに毎回作り直す"],"correct":0,"explain":"GitHub Flowは、mainブランチから作業用ブランチを作成し、変更をPull Requestとして提出、レビューを経てmainにマージするというシンプルな運用方法です。"},{"q":"mainブランチへのマージ時にレビューの承認を必須にするなど、ルールを強制できるGitHubの設定はどれか。","choices":["ブランチ保護ルール（Branch protection rules）","READMEファイル","Topics","Watch設定"],"correct":0,"explain":"ブランチ保護ルールを設定すると、レビュー承認なしのマージや、直接プッシュを禁止するなど、特定のブランチに対するルールを強制できます。"},{"q":"mainブランチへの直接プッシュを禁止し、必ずPR経由でのマージを求める理由として最も適切なものはどれか。","choices":["レビューを経ることで不具合の混入を防ぎ、変更内容をチームで把握しやすくするため","ファイル容量を減らすため","GitHubの利用料金を下げるため","コミットメッセージを自動生成するため"],"correct":0,"explain":"直接プッシュを許可すると、未確認のままコードがmainに入ってしまうリスクがあります。PR経由に統一することで、レビューというチェックポイントを必ず通すことができます。"},{"q":"「Squash and merge」を使う利点として最も適切なものはどれか。","choices":["PR内の細かい試行錯誤のコミットを1つにまとめ、mainの履歴を見やすく保てる","ファイルを自動で暗号化できる","リポジトリの容量を無制限にできる","レビューを不要にできる"],"correct":0,"explain":"作業中は細かい修正コミットが積み重なりがちですが、Squash and mergeでそれらを1つのコミットにまとめることで、mainブランチの履歴をすっきりと分かりやすく保てます。"},{"q":"長期間ブランチを分けたまま作業を続けた場合に起こりやすい問題を防ぐための工夫として適切なものはどれか。","choices":["こまめにmainの変更を自分のブランチに取り込む（pullやmergeする）","一切pullをせず最後にまとめて取り込む","ブランチを作らずすべて直接mainで作業する","コミットメッセージを空にする"],"correct":0,"explain":"作業ブランチを長期間放置すると、mainとの差分が大きくなりコンフリクトが起きやすくなります。こまめに最新のmainを取り込むことで、コンフリクトを小さく抑えやすくなります。具体的にはgit fetch originでリモートの情報を取得したうえで、git merge origin/main（履歴を直線にしたい場合はgit rebase origin/main）を行います。なお、git pullは「現在のブランチに設定された上流ブランチを取得・統合する」操作のため、設定によっては必ずしもmainを取り込むとは限らない点に注意が必要です。"},{"q":"特定のファイルやディレクトリの変更時に、必ずレビューしてほしい人を自動的に指定できるファイルはどれか。","choices":["CODEOWNERS","README.md",".gitignore","LICENSE"],"correct":0,"explain":"CODEOWNERSファイルを設定すると、指定したファイルやフォルダに変更があったPRに対して、担当者が自動的にレビュアーとして割り当てられます。"},{"q":"本番リリースに向けた最終調整を行うために、mainとは別に用意されるブランチを何と呼ぶことが多いか。","choices":["リリースブランチ","ゴミ箱ブランチ","隠しブランチ","パスワードブランチ"],"correct":0,"explain":"リリースブランチは、特定バージョンのリリース準備（最終調整やバグ修正）のために一時的に作成されるブランチで、チームによってはこうした運用ルールを採用しています。"},{"q":"「feat:」「fix:」のように種類を先頭に付けてコミットメッセージを統一するような規約を設ける目的として正しいものはどれか。","choices":["変更の種類が一目で分かるようにし、履歴の把握や自動化をしやすくするため","コミットメッセージを見えなくするため","ファイルサイズを圧縮するため","リポジトリを非公開にするため"],"correct":0,"explain":"Conventional Commitsのようなコミットメッセージの規約を設けると、変更が機能追加なのか修正なのかが一目で分かり、履歴の把握やリリースノートの自動生成などがしやすくなります。"},{"q":"「Git Flow」と呼ばれる伝統的なブランチ運用モデルの特徴として正しいものはどれか。","choices":["main（master）とは別にdevelopブランチを設け、feature・release・hotfixなど役割ごとに複数のブランチを使い分ける","ブランチを一切使わず、常に1本の履歴だけで開発する","常にすべての変更を直接mainへコミットする","レビューを一切行わずマージする"],"correct":0,"explain":"Git Flowは、main（master）とdevelopという2つの永続的なブランチに加え、feature・release・hotfixなど目的別のブランチを使い分ける、比較的体系立ったブランチ運用モデルです。"},{"q":"本番環境で発生した緊急の不具合を、通常の開発フローを待たずに素早く修正するために切られるブランチを一般的に何と呼ぶか。","choices":["hotfixブランチ","featureブランチ","gh-pagesブランチ","orphanブランチ"],"correct":0,"explain":"hotfixブランチは、本番環境で見つかった緊急の不具合を、通常のリリースサイクルを待たずに素早く修正・リリースするために使われるブランチです。"},{"q":"長期間分岐したブランチでの作業中、こまめにmainブランチの変更を自分のブランチへ取り込んでおくことが推奨される理由として正しいものはどれか。","choices":["差分が小さいうちにコンフリクトを解消でき、後でまとめて対応する負担を避けられるため","コミット数が自動的に減るため","GitHub Actionsの課金を回避できるため","レビュアーを自動的に割り当てられるため"],"correct":0,"explain":"mainの変更をこまめに取り込んでおくことで、コンフリクトが発生しても差分が小さいうちに解消でき、開発の終盤で大量のコンフリクトに一度に対応するような事態を避けられます。"},{"q":"コードレビューの目的として、チーム開発において最も適切な考え方はどれか。","choices":["あら探しではなく、コード品質の向上とチーム内でのナレッジ共有を図ること","レビュアーの権限をできるだけ強く示すこと","PRの作成者に罰則を与えること","コミット数を減らすことのみを目的とすること"],"correct":0,"explain":"コードレビューは、単に間違いを指摘する「あら探し」ではなく、コード品質を高めつつ、実装の意図や知識をチーム内で共有する機会として位置づけるのが望ましい考え方です。"},{"q":"フィーチャーブランチをできるだけ短命に保ち、頻繁にmainへ統合していく開発スタイルを何と呼ぶか。","choices":["トランクベース開発（Trunk-based development）","ウォーターフォール開発","コピーレフト開発","フォーク駆動開発"],"correct":0,"explain":"トランクベース開発は、フィーチャーブランチを長期間維持せず、小さな単位でこまめにmain（トランク）へ統合していくことでコンフリクトや統合の手戻りを減らす開発スタイルです。"},{"q":"コミット・プッシュする前に、ローカル環境で自動的にコード整形やテストを実行し、問題があればコミットを止める仕組みを何と呼ぶか。","choices":["pre-commitフック（Gitフック）","Webhook","Milestone","Topics"],"correct":0,"explain":"pre-commitフックなどのGitフックを使うと、コミットの前にコード整形（Lint）やテストを自動実行し、問題があればコミット自体を止めることで、品質の低いコードが混入するのを防げます。"},{"q":"作業がまだ完了しておらず、レビューよりも早期のフィードバックや進捗共有を目的として立てるPRのタイトルによく使われる表記はどれか。","choices":["WIP（Work In Progress）","LTS（Long Term Support）","TBD（To Be Determined）","N/A（Not Applicable）"],"correct":0,"explain":"「WIP」はWork In Progress（作業中）の略で、まだ完成していないが早期に方向性の確認や進捗共有をしたい場合にPRタイトルへ付けられることがある慣習的な表記です（Draft PR機能が使われることも増えています）。"},{"q":"複数人が同じファイルを長期間並行して編集し、まとめて1回で統合しようとする場合に起きやすい問題として最も適切なものはどれか。","choices":["差分が大きくなり、コンフリクトの解消やレビューが困難になりやすい","コミット数が自動的に0になる","GitHubの容量制限に必ず抵触する","ブランチが自動的に削除される"],"correct":0,"explain":"変更をため込んでからまとめて統合しようとすると、差分が大きくなりコンフリクトが複雑化しやすく、レビューも難しくなります。こまめな統合が推奨される理由の一つです。"},{"q":"チーム開発において、mainブランチに直接コミットする権限を制限し、必ずPRとレビューを経由させる運用を導入する目的として最も適切なものはどれか。","choices":["変更内容を第三者が確認したうえで、品質を保ちながら安全にmainへ取り込むため","開発速度を意図的に遅らせるため","コミット履歴を完全に隠すため","Organizationの人数を制限するため"],"correct":0,"explain":"mainへの直接コミットを制限し、PR経由でのレビューを必須にすることで、変更内容を第三者が確認したうえで、品質を保ちながら安全に取り込む運用が可能になります。"},{"q":"チームで開発フローやブランチ運用のルールをドキュメント化して共有しておくことの利点として最も適切なものはどれか。","choices":["メンバーによって運用が食い違うことを防ぎ、新しく参加した人もスムーズに合流できる","コミット数を自動的に増やせる","GitHub Actionsの実行時間が短縮される","コンフリクトが二度と発生しなくなる"],"correct":0,"explain":"ブランチ運用やレビューのルールを明文化しておくことで、メンバー間で運用の解釈が食い違うのを防ぎ、新しく参加したメンバーもルールを参照しながらスムーズに開発に合流できます。"}]},{"num":"12","title":"GitHub Actionsのカスタマイズ","questions":[{"q":"ワークフロー内でAPIのURLなど繰り返し使う値を変数として設定できる項目はどれか。","choices":["env（環境変数）","on","jobs","runs-on"],"correct":0,"explain":"envを使うと、ワークフロー・ジョブ・ステップ単位で環境変数を設定でき、繰り返し使う値をまとめて管理できます。"},{"q":"複数のバージョンやOSの組み合わせで同時にテストを実行できる仕組みを何と呼ぶか。","choices":["マトリックスビルド（matrix）","シングルビルド","ドラフトビルド","サイレントビルド"],"correct":0,"explain":"マトリックスビルドを使うと、たとえば「Node.jsのバージョン違い×OS違い」のような複数の組み合わせを自動生成し、同時並行でテストを実行できます。"},{"q":"Windows・macOS・Linuxなど複数のOS環境でジョブを実行したい場合に指定する項目はどれか。","choices":["runs-on","on","env","secrets"],"correct":0,"explain":"runs-onは、そのジョブをどのOS環境（ubuntu-latest、windows-latestなど）で実行するかを指定する設定項目です。複数指定してマトリックスビルドと組み合わせることもできます。"},{"q":"共通処理を別ファイルに切り出し、複数のワークフローから呼び出して使い回せる仕組みを何と呼ぶか。","choices":["再利用可能なワークフロー（reusable workflow）","使い捨てワークフロー","隠しワークフロー","手動ワークフロー"],"correct":0,"explain":"再利用可能なワークフローとして共通処理を切り出しておくと、複数のリポジトリやワークフローから呼び出して同じ処理を使い回すことができ、重複した記述を減らせます。"},{"q":"コードのプッシュなど自動トリガーではなく、ボタン操作で手動でワークフローを実行できるようにする設定はどれか。","choices":["workflow_dispatch","push","pull_request","schedule"],"correct":0,"explain":"workflow_dispatchを設定すると、GitHubのActionsタブから「Run workflow」ボタンを押すことで、任意のタイミングで手動実行できるようになります。"},{"q":"特定のブランチ（例：mainのみ）へのプッシュ時だけワークフローを実行するにはどうすればよいか。","choices":["on: push: branches: の設定で対象ブランチを指定する","全ブランチで無条件に実行する以外の方法はない","ブランチごとに別リポジトリを作るしかない","手動でその都度コピー＆ペーストする"],"correct":0,"explain":"onのpush設定内にbranchesを指定することで、特定のブランチへのプッシュ時のみワークフローを実行するよう絞り込むことができます。"},{"q":"依存パッケージのインストール結果などを一時保存し、次回以降の実行を高速化する仕組みを何と呼ぶか。","choices":["キャッシュ（cache）","シークレット（secrets）","ラベル（label）","マイルストーン（milestone）"],"correct":0,"explain":"キャッシュを利用すると、依存関係のインストール結果などを保存しておき、次回以降の実行時に再利用することで、ワークフローの実行時間を短縮できます。"},{"q":"GitHubが用意する標準の実行環境ではなく、自分たちで用意したマシンでActionsを実行する仕組みを何と呼ぶか。","choices":["セルフホストランナー","パブリックランナー","ゲストランナー","ドラフトランナー"],"correct":0,"explain":"セルフホストランナーは、GitHubが提供する共有環境ではなく、自社サーバーなど独自に用意したマシンでワークフローを実行できる仕組みで、特殊な環境やスペックが必要な場合に使われます。"},{"q":"特定の条件を満たした場合のみステップを実行したいときに使う設定項目はどれか。","choices":["if:","on:","env:","name:"],"correct":0,"explain":"if:を使うと、直前のステップの結果やブランチ名などの条件に応じて、そのステップを実行するかどうかを制御できます。"},{"q":"毎日決まった時刻など、定期的にワークフローを自動実行したいときに使う設定はどれか。","choices":["schedule（cron形式）","push","workflow_dispatch","pull_request"],"correct":0,"explain":"scheduleトリガーではcron形式で時刻や曜日を指定でき、「毎朝9時に実行」のような定期実行のワークフローを組むことができます。ただし「指定した時刻に必ず実行される」わけではなく、GitHub全体が混雑している時間帯には実行が遅延することがあります。また対象になるのはデフォルトブランチ上のワークフローで、時刻はIANAタイムゾーンを指定できますが、指定しない場合はUTC基準で動作します。"},{"q":"ワークフローファイルの「permissions:」で設定する内容として正しいものはどれか。","choices":["自動発行されるGITHUB_TOKENに与える権限の範囲","実行するOSの種類","レビュアーの一覧","リリースのバージョン番号"],"correct":0,"explain":"permissions:を使うと、ワークフロー実行時に自動発行されるGITHUB_TOKENに対して、読み取り専用にするかIssueへの書き込みを許可するかなど、必要最小限の権限を設定できます。"},{"q":"あるジョブを、別の特定のジョブが完了してから実行したい場合に使う設定項目はどれか。","choices":["needs:","runs-on:","if:","env:"],"correct":0,"explain":"needs:に依存するジョブ名を指定すると、そのジョブが完了する（成功する）まで、指定したジョブの実行が待機されます。ジョブ間の実行順序を制御する際に使います。"},{"q":"あるステップが失敗しても、ワークフロー全体を停止させずに後続の処理を続行させたい場合に使う設定はどれか。","choices":["continue-on-error: true","runs-on: always","if: never","needs: skip"],"correct":0,"explain":"continue-on-error: trueを該当ステップに設定すると、そのステップが失敗してもワークフロー全体は失敗扱いにならず、後続の処理を続行できます。"},{"q":"複数のステップをひとまとまりにして、独自の再利用可能なActionとして定義する仕組みを何と呼ぶか。","choices":["Composite action（複合アクション）","Reusable workflow","Matrix strategy","Self-hosted runner"],"correct":0,"explain":"Composite actionは、複数のステップを1つの独自Actionとしてまとめ、他のワークフローからuses:で呼び出して再利用できるようにする仕組みです。ワークフローファイル自体を呼び出すReusable workflowとは異なります。"},{"q":"同じブランチへの連続したプッシュで、古い実行中のワークフローを自動的にキャンセルして最新のものだけを実行したい場合に使う設定はどれか。","choices":["concurrency:","matrix:","schedule:","cache:"],"correct":0,"explain":"concurrency:とcancel-in-progressの設定を組み合わせることで、同じグループに属する古いワークフロー実行を自動的にキャンセルし、最新の実行だけを走らせることができます。"},{"q":"ワークフロー実行時に自動的に発行される「GITHUB_TOKEN」の説明として正しいものはどれか。","choices":["そのワークフロー実行の中でGitHub APIへアクセスするために自動的に用意される一時的な認証トークン","開発者が手動でGitHubにログインするためのパスワード","コミットメッセージに自動的に挿入される署名","リポジトリのライセンス識別子"],"correct":0,"explain":"GITHUB_TOKENは、ワークフローの実行ごとにGitHubが自動的に発行する一時的な認証トークンで、そのリポジトリに対するAPI操作などに利用されます。"},{"q":"本番環境へのデプロイ前に、特定の承認者の承認を必須にするなど、デプロイ先ごとに保護ルールを設定できる仕組みを何と呼ぶか。","choices":["Environments（環境）","Topics","Milestones","Discussions"],"correct":0,"explain":"Environmentsを設定すると、本番環境などのデプロイ先ごとに、必須レビュアーの指定や特定ブランチのみ許可するなどの保護ルールを設定できます。"},{"q":"ジョブやステップの実行時間が想定より長くかかっている場合に、自動的に強制終了させるための設定はどれか。","choices":["timeout-minutes:","runs-on:","needs:","uses:"],"correct":0,"explain":"timeout-minutes:を設定すると、指定した時間を超えて実行が続いた場合にそのジョブやステップを自動的に強制終了させ、無駄な実行時間の消費を防げます。"},{"q":"「actions/setup-node」のようなActionを使う主な目的として正しいものはどれか。","choices":["ワークフロー実行環境に、指定したバージョンの言語（Node.jsなど）の実行環境をセットアップする","リポジトリのライセンスを自動判定する","Issueにラベルを自動で付ける","コミットメッセージを自動生成する"],"correct":0,"explain":"actions/setup-nodeのようなセットアップ用Actionを使うと、ワークフローの実行環境に指定したバージョンのNode.jsなどをインストールし、その後のビルドやテストのステップで利用できるようにします。"},{"q":"「マトリクス戦略（matrix strategy）」と「Composite action」の違いとして正しいものはどれか。","choices":["マトリクスは同じジョブを複数の条件の組み合わせで並行実行する仕組み、Composite actionは複数ステップを1つのActionにまとめる仕組みである","両者は全く同じ機能である","マトリクスはOSの指定ができない","Composite actionはトリガー条件を設定する仕組みである"],"correct":0,"explain":"マトリクス戦略はOSやバージョンなどの組み合わせで同じジョブを並行実行するための仕組みであり、Composite actionは複数のステップをまとめて再利用可能な1つのActionとして定義する仕組みで、目的が異なります。"}]},{"num":"13","title":"セキュリティ関連","questions":[{"q":"GitHubアカウントの安全性を高めるために設定が推奨されている、パスワードに加えてもう一つの認証要素を求める仕組みはどれか。","choices":["2段階認証（2FA）","フォーク","ウォッチ","スター"],"correct":0,"explain":"2段階認証（2FA）を設定すると、パスワードに加えてスマートフォンアプリなどでの追加認証が必要になり、万一パスワードが漏れても不正ログインされにくくなります。"},{"q":"コマンドラインやAPIからGitHubへアクセスする際に、パスワードの代わりに使う文字列を何と呼ぶか。","choices":["Personal Access Token（個人アクセストークン）","README","Milestone","Topics"],"correct":0,"explain":"Personal Access Token（PAT）は、パスワードの代わりにコマンドラインやAPI経由でGitHubにアクセスするための認証用文字列で、権限の範囲を細かく設定できます。"},{"q":"パスワードを毎回入力せずに安全にGitHubへ接続する方法として、鍵ペアを使う認証方式はどれか。","choices":["SSHキー認証","READMEファイルへの記載","Issueへのコメント","Insightsタブの閲覧"],"correct":0,"explain":"SSHキー認証は、公開鍵と秘密鍵のペアを使ってGitHubに安全に接続する方式で、一度設定すればパスワードなしでプッシュやプルが行えるようになります。"},{"q":"リポジトリが使用しているライブラリに脆弱性が見つかった際、自動的に検知・通知してくれるGitHubの機能はどれか。","choices":["Dependabot","Watch","Star","Topics"],"correct":0,"explain":"Dependabotは、リポジトリが依存しているライブラリの脆弱性を自動でチェックし、問題が見つかった場合に通知したり、修正のPRを自動で作成してくれる機能です。"},{"q":"APIキーやパスワードなどの機密情報が誤ってコード内にコミットされていないかを検知するGitHubの機能はどれか。","choices":["Secret scanning","Fork","Milestone","Topics"],"correct":0,"explain":"Secret scanningは、コード内にAPIキーなどの機密情報がうっかり含まれていないかを自動で検出し、検知した場合にアラートを出す機能です。"},{"q":"APIキーやパスワードなどを含む「.env」ファイルをリポジトリにコミットしないほうがよい理由として正しいものはどれか。","choices":["Publicリポジトリでは誰でも閲覧でき、機密情報が漏えいするおそれがあるため","ファイルサイズが大きくなりすぎるため",".envファイルはGitで扱えない形式のため","コミット回数の上限を超えてしまうため"],"correct":0,"explain":"Publicリポジトリはもちろん、Privateでも共有範囲によっては情報が漏れるリスクがあるため、機密情報を含む.envファイルは.gitignoreに追加してコミット対象から除外するのが基本です。"},{"q":"Privateリポジトリであっても注意すべきこととして最も適切なものはどれか。","choices":["コラボレーター（共同編集者）の招待範囲や権限を適切に管理する必要がある","Privateなら何をコミットしても絶対に安全である","Privateリポジトリはバックアップが不要である","Privateリポジトリはウイルスに感染しない"],"correct":0,"explain":"Privateリポジトリでも、招待されたコラボレーターは中身を閲覧できるため、誰にどの権限を与えるかの管理は引き続き重要です。「非公開だから絶対安全」とは言えません。"},{"q":"誤ってAPIキーをリポジトリにコミット・公開してしまった場合、まず行うべき対応として最も適切なものはどれか。","choices":["該当のAPIキーを無効化（失効）し、新しいキーを発行し直す","何もせずそのまま放置する","リポジトリの名前だけを変更する","READMEの文字色を変える"],"correct":0,"explain":"一度公開された機密情報は履歴から完全に消すのが難しいため、まずはそのAPIキー自体を無効化・再発行することが最優先の対応となります。"},{"q":"ブランチ保護ルールで「強制プッシュ（force push）」を禁止する目的として正しいものはどれか。","choices":["他人が積み上げたコミット履歴を意図せず上書き・消失させてしまうのを防ぐため","リポジトリの容量を減らすため","コミットメッセージを自動生成するため","ファイルの拡張子を統一するため"],"correct":0,"explain":"強制プッシュは履歴を書き換えてしまう操作のため、共有ブランチで許可すると他のメンバーの変更が失われる危険があります。ブランチ保護ルールで禁止することでこれを防げます。"},{"q":"コード内の潜在的なセキュリティ上の問題を自動で解析・検出するGitHubの機能はどれか。","choices":["Code scanning（CodeQLなど）","Star","Watch","Topics"],"correct":0,"explain":"Code scanningは、CodeQLなどの解析エンジンを使ってソースコード内の脆弱性やセキュリティ上のリスクを自動で検出し、アラートとして知らせてくれる機能です。"},{"q":"「Dependabot security updates」の機能として正しいものはどれか。","choices":["脆弱性が見つかった依存パッケージを修正バージョンへ更新するPRを自動的に作成する","コミットメッセージを自動生成する","リポジトリを自動的にPrivate化する","READMEを自動翻訳する"],"correct":0,"explain":"Dependabot security updatesは、脆弱性が検知された依存パッケージについて、修正済みバージョンへ更新するPull Requestを自動的に作成してくれる機能です。"},{"q":"GPGなどを使ってコミットに署名し、GitHub上で「Verified」バッジが表示されるようにすることの意義として正しいものはどれか。","choices":["そのコミットが、対応する秘密鍵の持ち主によって署名されたことを暗号学的に検証できる","コミット内容を自動的に暗号化して隠せる","コミットメッセージの文字数を圧縮できる","リポジトリの容量を削減できる"],"correct":0,"explain":"コミット署名を行うと、そのコミットが対応する秘密鍵の持ち主によって署名されたことを暗号学的に検証でき、GitHub上で「Verified」バッジとして表示されます。ただしこれは鍵の持ち主による署名であることを示すものであり、現実世界での本人性そのものを絶対的に保証するものではありません。"},{"q":"リポジトリの共同作業者に付与できる「Read」「Write」「Admin」などの権限段階の役割として正しいものはどれか。","choices":["メンバーごとに、閲覧のみ・変更の可否・設定変更の可否など操作できる範囲を制限する","コミットメッセージの言語を制限する","利用できるプログラミング言語を制限する","リポジトリの表示速度を制限する"],"correct":0,"explain":"リポジトリの権限段階を使い分けることで、メンバーごとに閲覧のみ許可するか、コードの変更を許可するか、Settings変更などの管理操作まで許可するかを制限できます。"},{"q":"通常のPersonal Access Token（Classic）と比べて、「Fine-grained personal access token」が持つ特徴として正しいものはどれか。","choices":["アクセスできるリポジトリや操作範囲を、より細かく限定して発行できる","有効期限を設定できない","パスワードの代わりにはならない","2要素認証を無効化する機能である"],"correct":0,"explain":"Fine-grained personal access tokenは、対象リポジトリや許可する操作（読み取りのみ、Issueのみなど）をより細かく限定して発行できるトークンで、漏洩時の影響範囲を抑えやすくなります。"},{"q":"外部のGitHub Appやサードパーティサービスをリポジトリに連携する際に確認すべきこととして最も適切なものはどれか。","choices":["そのアプリが要求している権限の範囲が、目的に対して過剰でないかを確認する","連携するアプリの数はできるだけ多いほうがよい","権限の内容は確認せず、すべて許可してよい","連携すると自動的にリポジトリがPrivate化される"],"correct":0,"explain":"外部アプリを連携する際は、そのアプリが要求する権限（コードの読み取り、Issue操作など）が実際の目的に対して過剰でないかを確認し、不要に強い権限を許可しないことが重要です。"},{"q":"「SECURITY.md」ファイルをリポジトリに用意しておく目的として最も適切なものはどれか。","choices":["脆弱性を発見した人が、どこにどのように報告すればよいかを明示するため","コミットメッセージのフォーマットを統一するため","READMEの内容を自動生成するため","GitHub Actionsの実行時間を短縮するため"],"correct":0,"explain":"SECURITY.mdには、そのプロジェクトで脆弱性を発見した場合の報告先や手順（セキュリティポリシー）を記載しておき、発見者が適切な窓口へ報告しやすくします。"},{"q":"2要素認証（2FA）を設定する際に発行される「バックアップコード」を安全に保管しておくべき理由として正しいものはどれか。","choices":["認証アプリやデバイスを紛失した場合でも、アカウントへログインできる手段を確保するため","コミット履歴を復元するため","パスワードを自動生成するため","リポジトリの容量を増やすため"],"correct":0,"explain":"バックアップコードは、2要素認証に使うスマートフォンなどのデバイスを紛失・故障した場合でも、アカウントへログインできるようにするための予備手段であり、安全な場所に保管しておく必要があります。"},{"q":"依存しているライブラリのバージョンを定期的に最新（あるいは安全なバージョン）に保つことが推奨される理由として最も適切なものはどれか。","choices":["既知の脆弱性が修正されたバージョンを利用でき、セキュリティリスクを抑えられるため","ファイルサイズが必ず小さくなるため","コミット数が自動的に減るため","GitHubの検索順位が上がるため"],"correct":0,"explain":"古いバージョンのライブラリには既知の脆弱性が含まれている場合があり、定期的に更新することで修正済みバージョンを利用でき、セキュリティリスクを抑えられます。"},{"q":"外部の第三者から送られてきたPull Requestに対してGitHub Actionsを実行する際、特に注意すべき点として最も適切なものはどれか。","choices":["PR内のコードにリポジトリのSecretsが不用意に渡り、外部へ漏洩することがないよう設定に注意する","外部からのPRは自動的にすべてマージしてよい","Actionsの実行は外部からのPRでは絶対に行われない仕様である","外部からのPRにはレビューが一切不要である"],"correct":0,"explain":"フォークからの通常のpull_requestトリガーでは、GitHubの既定の仕組みとしてリポジトリのSecretsは基本的にワークフローへ渡されません。ただし、pull_request_targetトリガーを使う場合や、Actionsの設定でフォークからのワークフローにもSecretsへのアクセスを許可するよう変更した場合には、Secretsが不用意に外部へ渡ってしまうリスクが生まれるため、特に注意が必要です。"},{"q":"ブランチ保護ルールの「Require signed commits」を有効にすることの効果として正しいものはどれか。","choices":["署名されていないコミットは、そのブランチへ受け入れられなくなる","すべてのコミットメッセージが自動的に暗号化される","コミット数の上限が設定される","Issueの作成が制限される"],"correct":0,"explain":"「Require signed commits」を有効にすると、GPGなどで署名されていないコミットはそのブランチにマージ・プッシュできなくなり、コミットの真正性をより強く担保できます。"}]},{"num":"14","title":"GitHub CLIとAPI","questions":[{"q":"「GitHub CLI（gh）」の説明として最も適切なものはどれか。","choices":["ターミナル（コマンドライン）上からGitHubの操作を行えるツール","GitHub専用の画像編集アプリ","GitHubのパスワード管理アプリ","GitHubの動画配信サービス"],"correct":0,"explain":"GitHub CLI（ghコマンド）は、ブラウザを開かなくてもターミナルからリポジトリの操作、PRやIssueの作成・確認などが行える公式のコマンドラインツールです。"},{"q":"GitHub CLIを使ってリポジトリをクローンするコマンドはどれか。","choices":["gh repo clone リポジトリ名","gh pr merge","gh issue close","gh auth logout"],"correct":0,"explain":"gh repo cloneコマンドを使うと、GitHub CLIから直接リポジトリをローカルにクローンできます。"},{"q":"GitHub CLIを使って、現在のブランチからPull Requestを作成するコマンドはどれか。","choices":["gh pr create","gh repo create","gh issue create","gh release create"],"correct":0,"explain":"gh pr createコマンドを使うと、ブラウザ画面を開かずにターミナル上でPull Requestを作成できます。"},{"q":"GitHubが提供する、プログラムから様々な操作（リポジトリ作成やIssue取得など）を行える仕組みを何と呼ぶか。","choices":["GitHub API","GitHub Pages","GitHub Copilot","GitHub Sponsors"],"correct":0,"explai
